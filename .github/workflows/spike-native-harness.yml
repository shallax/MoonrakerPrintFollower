# Native-harness spike: a DISPOSABLE probe that
# answers two questions the Linux-only UI harness (tools/ui_test.sh -
# AppImage + Docker + Xvfb, all by construction) cannot answer on a dev
# box, BEFORE any port of it to native runners is attempted:
#
#   Q1  Does a native Cura install and launch on macos-latest (arm64)
#       and windows-latest? The macOS dmg arch follows a policy rather
#       than a hardcoded choice (macos_arch: auto | arm64 | x64): auto
#       prefers the ARM64 dmg when the requested version publishes one
#       and otherwise falls back to X64, which on an arm64 host executes
#       only through Rosetta 2. The decision is taken from the release's
#       own runtime asset list, because the published assets differ
#       across the 5.7-5.13 sweep - the same rule the eventual fetch
#       layer needs per version, so this is its seed, not a throwaway.
#       Forcing x64 on arm64 is the deliberate Rosetta experiment.
#   Q2  Can a running GUI app actually be SEEN on those runners - a
#       still AND a video of the session? The claim that the hosted
#       runners have no usable GUI is being corrected here by evidence,
#       not by assumption. Video is ffmpeg on every platform, replicating
#       the harness's own capture (tests/harness/runner.py:247-250) -
#       same flags, same 15 fps, same scenario.mp4 naming, same
#       whole-display region at the harness geometry, started before the
#       launch and stopped with a signal at teardown the way runner.py
#       stops it (never a kill: an unindexed mp4 is what a kill leaves) -
#       so a native run's artifacts stay comparable with the Linux runs.
#       Only the INPUT DEVICE is per-platform: x11grab (Linux) /
#       avfoundation (macOS) / gdigrab (Windows). Stills come both from
#       the platform's own API and in the harness's ffmpeg -frames:v 1
#       form, and they too are full-display, so neither a still nor the
#       video can be clipped by a scenario that resizes the window.
#   Q3  What must each platform PROVISION? A runner image is trusted for
#       nothing: every external tool a leg touches is probed, reported as
#       present-with-version or absent, installed when the image lacks it,
#       and written as a row of the dependency audit
#       (spike-evidence/dependency-audit.txt). Anything that has to run
#       inside Cura's process must use Cura's OWN bundled Python and Qt -
#       located by searching the installed bundle, never by assuming a
#       path - the same spirit as the Linux harness extracting Cura's
#       matching PyQt6 wheels rather than trusting the host Python. That
#       table is the port's provisioning checklist per platform.
#
# The stock Cura is installed with no plugin: the port's questions are
# install, launch and capture, and nothing else. Every step tolerates
# failure so the later diagnostics still report, all evidence is tee'd
# into spike-evidence/ and appended to a running verdict file, and the
# artifact uploads under `if: always()` so a failed leg still ships the
# log that says WHY.
#
# The installer is the one thing that is NOT evidence: ~160-170 MB per
# platform, regenerable from its pinned release URL, and ~99% of every
# upload. It is downloaded into the runner's temp dir (never uploaded)
# and consumed from there; only the small facts that describe it - the
# asset URL, its size, its sha256 and the arch decision - are written
# into spike-evidence/. Evidence earns its keep while it decides
# something, and those bytes never decide anything.
#
# ASCII ONLY in this file, and the PowerShell steps are why: they run under
# shell: powershell, which is Windows PowerShell 5.1, and it reads the
# runner's temp .ps1 with the ANSI codepage rather than UTF-8. A UTF-8 em
# dash decodes there to byte pairs whose second half IS a valid closing
# double quote, so strings end early and the block dies at PARSE time -
# before a line of it runs, and with no log to show for it. That is what
# killed this file's first run: whole-file rule, one check, and a parse of
# each extracted block before a push rather than after a red run.
#
# NON-GATING BY DESIGN. This workflow runs on ordinary CI events so the
# answer arrives without anyone remembering to ask for it, but it must
# NEVER be added to a required-check set or a merge gate: its expected
# failure mode is "the installer would not run on a hosted runner", which
# is a finding about the runner, not a broken branch. Do not promote it.
# It stays its own file for the same reason - disposable, trivially
# deleted, never a job inside ci.yml.
#
# Trigger scope: pull_request is unscoped, so a proposed change gets the
# answer. push is scoped to main and the release branches on purpose -
# firing two full GUI legs from every branch tip would put real queue
# pressure on the scarcest hosted runners for branches nobody is
# waiting on.
#
#   gh workflow run "Native Harness Spike (disposable)" \
#     -f cura_version=5.12.0 -f macos_arch=x64
name: Native Harness Spike (disposable)

on:
  # Scoped so a branch tip push does not queue two GUI legs per commit.
  push:
    branches:
      - main
      - "release/**"
  # Unscoped: every proposed change should get the answer.
  pull_request:
  # Kept for deliberate runs; the inputs exist only here, so push and
  # pull_request need none and use the defaults below.
  workflow_dispatch:
    inputs:
      cura_version:
        description: "Cura release tag to install"
        required: false
        default: "5.13.0"
        type: string
      macos_arch:
        description: "macOS dmg arch: auto prefers arm64 when published"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - arm64
          - x64

permissions:
  contents: read

jobs:
  spike:
    name: Spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A 180 MB installer plus an install and a 60 s boot per OS sits far
    # below this, but the bound keeps a hung boot from burning an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # github.event.inputs is populated only for workflow_dispatch, so on push
      # and pull_request these evaluated to the EMPTY STRING. The scripts mostly
      # default with ${VAR:-5.13.0}, which hides it - but the config seed reads
      # the version to name the version-stamped config directory, and an empty
      # one made it skip, which is why Cura came up on its first-run wizard and
      # would have stalled the harness's own first gate. The default belongs
      # here, once, where every step sees it.
      CURA_VERSION: ${{ github.event.inputs.cura_version || '5.13.0' }}
      CURA_MACOS_ARCH: ${{ github.event.inputs.macos_arch || 'auto' }}
      EVIDENCE: spike-evidence
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python (a native port would need an interpreter)
        # Nothing in this spike runs Python; the interpreter is here as the
        # port's dependency and as a probe. A failure of this action must
        # not cancel the diagnostics below it, which provision their own.
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "Q1 evidence: environment, arch, Rosetta, display (macOS)"
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          # The runner's bash step runs with -e, which would truncate
          # this report at the first probe missing from the image. The
          # report IS the deliverable, so errexit goes.
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/env-macos.txt"
          {
            echo "=== macOS environment ==="
            date -u
            echo; echo "--- uname -a ---"; uname -a
            echo; echo "--- sw_vers ---"; sw_vers
            echo; echo "--- uname -m / arch ---"; uname -m; arch
            echo; echo "--- runner ---"
            echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH RUNNER_NAME=$RUNNER_NAME"
            echo; echo "--- cpu ---"; sysctl -n machdep.cpu.brand_string
            echo; echo "--- arm64 host? (hw.optional.arm64==1) ---"
            sysctl -n hw.optional.arm64
            echo; echo "--- am I translated? (sysctl.proc_translated==1 means yes) ---"
            sysctl -n sysctl.proc_translated
            echo; echo "--- python ---"; python3 --version
            echo; echo "--- docker present? (the current harness needs it) ---"
            command -v docker || echo "docker: ABSENT"
            echo; echo "--- Xvfb present? ---"
            command -v Xvfb || echo "Xvfb: ABSENT"
            echo
            echo "=== Rosetta 2 (the Q1 question for the x86_64 dmg) ==="
            echo "--- /usr/libexec/rosetta ---"
            ls -ld /usr/libexec/rosetta || echo "/usr/libexec/rosetta: ABSENT"
            echo "--- RosettaUpdateAuto package receipt ---"
            pkgutil --pkg-info=com.apple.pkg.RosettaUpdateAuto || \
              echo "RosettaUpdateAuto receipt: ABSENT"
            echo "--- the real test: arch -x86_64 /usr/bin/true ---"
            if arch -x86_64 /usr/bin/true 2>&1; then
              echo "ROSETTA: OK (an x86_64 binary executed)"
              echo "SPIKE-Q1: rosetta=OK" | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "ROSETTA: FAILED - no x86_64 execution available"
              echo "SPIKE-Q1: rosetta=FAILED" | tee -a "$EVIDENCE/verdict.txt"
            fi
            echo
            echo "=== Display / session (the Q2 question) ==="
            echo "--- DISPLAY / SSH ---"
            echo "DISPLAY=${DISPLAY:-<unset>}"
            echo "SSH_CONNECTION=${SSH_CONNECTION:-<unset>}"
            echo "SSH_TTY=${SSH_TTY:-<unset>}"
            echo "--- who is logged in / at the console ---"
            who
            echo "--- uid ---"; id -u
            echo "--- console owner ---"; ls -l /dev/console
            echo "--- WindowServer running? ---"
            if pgrep -x WindowServer >/dev/null; then
              echo "WindowServer: RUNNING (there is a GUI session)"
            else
              echo "WindowServer: ABSENT (no GUI session)"
            fi
            echo "--- my own GUI session (launchctl gui/<uid>) ---"
            launchctl print "gui/$(id -u)" 2>&1 | head -20
            echo "--- displays ---"
            system_profiler SPDisplaysDataType 2>&1 | head -40
            echo; echo "--- screencapture available? ---"
            command -v screencapture || echo "screencapture: ABSENT"
            echo "--- its flags on THIS macOS (what the still capture uses) ---"
            man screencapture 2>/dev/null | col -b | head -45
            echo "--- ffmpeg present? (THE video recorder on every platform) ---"
            command -v ffmpeg || echo "ffmpeg: ABSENT"
            echo "--- ffprobe (ships with ffmpeg) ---"
            command -v ffprobe || echo "ffprobe: ABSENT"
          } 2>&1 | tee "$LOG"
          exit 0

      - name: "Q1 evidence: install Rosetta if the probe failed (macOS)"
        # Standing insurance, run before the arch policy is applied: if the
        # policy later lands on the X64 dmg (auto with no arm64 asset
        # published, or a forced x64), the download step re-checks this and
        # retries the install, so the x64 path is covered either way.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/rosetta-install.txt"
          {
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "Rosetta already works - nothing to install."
            else
              # If the arm64 image ships without Rosetta, the x64 dmg leg
              # is unanswerable until this runs. sudo is passwordless on
              # the hosted runners.
              echo "Rosetta absent - attempting: softwareupdate --install-rosetta"
              sudo softwareupdate --install-rosetta --agree-to-license
              echo "softwareupdate exit: $?"
              if arch -x86_64 /usr/bin/true 2>&1; then
                echo "ROSETTA after install: OK"
                echo "SPIKE-Q1: rosetta-after-install=OK" \
                  | tee -a "$EVIDENCE/verdict.txt"
              else
                echo "ROSETTA after install: STILL FAILED"
                echo "SPIKE-Q1: rosetta-after-install=FAILED" \
                  | tee -a "$EVIDENCE/verdict.txt"
              fi
            fi
          } 2>&1 | tee "$LOG"
          exit 0

      - name: "Q3 evidence: dependency audit - check, then provision (macOS)"
        # The image is assumed to carry nothing: every external tool this
        # leg runs is probed, recorded as present-with-version or absent,
        # provisioned when absent, and written as a row of the audit. A
        # dependency that cannot be installed is a result to report, never
        # a reason to skip the diagnostic. Installs are bounded, because a
        # stalled network transfer would otherwise eat the job timeout.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/dependency-audit-macos.txt"
          AUDIT="$EVIDENCE/dependency-audit.tsv"
          PLATFORM="macOS/$RUNNER_ARCH"
          INSTALL_BUDGET="${SPIKE_INSTALL_BUDGET:-900}"
          HAVE_BREW=no
          {
            [ -s "$AUDIT" ] || printf 'platform\tcomponent\trole\tstatus\tversion\tnotes\n' >"$AUDIT"
            # ar <component> <role> <status> <version> <notes>
            ar() {
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$PLATFORM" "$1" "$2" "$3" "$4" "$5" >>"$AUDIT"
              echo "[audit] $1 | $3 | $4 | $5"
            }
            # have <component> <role> <cmd> <version-args...>
            have() {
              local comp="$1" role="$2" cmd="$3"
              shift 3
              if command -v "$cmd" >/dev/null 2>&1; then
                local v
                v="$("$cmd" "$@" 2>&1 | head -1)"
                [ -n "$v" ] || v="<no version reported>"
                ar "$comp" "$role" "PREINSTALLED" "$v" "$(command -v "$cmd")"
              else
                ar "$comp" "$role" "ABSENT" "<none>" "not on this image"
              fi
            }
            # have_os <component> <role> <cmd> <note>: tools that ship with
            # macOS and carry no version of their own.
            have_os() {
              if command -v "$3" >/dev/null 2>&1; then
                ar "$1" "$2" "PREINSTALLED" \
                  "tracks macOS $(sw_vers -productVersion 2>/dev/null)" \
                  "$(command -v "$3")"
              else
                ar "$1" "$2" "ABSENT" "<none>" "$4"
              fi
            }
            # bounded <seconds> <cmd...>: run it, kill it if it overruns
            bounded() {
              local limit="$1"
              shift
              "$@" &
              local pid=$!
              local end=$((SECONDS + limit))
              while [ "$SECONDS" -lt "$end" ]; do
                if ! kill -0 "$pid" 2>/dev/null; then
                  wait "$pid"
                  return $?
                fi
                sleep 2
              done
              echo "  ! '$*' exceeded ${limit}s - killing it"
              kill -9 "$pid" 2>/dev/null
              wait "$pid" 2>/dev/null
              return 124
            }
            echo "=== the install path itself, before anything needs it ==="
            if command -v brew >/dev/null 2>&1; then
              HAVE_BREW=yes
              have "brew" "the install path for anything this image lacks" brew --version
            else
              ar "brew" "the install path for anything this image lacks" \
                "ABSENT" "<none>" "no Homebrew: nothing here can be provisioned from the network"
            fi
            echo
            echo "=== external tools this leg runs ==="
            have "bash" "the shell every macOS step runs in" bash --version
            have "curl" "downloads the release asset" curl --version
            have "sudo" "elevation for hdiutil/ditto (passwordless on runners)" sudo --version
            have_os "arch" "the Rosetta probe (arch -x86_64)" arch \
              "Rosetta cannot be verified or forced on this image"
            have_os "softwareupdate" "installs Rosetta 2 when an x64 asset needs it" \
              softwareupdate "an absent Rosetta cannot be provisioned at all"
            echo "--- archive and image-mount tools ---"
            # The port's fetch layer needs these per version; this leg uses
            # hdiutil/ditto for the dmg and keeps unzip/tar in the ledger.
            have_os "hdiutil" "mounts and detaches the dmg (image mount tool)" hdiutil \
              "no dmg can be mounted: the install leg is unanswerable"
            have_os "ditto" "copies the .app out of the mounted dmg" ditto \
              "no bundle can be copied out of the dmg"
            have "tar" "the archiver (tarballs)" tar --version
            if command -v unzip >/dev/null 2>&1; then
              have "unzip" "extracts .zip archives (the Linux fetch uses it for wheels)" unzip -v
            elif [ "$HAVE_BREW" = yes ]; then
              echo "unzip: ABSENT - provisioning it (brew install unzip)"
              bounded "$INSTALL_BUDGET" brew install unzip
              echo "brew install unzip exit: $?"
              if command -v unzip >/dev/null 2>&1; then
                ar "unzip" "extracts .zip archives (the Linux fetch uses it for wheels)" \
                  "INSTALLED BY US" "$(unzip -v 2>&1 | head -1)" "brew install unzip -> $(command -v unzip)"
              else
                ar "unzip" "extracts .zip archives (the Linux fetch uses it for wheels)" \
                  "ABSENT" "<none>" "brew install unzip produced no unzip"
              fi
            else
              ar "unzip" "extracts .zip archives (the Linux fetch uses it for wheels)" \
                "ABSENT" "<none>" "no install path: brew is not on the image"
            fi
            echo "--- tools the diagnostics read state through ---"
            have_os "codesign" "reports the bundle signature (informational)" codesign \
              "the signature report is unavailable"
            have_os "xattr" "reports quarantine attributes on the copied bundle" xattr \
              "the quarantine report is unavailable"
            have_os "/usr/libexec/PlistBuddy" "reads CFBundleExecutable and framework versions" \
              /usr/libexec/PlistBuddy "the launch step falls back to the conventional binary name"
            have_os "pkgutil" "reads the Rosetta receipt" pkgutil "the receipt check is unavailable"
            have_os "lsappinfo" "asks LaunchServices whether a GUI instance exists" lsappinfo \
              "the GUI-instance check is unavailable"
            have_os "pgrep" "process liveness" pgrep "liveness falls back to ps"
            have_os "pkill" "teardown kill, as tools/ui_test.sh:190" pkill "teardown falls back to kill -9"
            have_os "screencapture" "the platform-native still, kept beside the ffmpeg still" \
              screencapture "no native still; the harness's ffmpeg still remains"
            have_os "open" "the LaunchServices retry launch (open -n)" open \
              "the retry launch is unavailable"
            echo
            echo "=== python (a native port drives an interpreter) ==="
            PY3="$(command -v python3 2>/dev/null)"
            if [ -z "$PY3" ]; then
              echo "no python3 at all - provisioning one (brew install python3)"
              if [ "$HAVE_BREW" = yes ]; then
                bounded "$INSTALL_BUDGET" brew install python3
                echo "brew install python3 exit: $?"
              else
                echo "brew: ABSENT too - there is no install path on this image"
              fi
              PY3="$(command -v python3 2>/dev/null)"
              if [ -n "$PY3" ]; then
                ar "python3" "the interpreter a native port drives" "INSTALLED BY US" \
                  "$(python3 --version 2>&1)" "brew install python3 -> $PY3"
              else
                ar "python3" "the interpreter a native port drives" "ABSENT" "<none>" \
                  "no python3 on the image and brew could not provide one"
              fi
            else
              # setup-python puts its interpreter ahead of the image's on
              # PATH, so the resolved path says who provided it.
              case "$PY3" in
                *hostedtoolcache*)
                  ar "python3" "the interpreter a native port drives" "INSTALLED BY US" \
                    "$(python3 --version 2>&1)" "actions/setup-python@v7 toolcache: $PY3"
                  ;;
                *)
                  ar "python3" "the interpreter a native port drives" "PREINSTALLED" \
                    "$(python3 --version 2>&1)" "$PY3"
                  ;;
              esac
            fi
            echo "python3 resolves to: ${PY3:-<none>}"
            echo
            echo "=== the capture toolchain (Q2 depends on these) ==="
            FF_WAS_MISSING=no
            if command -v ffmpeg >/dev/null 2>&1; then
              ar "ffmpeg" "the video recorder (tests/harness/runner.py:247-250) and the ffmpeg still" \
                "PREINSTALLED" "$(ffmpeg -version 2>&1 | head -1)" "$(command -v ffmpeg)"
            else
              FF_WAS_MISSING=yes
              echo "ffmpeg: ABSENT - provisioning it (brew install ffmpeg)"
              if [ "$HAVE_BREW" = yes ]; then
                bounded "$INSTALL_BUDGET" brew install ffmpeg
                echo "brew install ffmpeg exit: $?"
              else
                echo "brew: ABSENT too - there is no install path on this image"
              fi
              if command -v ffmpeg >/dev/null 2>&1; then
                ar "ffmpeg" "the video recorder (tests/harness/runner.py:247-250) and the ffmpeg still" \
                  "INSTALLED BY US" "$(ffmpeg -version 2>&1 | head -1)" \
                  "brew install ffmpeg -> $(command -v ffmpeg)"
              else
                ar "ffmpeg" "the video recorder (tests/harness/runner.py:247-250) and the ffmpeg still" \
                  "ABSENT" "<none>" "no ffmpeg and no install path: the video leg is a reported result"
              fi
            fi
            if command -v ffprobe >/dev/null 2>&1; then
              if [ "$FF_WAS_MISSING" = yes ]; then
                ar "ffprobe" "reads the recorded container and codec back" "INSTALLED BY US" \
                  "$(ffprobe -version 2>&1 | head -1)" "came with brew install ffmpeg"
              else
                ar "ffprobe" "reads the recorded container and codec back" "PREINSTALLED" \
                  "$(ffprobe -version 2>&1 | head -1)" "$(command -v ffprobe)"
              fi
            else
              ar "ffprobe" "reads the recorded container and codec back" "ABSENT" "<none>" \
                "the container report falls back to file(1)"
            fi
            echo
            echo "=== Rosetta 2 (the x64-on-arm64 dependency) ==="
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              if grep -q 'Rosetta absent' "$EVIDENCE/rosetta-install.txt" 2>/dev/null; then
                ar "Rosetta 2" "executes an x64 Cura on an arm64 host" "INSTALLED BY US" \
                  "softwareupdate --install-rosetta" \
                  "probe arch -x86_64 /usr/bin/true = OK; see rosetta-install.txt"
              else
                ar "Rosetta 2" "executes an x64 Cura on an arm64 host" "PREINSTALLED" \
                  "shipped with the image" "probe arch -x86_64 /usr/bin/true = OK"
              fi
            else
              ar "Rosetta 2" "executes an x64 Cura on an arm64 host" "ABSENT" "<none>" \
                "arch -x86_64 /usr/bin/true fails: an x64 build cannot run here (arm64 assets are unaffected)"
            fi
            echo
            echo "--- rows so far ---"
            cat "$AUDIT"
          } 2>&1 | tee "$LOG"
          exit 0

      - name: "Q1 evidence: environment, session and desktop (Windows)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          # The runner sets ErrorActionPreference=Stop for PowerShell
          # steps, which would abort this report at the first probe the
          # image lacks. The report is the deliverable: tolerate.
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $log = Join-Path $EVIDENCE 'env-windows.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }

          W "=== Windows environment ==="
          W (Get-Date).ToUniversalTime().ToString('u')
          W "--- OS ---"
          W ([System.Environment]::OSVersion.VersionString)
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List | Out-String | ForEach-Object { W $_ }
          # systeminfo is the canonical dump but costs ~20 s per call on a
          # runner; the WMI/CIM queries here are its equivalent, faster.
          W "--- cpu ---"
          Get-CimInstance Win32_Processor |
            Select-Object Name, AddressWidth, Architecture |
            Format-List | Out-String | ForEach-Object { W $_ }
          W "--- runner ---"
          W "RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH RUNNER_NAME=$env:RUNNER_NAME"
          W "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          W "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          W "PSVersion=$($PSVersionTable.PSVersion)"
          # An installer that needs elevation fails silently without it.
          W "elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          W "--- python ---"
          # try/catch, not just ErrorActionPreference: a command that is
          # missing outright must not truncate the report.
          try { W ((& python --version 2>&1) -join ' ') } catch { W "python: NOT FOUND" }
          W "--- curl.exe ---"
          try { W ((& curl.exe --version 2>&1 | Select-Object -First 1) -join ' ') } catch { W "curl.exe: NOT FOUND" }
          W "--- screen recorders (video capture depends on these) ---"
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ff) { W "ffmpeg: $($ff.Source)" } else { W "ffmpeg: ABSENT (choco install attempted later)" }
          $choco = Get-Command choco -ErrorAction SilentlyContinue
          if ($choco) { W "choco: $($choco.Source)" } else { W "choco: ABSENT" }
          W "--- docker present? (the current harness needs it) ---"
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if ($docker) { W "docker: $($docker.Source)" } else { W "docker: ABSENT" }

          W ""
          W "=== Session / desktop (the Q2 question) ==="
          W "--- interactive session? SessionId 0 is the services session ---"
          W "my process SessionId: $((Get-Process -Id $PID).SessionId)"
          W "SESSIONNAME=$env:SESSIONNAME"
          W "--- desktop shell (explorer) running? ---"
          $exp = Get-Process explorer -ErrorAction SilentlyContinue
          if ($exp) {
            W "explorer: RUNNING, SessionId $(($exp | Select-Object -First 1).SessionId)"
          } else {
            W "explorer: ABSENT (no interactive desktop shell)"
          }
          W "--- logged-on sessions ---"
          try { W ((& query session 2>&1) -join "`n") } catch { W "query session: NOT FOUND" }
          W "--- video adapter (a desktop needs one) ---"
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion |
            Format-List | Out-String | ForEach-Object { W $_ }
          W "--- screen bounds as Windows itself reports them ---"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            W "VirtualScreen: x=$($vs.X) y=$($vs.Y) w=$($vs.Width) h=$($vs.Height)"
            W "SPIKE-Q2: desktop=$($vs.Width)x$($vs.Height)"
          } catch {
            W "SystemInformation failed: $($_.Exception.Message)"
            W "SPIKE-Q2: desktop=UNAVAILABLE"
          }
          W "--- DISPLAY (how Linux does it; expected empty here) ---"
          W "DISPLAY=$env:DISPLAY"
          exit 0

      - name: "Q3 evidence: dependency audit - check, then provision (Windows)"
        # The same contract as the macOS audit: probe first, record
        # present-with-version or absent, provision what the image lacks,
        # one row per dependency. A dependency that cannot be installed is
        # a result to report, never a reason to skip the diagnostic.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $log = Join-Path $EVIDENCE 'dependency-audit-windows.txt'
          $audit = Join-Path $EVIDENCE 'dependency-audit.tsv'
          $PLATFORM = "Windows/$env:RUNNER_ARCH"
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          if (-not (Test-Path $audit)) {
            Add-Content -Path $audit -Value "platform`tcomponent`trole`tstatus`tversion`tnotes"
          }
          function AR($component, $role, $status, $version, $notes) {
            Add-Content -Path $audit -Value ("$PLATFORM`t$component`t$role`t$status`t$version`t$notes")
            W "[audit] $component | $status | $version | $notes"
          }
          function Ver($cmd) {
            try {
              $o = & $cmd --version 2>&1 | Select-Object -First 1
              if ($o) { return ($o -join ' ').Trim() }
            } catch {
              return "<version probe failed: $($_.Exception.Message)>"
            }
            return '<no --version>'
          }
          function Have($component, $role, $cmd) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            if (-not $c) { AR $component $role 'ABSENT' '<none>' 'not on this image'; return $null }
            AR $component $role 'PREINSTALLED' (Ver $cmd) $c.Source
            return $c
          }
          # Tools that ship with Windows and carry no version of their own.
          function HaveOS($component, $role, $cmd, $note) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            if (-not $c) { AR $component $role 'ABSENT' '<none>' $note; return $null }
            AR $component $role 'PREINSTALLED' "tracks Windows $([System.Environment]::OSVersion.Version)" $c.Source
            return $c
          }
          function Refresh-Path {
            # choco writes the machine PATH for later steps, not this one
            $env:Path = "$([System.Environment]::GetEnvironmentVariable('Path','Machine'));$([System.Environment]::GetEnvironmentVariable('Path','User'))"
          }
          function Install-WithChoco($component, $role, $cmd, $pkg) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($c) { AR $component $role 'PREINSTALLED' (Ver $cmd) $c.Source; return $c }
            W "$component : ABSENT - provisioning it (choco install $pkg)"
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              AR $component $role 'ABSENT' '<none>' 'no install path: choco is not on this image'
              return $null
            }
            & choco install $pkg -y --no-progress 2>&1 | Select-Object -Last 6 | ForEach-Object { W $_ }
            W "choco install $pkg exit: $LASTEXITCODE"
            Refresh-Path
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($c) {
              AR $component $role 'INSTALLED BY US' (Ver $cmd) "choco install $pkg -> $($c.Source)"
              return $c
            }
            AR $component $role 'ABSENT' '<none>' "choco install $pkg did not put $cmd on PATH (exit $LASTEXITCODE)"
            return $null
          }
          # python needs a probe of its own: a WindowsApps alias stub answers
          # Get-Command but no --version, and must not count as present.
          function Provision-Python {
            $c = Get-Command python -ErrorAction SilentlyContinue
            $v = ''
            if ($c) { $v = ((& python --version 2>&1) -join ' ').Trim() }
            if ($c -and $v) {
              if ($c.Source -like '*hostedtoolcache*') {
                AR 'python' 'the interpreter a native port drives' 'INSTALLED BY US' $v "actions/setup-python@v7 toolcache: $($c.Source)"
              } else {
                AR 'python' 'the interpreter a native port drives' 'PREINSTALLED' $v $c.Source
              }
              return $c
            }
            if ($c) {
              W "python at $($c.Source) answers no --version (a WindowsApps alias stub?) - provisioning a real one"
            } else {
              W "python: ABSENT - provisioning it (choco install python3)"
            }
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              AR 'python' 'the interpreter a native port drives' 'ABSENT' '<none>' 'no install path: choco is not on this image'
              return $null
            }
            & choco install python3 -y --no-progress 2>&1 | Select-Object -Last 6 | ForEach-Object { W $_ }
            W "choco install python3 exit: $LASTEXITCODE"
            Refresh-Path
            $c = Get-Command python -ErrorAction SilentlyContinue
            $v = ''
            if ($c) { $v = ((& python --version 2>&1) -join ' ').Trim() }
            if ($c -and $v) {
              AR 'python' 'the interpreter a native port drives' 'INSTALLED BY US' $v "choco install python3 -> $($c.Source)"
              return $c
            }
            AR 'python' 'the interpreter a native port drives' 'ABSENT' '<none>' "choco install python3 produced no working python (exit $LASTEXITCODE)"
            return $null
          }

          W "=== the install path itself, before anything needs it ==="
          $null = Have 'choco' 'the install path for anything this image lacks' choco
          W ""
          W "=== external tools this leg runs ==="
          AR 'powershell' 'the shell every Windows step runs in' 'PREINSTALLED' ($PSVersionTable.PSVersion.ToString()) "$PSHOME\powershell.exe"
          $null = Provision-Python
          $null = Have 'curl.exe' 'downloads the release asset' curl.exe
          $null = Have 'tar.exe' 'extracts zip/tar archives (libarchive bsdtar is the zip extractor here)' tar.exe
          W "--- install/archive tools for the installer path ---"
          $null = HaveOS 'msiexec.exe' 'installs the .msi fallback' msiexec.exe 'the MSI fallback path is unavailable on this image'
          $null = HaveOS 'expand.exe' 'extracts .cab/.msi payloads (archiver)' expand.exe 'cab extraction is unavailable'
          $null = HaveOS 'taskkill.exe' 'graceful teardown of the recorder, as ui_test.sh:190 does with pkill' taskkill.exe 'teardown falls back to Stop-Process -Force'
          W "--- tools the diagnostics read state through ---"
          $null = HaveOS 'query.exe' 'lists logon sessions (the desktop question)' query.exe 'the session listing is unavailable'
          W ""
          W "=== the capture toolchain (Q2 depends on these) ==="
          $ffWasMissing = -not (Get-Command ffmpeg -ErrorAction SilentlyContinue)
          $null = Install-WithChoco 'ffmpeg' 'the video recorder (tests/harness/runner.py:247-250) and the ffmpeg still' ffmpeg ffmpeg
          $fp = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $fp) {
            AR 'ffprobe' 'reads the recorded container and codec back' 'ABSENT' '<none>' 'the container report falls back to size and file type'
          } elseif ($ffWasMissing) {
            AR 'ffprobe' 'reads the recorded container and codec back' 'INSTALLED BY US' (Ver ffprobe) "came with choco install ffmpeg -> $($fp.Source)"
          } else {
            AR 'ffprobe' 'reads the recorded container and codec back' 'PREINSTALLED' (Ver ffprobe) $fp.Source
          }
          W ""
          W "=== libraries the capture path loads ==="
          foreach ($asm in @('System.Drawing', 'System.Windows.Forms')) {
            try {
              Add-Type -AssemblyName $asm
              $a = [AppDomain]::CurrentDomain.GetAssemblies() |
                Where-Object { $_.GetName().Name -eq $asm } | Select-Object -First 1
              if ($a) {
                AR $asm 'GDI still capture (CopyFromScreen / virtual-screen bounds)' 'PREINSTALLED' ($a.GetName().Version.ToString()) $a.Location
              } else {
                AR $asm 'GDI still capture (CopyFromScreen / virtual-screen bounds)' 'ABSENT' '<none>' 'loaded but not visible in the AppDomain'
              }
            } catch {
              AR $asm 'GDI still capture (CopyFromScreen / virtual-screen bounds)' 'ABSENT' '<none>' "Add-Type failed: $($_.Exception.Message)"
            }
          }
          $clr = if ($PSVersionTable.ContainsKey('CLRVersion')) { $PSVersionTable.CLRVersion.ToString() } else { [System.Environment]::Version.ToString() }
          AR '.NET Framework' 'backs System.Drawing / System.Windows.Forms and Add-Type' 'PREINSTALLED' $clr "[System.Environment]::Version = $([System.Environment]::Version)"
          foreach ($mod in @('CimCmdlets', 'Microsoft.PowerShell.Security')) {
            $m = Get-Module -ListAvailable $mod | Sort-Object Version -Descending | Select-Object -First 1
            if ($m) {
              AR "$mod (PowerShell module)" 'CIM environment queries / Authenticode check on the installer' 'PREINSTALLED' ($m.Version.ToString()) $m.Path
            } else {
              AR "$mod (PowerShell module)" 'CIM environment queries / Authenticode check on the installer' 'ABSENT' '<none>' 'the corresponding diagnostic is unavailable'
            }
          }
          W ""
          W "--- rows so far ---"
          Get-Content $audit | ForEach-Object { W $_ }
          exit 0

      - name: "Q1 evidence: download the pinned Cura (macOS)"
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          # Downloaded with curl, never a browser: no com.apple.quarantine
          # xattr is applied, so Gatekeeper is not part of this test.
          set +e
          mkdir -p "$EVIDENCE"
          VERSION="${CURA_VERSION:-5.13.0}"
          REQUEST="${CURA_MACOS_ARCH:-auto}"
          LOG="$EVIDENCE/download-macos.txt"
          BASE="https://github.com/Ultimaker/Cura/releases/download/${VERSION}"
          DECISION="$EVIDENCE/macos-arch.txt"
          # The installer is ~170 MB, regenerable from the pinned URL below,
          # and would otherwise ride every upload. It goes to the runner's
          # temp dir, which is not uploaded, and is left there for the
          # install step to consume (nothing deletes it mid-run, so a retry
          # or a later step still finds it). Only the small facts about it -
          # URL, size, sha256 - are written as evidence.
          INSTALLER_DIR="${RUNNER_TEMP:-/tmp}/cura-installers"
          mkdir -p "$INSTALLER_DIR"
          INSTALLER_TXT="$EVIDENCE/cura-installer.txt"
          case "$REQUEST" in
            auto|arm64|x64) ;;
            *) REQUEST=auto ;;
          esac
          {
            echo "requested version : $VERSION"
            echo "requested arch    : ${CURA_MACOS_ARCH:-auto} (auto | arm64 | x64)"
            echo
            echo "--- the two assets the arch policy asks about ---"
            # The policy needs one bit per arch - is this file published? - and
            # a HEAD on the public download URL answers exactly that, from the
            # same host the installer itself comes from, consuming no REST
            # budget. The API listing it replaces was a single point of failure
            # for the whole leg: one 403 there meant no arch, no download, no
            # install, no launch and no evidence, on every run.
            # 200/302 means the frontend will hand the file over; 404 means the
            # release does not publish it. --fail stays off deliberately: the
            # status code is the answer here, and --fail discards it.
            ARM64_ASSET="UltiMaker-Cura-${VERSION}-macos-ARM64.dmg"
            X64_ASSET="UltiMaker-Cura-${VERSION}-macos-X64.dmg"
            PROBE_STATE=""
            probe_asset() {
              # retries only what a throttle or a transient error produces, and
              # logs every go, so a retry is visible rather than hidden
              local asset="$1" attempt=0 code=""
              for wait_s in 0 5 15; do
                if [ "$wait_s" -gt 0 ]; then
                  echo "  ${asset}: retrying in ${wait_s}s (last status: ${code:-none})"
                  sleep "$wait_s"
                fi
                attempt=$((attempt + 1))
                code="$(curl -sSI -o /dev/null -w '%{http_code}' \
                  --max-time 60 "$BASE/$asset")"
                echo "  ${asset}: HTTP ${code:-none} (attempt ${attempt})"
                case "$code" in
                  200|302) PROBE_STATE=published; return 0 ;;
                  404) PROBE_STATE=absent; return 0 ;;
                esac
              done
              PROBE_STATE=unknown
              return 1
            }
            ARM64_STATE=unknown
            X64_STATE=unknown
            probe_asset "$ARM64_ASSET" && ARM64_STATE="$PROBE_STATE"
            probe_asset "$X64_ASSET" && X64_STATE="$PROBE_STATE"
            echo "arm64 dmg published: $ARM64_STATE"
            echo "x64 dmg published  : $X64_STATE"
            if [ "$ARM64_STATE" = unknown ] || [ "$X64_STATE" = unknown ]; then
              echo "SPIKE-Q1: download=FAILED (the published-asset probe returned no usable status: arm64=${ARM64_STATE} x64=${X64_STATE})" \
                | tee -a "$EVIDENCE/verdict.txt"
              echo "::error title=SPIKE-Q1 macOS download FAILED::the published-asset probe got no usable HTTP status after 3 attempt(s) (arm64=${ARM64_STATE}, x64=${X64_STATE}) - there is no arch decision, so nothing was downloaded; see $LOG"
              exit 1
            fi
            HAS_ARM64=no
            HAS_X64=no
            if [ "$ARM64_STATE" = published ]; then HAS_ARM64=yes; fi
            if [ "$X64_STATE" = published ]; then HAS_X64=yes; fi
            echo
            # The macOS arch policy, driven by what the release actually
            # publishes for the requested version - never by a hardcoded
            # per-version table (the probe above read that out).
            # The sweep spans 5.7-5.13 and the published assets differ
            # across it, so this rule is exactly what the eventual fetch
            # layer needs per version: the spike is the seed of it, not a
            # throwaway.
            #   auto   prefer arm64 when published; else x64, which needs
            #          Rosetta on an arm64 host to execute at all
            #   arm64  force it; fail loudly when the version has none
            #   x64    force it; fail loudly when the version has none
            #          (forcing x64 on an arm64 host IS the Rosetta probe)
            echo
            ARCH_TAG=""
            WHY=""
            case "$REQUEST" in
              arm64)
                if [ "$HAS_ARM64" = yes ]; then
                  ARCH_TAG=ARM64
                  WHY="forced by the macos_arch input; the release publishes it"
                fi
                ;;
              x64)
                if [ "$HAS_X64" = yes ]; then
                  ARCH_TAG=X64
                  WHY="forced by the macos_arch input; the release publishes it"
                fi
                ;;
              *)
                if [ "$HAS_ARM64" = yes ]; then
                  ARCH_TAG=ARM64
                  WHY="auto: the release publishes an arm64 dmg"
                elif [ "$HAS_X64" = yes ]; then
                  ARCH_TAG=X64
                  WHY="auto: no arm64 dmg published, falling back to x64"
                fi
                ;;
            esac
            if [ -z "$ARCH_TAG" ]; then
              echo "SPIKE-Q1: macos-arch=FAILED (${REQUEST} is unpublished for ${VERSION} - see the list above)" \
                | tee -a "$EVIDENCE/verdict.txt"
              exit 1
            fi
            echo "chosen: $ARCH_TAG - $WHY"
            printf '%s\n' "$ARCH_TAG" >"$DECISION"
            printf 'SPIKE-Q1: macos-arch=%s (%s)\n' "$ARCH_TAG" "$WHY" \
              | tee -a "$EVIDENCE/verdict.txt"
            # An x64 build on an arm64 host executes only through Rosetta,
            # so say that outright, with the probe result backing it.
            if [ "$ARCH_TAG" = X64 ]; then
              HOST_ARCH="$(uname -m)"
              echo "host arch: $HOST_ARCH"
              if [ "$HOST_ARCH" = arm64 ]; then
                if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                  echo "Rosetta is not working - installing it: an x64 Cura cannot"
                  echo "execute here without it"
                  sudo softwareupdate --install-rosetta --agree-to-license
                  echo "softwareupdate exit: $?"
                fi
                if arch -x86_64 /usr/bin/true 2>&1; then
                  echo "SPIKE-Q1: rosetta-required=YES (x64 asset on an arm64 host), probe=OK - Rosetta is what makes this binary execute" \
                    | tee -a "$EVIDENCE/verdict.txt"
                else
                  echo "SPIKE-Q1: rosetta-required=YES (x64 asset on an arm64 host), probe=FAILED - this binary cannot execute here" \
                    | tee -a "$EVIDENCE/verdict.txt"
                fi
              else
                echo "SPIKE-Q1: rosetta-required=NO (x64 asset on an x64 host, ${HOST_ARCH})" \
                  | tee -a "$EVIDENCE/verdict.txt"
              fi
            else
              echo "SPIKE-Q1: rosetta-required=NO (native arm64 asset)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi
            ASSET="UltiMaker-Cura-${VERSION}-macos-${ARCH_TAG}.dmg"
            URL="${BASE}/${ASSET}"
            INSTALLER="$INSTALLER_DIR/$ASSET"
            echo
            echo "--- download: $URL ---"
            curl -L --fail --retry 3 --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              -w "http_code=%{http_code} bytes=%{size_download}\n" \
              -o "$INSTALLER" "$URL"
            rc=$?
            echo "curl exit: $rc"
            if [ "$rc" -ne 0 ]; then
              echo "SPIKE-Q1: download=FAILED (curl exit $rc)" \
                | tee -a "$EVIDENCE/verdict.txt"
              echo "::error title=SPIKE-Q1 macOS download FAILED::$URL returned curl exit $rc after 3 retries - no installer on disk; see $LOG"
              exit 1
            fi
            echo "--- what landed (in RUNNER_TEMP, not uploaded) ---"
            ls -l "$INSTALLER"
            du -h "$INSTALLER"
            file "$INSTALLER"
            # The bytes are regenerable and stay out of the upload; these
            # lines are what the installer was, and they are the evidence.
            SIZE="$(wc -c <"$INSTALLER" | tr -d ' ')"
            SHA="$(shasum -a 256 "$INSTALLER" 2>/dev/null | cut -d' ' -f1)"
            {
              echo "asset       : $ASSET"
              echo "url         : $URL"
              echo "file        : $INSTALLER (in RUNNER_TEMP, never uploaded)"
              echo "size        : $SIZE bytes ($(du -h "$INSTALLER" | cut -f1))"
              echo "sha256      : ${SHA:-unavailable (no shasum)}"
              echo "arch policy : $ARCH_TAG - $WHY"
              echo "host arch   : $(uname -m)"
            } >"$INSTALLER_TXT"
            cat "$INSTALLER_TXT"
            echo "SPIKE-Q1: download=OK ($(du -h "$INSTALLER" | cut -f1), sha256 ${SHA:-unavailable})" \
              | tee -a "$EVIDENCE/verdict.txt"
          } 2>&1 | tee "$LOG"
          # The pipeline's status belongs to tee, so the verdict is
          # re-derived from what the run actually recorded.
          if grep -qE 'SPIKE-Q1: (download|macos-arch)=FAILED' \
            "$EVIDENCE/verdict.txt" 2>/dev/null; then
            exit 1
          fi

      - name: "Q1 evidence: download the pinned Cura (Windows)"
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          # Same reason as the macOS leg: the release listing is a GitHub API
          # call and is rate-limited per source IP when it is anonymous, so
          # it goes out with the run's own token. contents: read is enough
          # and is not widened here.
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $log = Join-Path $EVIDENCE 'download-windows.txt'
          $verdict = Join-Path $EVIDENCE 'verdict.txt'
          # The installer is ~160 MB, regenerable from the pinned URL below,
          # and would otherwise ride every upload. It goes to the runner's
          # temp dir, which is not uploaded, and stays there for the install
          # step to consume (nothing deletes it mid-run, so a retry or a
          # later step still finds it). Only the small facts about it - URL,
          # size, sha256, signature - are written as evidence.
          $tempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }
          $installerDir = Join-Path $tempRoot 'cura-installers'
          New-Item -ItemType Directory -Force $installerDir | Out-Null
          $installerTxt = Join-Path $EVIDENCE 'cura-installer.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          function V($m) { W $m; Add-Content -Path $verdict -Value $m }
          $ver = if ($env:CURA_VERSION) { $env:CURA_VERSION } else { '5.13.0' }

          $base = "https://github.com/Ultimaker/Cura/releases/download/$ver"
          $exeName = "UltiMaker-Cura-$ver-win64-X64.exe"
          $msiName = "UltiMaker-Cura-$ver-win64-X64.msi"
          $exeUrl = "$base/$exeName"
          W "requested version : $ver"
          W "installer url     : $exeUrl"

          W ""
          W "--- every download URL the release actually publishes ---"
          # The listing is the rate-limited call here too, so it carries the
          # run's token. Unlike the macOS leg it decides nothing - the
          # installer URL is fixed by version - so a failure is reported and
          # the download still proceeds, but the HTTP status is named rather
          # than left to be inferred from a curl error nobody read.
          $apiUrl = "https://api.github.com/repos/Ultimaker/Cura/releases/tags/$ver"
          $apiHeaders = @{}
          $authNote = 'unauthenticated: no token'
          if ($env:GH_TOKEN) {
            $apiHeaders['Authorization'] = "Bearer $env:GH_TOKEN"
            $authNote = 'authenticated'
          }
          W "listing url      : $apiUrl ($authNote)"
          try {
            $rel = Invoke-RestMethod -Uri $apiUrl -Headers $apiHeaders -TimeoutSec 60
            W "release $($rel.tag_name): $($rel.assets.Count) assets"
            foreach ($a in $rel.assets) {
              W ("  {0}  {1:N1} MB" -f $a.name, ($a.size / 1MB))
            }
            $names = $rel.assets | ForEach-Object { $_.name }
            W "pinned installer present: $($names -contains $exeName)"
            W "msi fallback present    : $($names -contains $msiName)"
          } catch {
            $code = ''
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $code = [int]$_.Exception.Response.StatusCode
            }
            $codeNote = if ($code) { "$code" } else { '<no status>' }
            W "release listing FAILED: HTTP $codeNote ($authNote) - $($_.Exception.Message)"
            W "no asset URL was taken from the listing; the pinned URL below is used as it is"
          }

          W ""
          W "--- download ---"
          $exePath = Join-Path $installerDir $exeName
          & curl.exe -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$exePath" "$exeUrl" 2>&1 |
            ForEach-Object { W $_ }
          $rc = $LASTEXITCODE
          W "curl.exe exit: $rc"
          if ($rc -ne 0) {
            V "SPIKE-Q1: download=FAILED (curl exit $rc)"
            Write-Host "::error title=SPIKE-Q1 Windows download FAILED::$exeUrl returned curl.exe exit $rc after 3 retries - no installer on disk; see $log"
            exit 1
          }
          $f = Get-Item -LiteralPath $exePath
          W "landed: $($f.FullName)"
          $mb = '{0:N1}' -f ($f.Length / 1MB)
          W "size  : $mb MB ($($f.Length) bytes)"
          $sig = Get-AuthenticodeSignature $exePath
          W "signature: $($sig.Status) / signer $($sig.SignerCertificate.Subject)"
          # The bytes are regenerable and stay out of the upload; what the
          # installer was is the evidence, so it is written down here.
          $sha = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLower()
          @(
            "asset       : $exeName"
            "url         : $exeUrl"
            "file        : $exePath (in RUNNER_TEMP, never uploaded)"
            "size        : $($f.Length) bytes ($mb MB)"
            "sha256      : $sha"
            "signature   : $($sig.Status)"
            "signer      : $($sig.SignerCertificate.Subject)"
          ) | Set-Content -LiteralPath $installerTxt
          Get-Content -LiteralPath $installerTxt | ForEach-Object { W $_ }
          V "SPIKE-Q1: download=OK ($mb MB, sha256 $sha)"
          exit 0

      - name: "Q1 evidence: silent install (macOS - mount the dmg, copy the .app)"
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          VERSION="${CURA_VERSION:-5.13.0}"
          LOG="$EVIDENCE/install-macos.txt"
          # The arch is the download step's decision (auto or forced, taken
          # from the release's own asset list) - never re-derived here, so
          # the two steps cannot disagree about which dmg is on disk.
          ARCH_TAG="$(cat "$EVIDENCE/macos-arch.txt" 2>/dev/null)"
          if [ -z "$ARCH_TAG" ]; then
            echo "the download step recorded no arch decision - nothing to install"
            echo "SPIKE-Q1: install=SKIPPED (no arch decision)" \
              | tee -a "$EVIDENCE/verdict.txt"
            exit 0
          fi
          # The download step put the dmg in the runner's temp dir - same
          # RUNNER_TEMP, same name - so this step uses it from there and the
          # ~170 MB image never rides the upload. Name and temp dir are both
          # deterministic, so the two steps cannot disagree about which dmg
          # is on disk.
          DMG="${RUNNER_TEMP:-/tmp}/cura-installers/UltiMaker-Cura-${VERSION}-macos-${ARCH_TAG}.dmg"
          MNT="$(pwd)/$EVIDENCE/mnt"
          APP=/Applications/UltiMaker-Cura.app
          # The licence-stripped copy is the last rung's mount path and lives
          # in the runner's temp dir, so another 170 MB never rides the upload.
          CDR="${RUNNER_TEMP:-/tmp}/cura-licence-stripped.cdr"
          CDR_FILE=""
          MOUNTED=""       # what hdiutil reports; never a mount point assumed
          ATTACH_SLA=no    # this image presented a licence agreement
          ATTACH_TRACE=""  # "label:rc=n " per rung, so a failure names its rung
          ATTACH_WINNER=""

          # mountpoints_of <attach-output-file>: the mount points hdiutil
          # recorded. -plist is the reliable record, but a refused licence
          # agreement interleaves the licence text with it on stdout, so the
          # XML is cut out of that mixed stream before parsing.
          mountpoints_of() {
            local raw="$1" xml="$1.xml" i=0 mp
            if ! /usr/libexec/PlistBuddy -c 'Print :system-entities' \
                 "$raw" >/dev/null 2>&1; then
              awk '/^[[:space:]]*<\?xml/{f=1} f' "$raw" >"$xml"
              raw="$xml"
            fi
            while [ "$i" -lt 8 ]; do
              mp="$(/usr/libexec/PlistBuddy \
                -c "Print :system-entities:$i:mount-point" "$raw" 2>/dev/null)"
              [ -n "$mp" ] && printf '%s\n' "$mp"
              i=$((i + 1))
            done
          }

          # attach <label> <stdin-payload> <image> [flags...]: ONE mount
          # attempt, with its exact command line, exit code, both streams and
          # the mount points it produced. Bounded, because a licence viewer
          # waiting for a click would otherwise hang the job to its timeout.
          attach() {
            local label="$1" payload="$2" image="$3"
            shift 3
            local out="$EVIDENCE/attach-${label}.out.txt"
            local err="$EVIDENCE/attach-${label}.err.txt"
            local rc pid waited=0 state
            local argv="sudo hdiutil attach -plist -nobrowse -noverify -noautoopen -readonly $* \"$image\""
            local feed="" desc="<none: the stdin inherited, which is EOF>"
            if [ -n "$payload" ]; then
              feed="printf '%s' $(printf '%q' "$payload") | "
              desc="$(printf '%q' "$payload")"
            fi
            echo
            echo "=== mount attempt '$label' ==="
            echo "cmd  : ${feed}${argv}"
            echo "stdin: $desc"
            (
              if [ -n "$payload" ]; then
                printf '%s' "$payload" | sudo hdiutil attach -plist -nobrowse \
                  -noverify -noautoopen -readonly "$@" "$image"
              else
                sudo hdiutil attach -plist -nobrowse -noverify -noautoopen \
                  -readonly "$@" "$image"
              fi
            ) >"$out" 2>"$err" &
            pid=$!
            while [ "$waited" -lt 60 ]; do
              state="$(ps -p "$pid" -o stat= 2>/dev/null | tr -d ' \n')"
              if [ -z "$state" ] || [ "${state#Z}" != "$state" ]; then
                break
              fi
              sleep 2
              waited=$((waited + 2))
            done
            if [ "$waited" -ge 60 ]; then
              echo "  ! still attaching after 60 s - killing it: a licence"
              echo "    viewer waiting for a click looks exactly like this"
              kill -9 "$pid" 2>/dev/null
              pkill -9 -f 'hdiutil attac[h]' 2>/dev/null
            fi
            wait "$pid" 2>/dev/null
            rc=$?
            ATTACH_TRACE="${ATTACH_TRACE}${label}:rc=${rc} "
            echo "  exit code: $rc (after ${waited} s)"
            echo "  stdout -> $out"
            sed -n '1,40p' "$out" | sed 's/^/  | /'
            echo "  stderr -> $err"
            sed -n '1,20p' "$err" | sed 's/^/  ! /'
            if grep -qiE 'licen[cs]e agreement|agree +y/n|licen[cs]ing' \
                 "$out" "$err" 2>/dev/null; then
              ATTACH_SLA=yes
              echo "  ^ a licence agreement was presented by this image"
            fi
            MOUNTED="$(mountpoints_of "$out" | head -1)"
            if [ -z "$MOUNTED" ] && mount | grep -qF " on $MNT "; then
              # the plist said nothing but the mount happened: believe mount(8)
              MOUNTED="$MNT"
            fi
            if [ -n "$MOUNTED" ]; then
              ATTACH_WINNER="$label"
              echo "  mounted at: $MOUNTED"
              ls -la "$MOUNTED" | sed 's/^/  | /'
            else
              echo "  nothing was mounted by this attempt"
            fi
          }

          detach_mounted() {
            [ -z "$MOUNTED" ] && return 0
            echo "=== detaching $MOUNTED ==="
            echo "cmd: sudo hdiutil detach \"$MOUNTED\""
            sudo hdiutil detach "$MOUNTED"
            echo "detach exit: $?"
            if [ -n "$(ls -A "$MOUNTED" 2>/dev/null)" ]; then
              echo "still attached - retrying with -force"
              sudo hdiutil detach -force "$MOUNTED"
              echo "detach -force exit: $?"
            fi
          }

          {
            echo "installing the ${ARCH_TAG} dmg the download step selected"
            if [ ! -f "$DMG" ]; then
              echo "no dmg downloaded - install cannot proceed"
              echo "expected at: $DMG"
              echo "SPIKE-Q1: install=SKIPPED (no dmg)" \
                | tee -a "$EVIDENCE/verdict.txt"
              exit 0
            fi
            echo "dmg                  : $DMG ($(du -h "$DMG" | cut -f1))"
            mkdir -p "$MNT"
            echo "mount point requested: $MNT"

            echo "=== does THIS macOS document a licence-acceptance flag? ==="
            hdiutil help attach >"$EVIDENCE/hdiutil-attach-help.txt" 2>&1
            echo "hdiutil help attach exit: $?"
            hdiutil attach -help >>"$EVIDENCE/hdiutil-attach-help.txt" 2>&1
            echo "hdiutil attach -help exit: $? (saved to hdiutil-attach-help.txt)"
            ACCEPT_FLAG=""
            if grep -q -- '-acceptlicense' "$EVIDENCE/hdiutil-attach-help.txt"; then
              ACCEPT_FLAG=-acceptlicense
              echo "-acceptlicense: SUPPORTED here - used on the first attempt"
            else
              echo "-acceptlicense: not documented by this hdiutil; the licence"
              echo "is answered by feeding the prompt, and skipped if that fails"
            fi

            # Rung 1 takes the documented flag when there is one; rungs 2 and
            # 3 answer the prompt on stdin (one line, then the pager form);
            # rung 4 removes the agreement from the image altogether.
            if [ -n "$ACCEPT_FLAG" ]; then
              attach accept-flag $'y\n' "$DMG" "$ACCEPT_FLAG" -mountpoint "$MNT"
            fi
            [ -z "$MOUNTED" ] && \
              attach piped-y $'y\ny\ny\n' "$DMG" -mountpoint "$MNT"
            [ -z "$MOUNTED" ] && \
              attach pager-form "$(yes qy 2>/dev/null | head -5)" "$DMG" \
                -mountpoint "$MNT"

            if [ -z "$MOUNTED" ]; then
              echo
              echo "=== last rung: strip the licence agreement out of the image ==="
              echo "a UDTO (raw CD master) copy has no UDIF resource fork, so it"
              echo "carries no agreement and mounts without a prompt"
              echo "cmd: sudo hdiutil convert -quiet -format UDTO -o \"$CDR\" \"$DMG\""
              rm -f "$CDR" "$CDR.cdr"
              sudo hdiutil convert -quiet -format UDTO -o "$CDR" "$DMG" \
                >"$EVIDENCE/hdiutil-convert.txt" 2>&1
              echo "convert exit: $?"
              sed -n '1,20p' "$EVIDENCE/hdiutil-convert.txt" | sed 's/^/  | /'
              if [ -f "$CDR" ]; then
                CDR_FILE="$CDR"
              elif [ -f "$CDR.cdr" ]; then
                CDR_FILE="$CDR.cdr"
              fi
              if [ -n "$CDR_FILE" ]; then
                echo "licence-stripped image: $CDR_FILE ($(du -h "$CDR_FILE" | cut -f1))"
                attach licence-stripped "" "$CDR_FILE" -mountpoint "$MNT"
                if [ -n "$MOUNTED" ] && [ "$ATTACH_SLA" = yes ]; then
                  echo "SPIKE-Q1: dmg-sla=YES (the agreement cancelled the direct"
                  echo "attach and the stripped copy mounted - it WAS the cause)" \
                    | tee -a "$EVIDENCE/verdict.txt"
                fi
              else
                echo "convert produced no image - the pristine dmg is all there is"
              fi
            fi

            if [ -z "$MOUNTED" ]; then
              echo
              echo "=== nothing mounted: the dmg would not attach here ==="
              echo "attempts    : ${ATTACH_TRACE:-<none ran>}"
              echo "licence seen: $ATTACH_SLA"
              echo "the requested mount point:"
              ls -la "$MNT"
              echo "--- every image hdiutil knows about right now ---"
              hdiutil info | sed -n '1,60p'
              echo "SPIKE-Q1: dmg-sla=$ATTACH_SLA (attempts: ${ATTACH_TRACE:-none})" \
                | tee -a "$EVIDENCE/verdict.txt"
              echo "SPIKE-Q1: install=FAILED (the dmg would not mount; see the attempts above)" \
                | tee -a "$EVIDENCE/verdict.txt"
              exit 1
            fi

            echo
            echo "=== mounted at $MOUNTED (via '$ATTACH_WINNER') ==="
            ls -la "$MOUNTED"
            APP_SRC="$(find "$MOUNTED" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null)"
            if [ -z "$APP_SRC" ]; then
              echo "no .app at the top level; every bundle in the image:"
              find "$MOUNTED" -maxdepth 3 -name '*.app' -print 2>/dev/null | sed 's/^/  | /'
              APP_SRC="$(find "$MOUNTED" -maxdepth 3 -name '*.app' -print -quit 2>/dev/null)"
            fi
            echo "app bundle in the dmg: ${APP_SRC:-<none>}"
            if [ -z "$APP_SRC" ]; then
              echo "SPIKE-Q1: install=FAILED (no .app inside the dmg)" \
                | tee -a "$EVIDENCE/verdict.txt"
              detach_mounted
              exit 1
            fi
            echo "=== copying the bundle out ==="
            sudo rm -rf "$APP"
            sudo ditto "$APP_SRC" "$APP"
            echo "ditto exit: $?"
            detach_mounted
            if [ -n "$CDR_FILE" ]; then
              rm -f "$CDR_FILE"
              echo "removed the temporary licence-stripped image"
            fi
            echo
            echo "=== installed app ==="
            du -sh "$APP"
            ls -la "$APP/Contents/MacOS"
            BIN_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist" 2>/dev/null)"
            if [ -z "$BIN_NAME" ]; then
              BIN_NAME=UltiMaker-Cura
            fi
            BIN="$APP/Contents/MacOS/$BIN_NAME"
            echo "launch candidate: $BIN"
            # The arch of the shipped binary is the other half of the
            # Rosetta question: it says whether this dmg really is Intel.
            file "$BIN"
            echo "--- signature (informational) ---"
            codesign -dv --verbose=2 "$APP" 2>&1 | head -20
            echo "--- quarantine xattr (empty = never quarantined) ---"
            QX="$(xattr -l "$APP" 2>&1 | head -5)"
            echo "${QX:-<none>}"
            echo "mount attempts: ${ATTACH_TRACE:-<none ran>}"
            if [ -x "$BIN" ]; then
              echo "SPIKE-Q1: install=OK ($BIN, $(du -sh "$APP" | cut -f1))" \
                | tee -a "$EVIDENCE/verdict.txt"
              printf 'SPIKE-Q1: dmg-sla=%s (mounted via %s)\n' \
                "$ATTACH_SLA" "$ATTACH_WINNER" | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q1: install=FAILED (no executable at $BIN)" \
                | tee -a "$EVIDENCE/verdict.txt"
              exit 1
            fi
          } 2>&1 | tee "$LOG"
          if grep -q 'SPIKE-Q1: install=FAILED' "$EVIDENCE/verdict.txt" 2>/dev/null; then
            exit 1
          fi

      - name: "Q3 evidence: Cura's own bundled Python and Qt (macOS)"
        # Anything that has to run INSIDE Cura's process must use the
        # interpreter and Qt Cura ships, not the runner's. Where they live
        # is searched for and reported, never assumed: the bundle is walked
        # for interpreters, Qt frameworks and PyQt6 metadata, and the
        # candidate interpreter is made to import PyQt6 so the answer is a
        # result rather than a path guess.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          AUDIT="$EVIDENCE/dependency-audit.tsv"
          LOG="$EVIDENCE/bundled-runtime-macos.txt"
          PLATFORM="macOS/$RUNNER_ARCH"
          APP=/Applications/UltiMaker-Cura.app
          {
            [ -s "$AUDIT" ] || printf 'platform\tcomponent\trole\tstatus\tversion\tnotes\n' >"$AUDIT"
            ar() {
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$PLATFORM" "$1" "$2" "$3" "$4" "$5" >>"$AUDIT"
              echo "[audit] $1 | $3 | $4 | $5"
            }
            if [ ! -d "$APP" ]; then
              echo "no bundle at $APP - its bundled runtime cannot be located"
              ar "Cura's bundled Python" "runs anything inside Cura's process (the port injects through it)" \
                "ABSENT" "<none>" "no bundle to search: the install step reports why"
              ar "Cura's bundled Qt/PyQt6" "the Qt Cura itself is linked against" \
                "ABSENT" "<none>" "no bundle to search"
              exit 0
            fi
            echo "=== interpreters inside the bundle (searched, not assumed) ==="
            find "$APP" -type f -name 'python3*' -perm -u+x 2>/dev/null | head -20
            find "$APP" -type d -name 'python3.*' 2>/dev/null | head -10
            find "$APP" -type d -name 'Python.framework' 2>/dev/null | head -5
            PY="$(find "$APP" -type f -name 'python3*' -perm -u+x 2>/dev/null | head -1)"
            if [ -z "$PY" ]; then
              ar "Cura's bundled Python" "runs anything inside Cura's process (the port injects through it)" \
                "ABSENT" "<none>" "no python3* executable found anywhere under $APP"
            else
              PYV="$("$PY" --version 2>&1 | head -1)"
              echo "candidate interpreter: $PY ($PYV)"
              echo "--- can it import PyQt6? (the binding the port injects through) ---"
              if QT_IMPORT="$("$PY" -c 'import PyQt6.QtCore as c; print("PyQt6", c.PYQT_VERSION_STR, "Qt", c.QT_VERSION_STR)' 2>&1)"; then
                echo "IMPORT OK: $QT_IMPORT"
                ar "Cura's bundled Python" "runs anything inside Cura's process (the port injects through it)" \
                  "INSTALLED BY US" "$PYV" \
                  "ships inside the dmg we installed: $PY; PyQt6 import OK: $QT_IMPORT"
              else
                echo "IMPORT FAILED (the exact error is the result):"
                printf '%s\n' "$QT_IMPORT" | head -5
                ar "Cura's bundled Python" "runs anything inside Cura's process (the port injects through it)" \
                  "INSTALLED BY US" "$PYV" \
                  "ships inside the dmg we installed: $PY; PyQt6 import FAILED: $(printf '%s' "$QT_IMPORT" | head -1)"
              fi
            fi
            echo
            echo "=== Qt inside the bundle (versions read from what is there) ==="
            find "$APP" -maxdepth 8 -name 'Qt*.framework' -print 2>/dev/null | head -20
            QTC="$(find "$APP" -maxdepth 8 -name 'QtCore.framework' -print -quit 2>/dev/null)"
            if [ -z "$QTC" ]; then
              ar "Cura's bundled Qt" "the Qt Cura itself is linked against" "ABSENT" "<none>" \
                "no QtCore.framework anywhere under $APP (searched to depth 8)"
            else
              # A framework keeps its Info.plist in one of two places; both
              # are tried rather than one being assumed.
              QV=""
              for plist in "$QTC/Resources/Info.plist" "$QTC/Versions/A/Resources/Info.plist"; do
                if [ -f "$plist" ]; then
                  QV="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null)"
                  [ -n "$QV" ] && break
                fi
              done
              ar "Cura's bundled Qt" "the Qt Cura itself is linked against" "INSTALLED BY US" \
                "${QV:-<version not readable>}" "QtCore.framework at $QTC"
            fi
            echo "--- PyQt6 inside the bundle ---"
            find "$APP" -maxdepth 8 -type d -name 'PyQt6*' -print 2>/dev/null | head -10
            DI="$(find "$APP" -maxdepth 8 -type d -name 'PyQt6-*.dist-info' -print -quit 2>/dev/null)"
            if [ -n "$DI" ] && [ -f "$DI/METADATA" ]; then
              PV="$(grep -m1 '^Version:' "$DI/METADATA" | cut -d' ' -f2)"
              ar "Cura's bundled PyQt6" "the binding the port injects through" "INSTALLED BY US" \
                "${PV:-<not readable>}" "$DI"
            elif [ -n "$DI" ]; then
              ar "Cura's bundled PyQt6" "the binding the port injects through" "INSTALLED BY US" \
                "<not readable>" "$DI has no METADATA"
            else
              ar "Cura's bundled PyQt6" "the binding the port injects through" "ABSENT" "<none>" \
                "no PyQt6-*.dist-info anywhere under $APP"
            fi
            echo
            echo "--- rows so far ---"
            cat "$AUDIT"
          } 2>&1 | tee "$LOG"
          exit 0

      - name: "Q1 evidence: silent install (Windows - NSIS /S, then the WiX MSI /qn)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          # Absolute from here on: a relative installer path is resolved
          # against the Windows Installer service's own directory, not ours.
          $EVIDENCE = (Resolve-Path -LiteralPath $EVIDENCE).Path
          $log = Join-Path $EVIDENCE 'install-windows.txt'
          $verdict = Join-Path $EVIDENCE 'verdict.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          function V($m) { W $m; Add-Content -Path $verdict -Value $m }
          $ver = if ($env:CURA_VERSION) { $env:CURA_VERSION } else { '5.13.0' }
          # Both installers live in the download step's temp dir, never in
          # the evidence directory: ~160 MB each, regenerable from their
          # pinned URLs, so the bytes are not evidence. RUNNER_TEMP is
          # absolute and is not uploaded.
          $tempRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }
          $installerDir = Join-Path $tempRoot 'cura-installers'
          New-Item -ItemType Directory -Force $installerDir | Out-Null
          $exePath = Join-Path $installerDir "UltiMaker-Cura-$ver-win64-X64.exe"
          $msiPath = Join-Path $installerDir "UltiMaker-Cura-$ver-win64-X64.msi"
          $msiUrl = "https://github.com/Ultimaker/Cura/releases/download/$ver/UltiMaker-Cura-$ver-win64-X64.msi"
          $msiLog = Join-Path $EVIDENCE 'msi-install.log'
          $exeResult = 'not attempted'
          $msiResult = 'not attempted'
          $via = '<none>'
          $binary = $null
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          # Both installers are per-machine, so both Program Files roots are
          # searched as well as the per-user one, and elevation is stated.
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA) |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $listRoots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, (Join-Path $env:LOCALAPPDATA 'Programs')) |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) }

          function Get-CuraExe {
            # UltiMaker-Cura.exe in a versioned Program Files folder is the
            # canonical name, but the sweep is name-tolerant and reports every
            # candidate: a rename must not read as "nothing was installed".
            $found = foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -Filter '*cura*.exe' -Recurse -Depth 4 -File -ErrorAction SilentlyContinue
            }
            @($found) |
              Where-Object { $_.Name -notmatch '(?i)uninstall|curaengine' } |
              Select-Object @{ n = 'Rank'; e = { if ($_.Name -eq 'UltiMaker-Cura.exe') { 0 } else { 1 } } },
                            FullName, Name,
                            @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } },
                            @{ n = 'FileVersion'; e = { $_.VersionInfo.FileVersion } } |
              Sort-Object Rank, FullName
          }

          function Get-CuraRegistry {
            # Both hives and the WOW6432Node view: an installer records what it
            # did here, so these keys are read as evidence, not as a lookup.
            $views = [ordered]@{
              'HKLM per-machine             ' = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
              'HKLM per-machine WOW6432Node ' = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
              'HKCU per-user                ' = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
            }
            foreach ($label in $views.Keys) {
              $all = @(Get-ItemProperty -Path $views[$label] -ErrorAction SilentlyContinue)
              $mine = @($all | Where-Object { $_.DisplayName -like '*cura*' -or $_.Publisher -like '*ultimaker*' })
              W ("  {0}: {1} uninstall entries, {2} naming Cura or UltiMaker" -f $label, $all.Count, $mine.Count)
              foreach ($e in $mine) {
                W "    registry key    : $($e.PSChildName)"
                W "    DisplayName     : $($e.DisplayName)"
                W "    DisplayVersion  : $($e.DisplayVersion)"
                W "    Publisher       : $($e.Publisher)"
                W "    InstallLocation : $($e.InstallLocation)"
                W "    UninstallString : $($e.UninstallString)"
                W "    WindowsInstaller: $($e.WindowsInstaller)"
              }
            }
          }

          function Show-CuraState($label) {
            W ""
            W "=== state after $label ==="
            W "uninstall registry keys:"
            Get-CuraRegistry
            W "candidate binaries under every searched root (depth 4):"
            $c = @(Get-CuraExe)
            if ($c.Count -eq 0) {
              W "  none"
            } else {
              foreach ($f in $c) { W ("  {0}  {1} MB  v{2}" -f $f.FullName, $f.MB, $f.FileVersion) }
            }
            $alive = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match '(?i)cura|msiexec' })
            if ($alive.Count -eq 0) {
              W "installer or Cura processes still running: none"
            } else {
              foreach ($proc in $alive) { W "still running: $($proc.ProcessName) (pid $($proc.Id))" }
            }
          }

          function Show-SearchedPaths {
            # On failure the paths below have to speak for themselves.
            W ""
            W "=== what is actually in every path that was searched ==="
            foreach ($root in $listRoots) {
              W "[$root]"
              $dirs = @(Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)cura|ultimaker' })
              if ($dirs.Count -eq 0) {
                $top = @(Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                  Select-Object -First 25 -ExpandProperty Name)
                W "  no directory here is named Cura or UltiMaker; the first it holds:"
                W "  $($top -join ', ')"
              } else {
                foreach ($d in $dirs) {
                  W "  $($d.FullName)"
                  $files = @(Get-ChildItem -LiteralPath $d.FullName -File -ErrorAction SilentlyContinue |
                    Select-Object -First 20)
                  if ($files.Count -eq 0) {
                    W "    (no files)"
                  } else {
                    foreach ($f in $files) { W ("    {0}  {1} MB" -f $f.Name, [math]::Round($f.Length / 1MB, 1)) }
                  }
                }
              }
            }
          }

          function Wait-ForCura($label, $limitSecs) {
            # Start-Process waits only for the process it started, and both
            # installers finish writing through helpers that outlive it, so
            # the wait polls for the outcome instead of trusting the handle.
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt $limitSecs) {
              $f = @(Get-CuraExe)
              if ($f.Count -gt 0) {
                W "[$label] a binary appeared after $([int]$sw.Elapsed.TotalSeconds) s"
                return $f[0]
              }
              Start-Sleep -Seconds 5
            }
            W "[$label] still no binary after $limitSecs s of waiting"
            return $null
          }

          function Msiexec-Meaning($code) {
            switch ($code) {
              0       { 'success' }
              3010    { 'success, a restart is required' }
              1641    { 'success, the installer asked for a restart' }
              1603    { 'fatal error during installation - the msi log names it' }
              1618    { 'another installation is already in progress' }
              1619    { 'the package could not be opened' }
              1620    { 'the package is not a valid installation package' }
              1622    { 'the log file could not be opened' }
              1625    { 'installation forbidden by system policy' }
              1638    { 'another version of this product is already installed' }
              1925    { 'insufficient privileges - elevation is required' }
              default { 'not a code this mapping knows' }
            }
          }

          W "=== installer policy for Cura $ver ==="
          W "the release publishes two Windows installers; both are attempted in a"
          W "fixed order, and each one's exact command line, exit code and aftermath"
          W "are recorded, so a failure names its own cause:"
          W "  1. UltiMaker-Cura-$ver-win64-X64.exe  NSIS (nullsoft), silent switch /S"
          W "  2. UltiMaker-Cura-$ver-win64-X64.msi  WiX/MSI, silent: msiexec /i <msi> /qn /norestart"
          W "the MSI comes second because the .exe is already on disk, and is the"
          W "authoritative install: a real ProductCode, plus an APPLICATIONFOLDER"
          W "property that pins the target so the outcome is verifiable"
          W "elevated: $admin   <- a per-machine install cannot succeed without it"
          if (-not $admin) {
            W "NOT ELEVATED: a per-machine NSIS or MSI install cannot succeed here,"
            W "and that alone would explain a silent install that leaves nothing"
          }
          W "roots searched (depth 4): $($roots -join '; ')"
          W "per-machine: both Program Files roots; per-user: LOCALAPPDATA"
          W "msiexec: $((Get-Command msiexec.exe -ErrorAction SilentlyContinue).Source)"

          if (-not (Test-Path -LiteralPath $exePath) -and -not (Test-Path -LiteralPath $msiPath)) {
            W "neither installer is on disk - install cannot proceed"
            W "looked in: $installerDir"
            V "SPIKE-Q1: install=SKIPPED (no installer on disk)"
            exit 0
          }

          # 1. the NSIS .exe
          if (-not (Test-Path -LiteralPath $exePath)) {
            $exeResult = 'not attempted: no .exe on disk'
            W ""
            W "=== NSIS /S: skipped, no .exe on disk ==="
          } else {
            $exeAbs = (Resolve-Path -LiteralPath $exePath).Path
            W ""
            W "=== NSIS silent install ==="
            W "cmd : & `"$exeAbs`" /S"
            W "cwd : $EVIDENCE"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = $null
            try {
              $p = Start-Process -FilePath $exeAbs -ArgumentList '/S' -WorkingDirectory $EVIDENCE -Wait -PassThru -ErrorAction Stop
            } catch {
              W "Start-Process threw: $($_.Exception.Message)"
            }
            $sw.Stop()
            $code = if ($p) { $p.ExitCode } else { $null }
            if ($p) {
              $exeResult = "exit $code after $([int]$sw.Elapsed.TotalSeconds) s"
              W "exit code: $code (elapsed $([int]$sw.Elapsed.TotalSeconds) s)"
              if ($code -ne 0) {
                W "a non-zero exit here means the silent install did not run to completion"
              }
            } else {
              $exeResult = 'the process never started, so nothing was installed'
              W "the installer process never started - /S installed nothing"
            }
            $budget = if ($code -in @(0, 1641, 3010)) { 240 } else { 30 }
            $binary = Wait-ForCura 'NSIS /S' $budget
            if ($binary) { $via = 'NSIS /S' }
            Show-CuraState 'the NSIS /S attempt'
          }

          # 2. the WiX MSI
          if (-not $binary) {
            W ""
            W "=== the WiX MSI (the release's second installer) ==="
            if (-not (Test-Path -LiteralPath $msiPath)) {
              W "downloading: $msiUrl"
              & curl.exe -L --fail --retry 3 --connect-timeout 30 --max-time 900 -o "$msiPath" "$msiUrl" 2>&1 |
                ForEach-Object { W $_ }
              W "curl.exe exit: $LASTEXITCODE"
            }
            if (-not (Test-Path -LiteralPath $msiPath)) {
              $msiResult = 'not attempted: the MSI could not be obtained'
              W "no MSI on disk - the MSI attempt is skipped (see the curl output above)"
            } else {
              $msiAbs = (Resolve-Path -LiteralPath $msiPath).Path
              $mf = Get-Item -LiteralPath $msiAbs
              W ("msi : {0} ({1} MB)" -f $msiAbs, [math]::Round($mf.Length / 1MB, 1))
              $sig = Get-AuthenticodeSignature -LiteralPath $msiAbs
              W "signature: $($sig.Status) / signer $($sig.SignerCertificate.Subject)"
              $target = Join-Path $env:ProgramFiles "UltiMaker Cura $ver"
              $msiArgs = "/i `"$msiAbs`" /qn /norestart /L*v `"$msiLog`" APPLICATIONFOLDER=`"$target`""
              W "cmd : msiexec.exe $msiArgs"
              W "target (APPLICATIONFOLDER): $target"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $mp = $null
              try {
                $mp = Start-Process -FilePath msiexec.exe -ArgumentList $msiArgs -WorkingDirectory $EVIDENCE -Wait -PassThru -ErrorAction Stop
              } catch {
                W "Start-Process threw: $($_.Exception.Message)"
              }
              $sw.Stop()
              $mcode = if ($mp) { $mp.ExitCode } else { $null }
              W "exit code: $mcode - $(Msiexec-Meaning $mcode) (elapsed $([int]$sw.Elapsed.TotalSeconds) s)"
              if ($null -eq $mcode) {
                $msiResult = 'the msiexec process never started'
              } else {
                $msiResult = "exit $mcode ($(Msiexec-Meaning $mcode)) after $([int]$sw.Elapsed.TotalSeconds) s"
              }
              # The verbose log is the only place an MSI names its own cause.
              if (Test-Path -LiteralPath $msiLog) {
                W "--- msi log ($((Get-Item -LiteralPath $msiLog).Length) bytes): $msiLog ---"
                Get-Content -LiteralPath $msiLog -Tail 12 | ForEach-Object { W "  $_" }
                $bad = @(Select-String -LiteralPath $msiLog -ErrorAction SilentlyContinue -Pattern 'Return value 3|Error [0-9]+|Internal Error|MainEngineThread is returning|Note: 1: 2262' | Select-Object -Last 20)
                W "--- the lines that name a failure (last $($bad.Count)) ---"
                if ($bad.Count -eq 0) {
                  W "  none matched: the tail above is the whole record"
                } else {
                  $bad | ForEach-Object { W "  $($_.Line.Trim())" }
                }
              } else {
                W "no msi log at $msiLog - msiexec never reached the point of writing one"
              }
              $budget = if ($mcode -in @(0, 1641, 3010)) { 240 } else { 30 }
              $binary = Wait-ForCura 'MSI /qn' $budget
              if ($binary) { $via = 'MSI /qn' }
              Show-CuraState 'the MSI /qn attempt'
            }
          }

          if ($binary) {
            W ""
            W "=== installed binary ==="
            W "produced by: $via"
            W "path       : $($binary.FullName)"
            W "version    : $($binary.FileVersion)  ($($binary.Name))"
            W "size       : $($binary.MB) MB"
            # The launch step reads this rather than repeating a slow
            # disk sweep, and it is the path this step verified.
            $binary.FullName | Set-Content -LiteralPath (Join-Path $EVIDENCE 'binary-path.txt')
            V "SPIKE-Q1: install=OK ($($binary.FullName))"
            V "SPIKE-Q1: install-via=$via"
          } else {
            W ""
            W "=== why this failed ==="
            W "NSIS /S : $exeResult"
            W "MSI /qn : $msiResult"
            W "msi log : $(if (Test-Path -LiteralPath $msiLog) { $msiLog } else { 'never written' })"
            W "elevated: $admin"
            Show-SearchedPaths
            V "SPIKE-Q1: install=FAILED (NSIS /S: $exeResult; MSI /qn: $msiResult; no *cura*.exe under any searched root)"
            exit 1
          }
          exit 0

      - name: "Q3 evidence: Cura's own bundled Python and Qt (Windows)"
        # Same contract as the macOS audit: locate, never assume. Cura's
        # Windows build embeds its interpreter differently from the .app,
        # so what is reported here is whatever the install dir actually
        # contains - python*.exe, a python3*.dll, Qt6Core*.dll and any
        # PyQt6 metadata - and the interpreter is made to import PyQt6 so
        # the finding is a result, not a guess.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $log = Join-Path $EVIDENCE 'bundled-runtime-windows.txt'
          $audit = Join-Path $EVIDENCE 'dependency-audit.tsv'
          $PLATFORM = "Windows/$env:RUNNER_ARCH"
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          if (-not (Test-Path $audit)) {
            Add-Content -Path $audit -Value "platform`tcomponent`trole`tstatus`tversion`tnotes"
          }
          function AR($component, $role, $status, $version, $notes) {
            Add-Content -Path $audit -Value ("$PLATFORM`t$component`t$role`t$status`t$version`t$notes")
            W "[audit] $component | $status | $version | $notes"
          }
          $role = "runs anything inside Cura's process (the port injects through it)"

          $pathFile = Join-Path $EVIDENCE 'binary-path.txt'
          $binary = if (Test-Path $pathFile) { Get-Content $pathFile -First 1 } else { $null }
          if (-not $binary -or -not (Test-Path $binary)) {
            W "no installed binary on record - the bundled runtime cannot be located"
            AR "Cura's bundled Python" $role 'ABSENT' '<none>' 'nothing installed to search'
            AR "Cura's bundled Qt/PyQt6" 'the Qt Cura itself is linked against' 'ABSENT' '<none>' 'nothing installed to search'
            exit 0
          }
          $dir = Split-Path -Parent $binary
          W "install dir: $dir"

          W ""
          W "=== interpreters inside the install dir (searched, not assumed) ==="
          $pyExes = Get-ChildItem -Path $dir -Recurse -Depth 5 -File -Filter 'python*.exe' -ErrorAction SilentlyContinue
          if ($pyExes) {
            $pyExes | ForEach-Object { W ("  {0}  v{1}" -f $_.FullName, $_.VersionInfo.FileVersion) }
          } else {
            W "  no python*.exe under the install dir"
          }
          $pyDlls = Get-ChildItem -Path $dir -Recurse -Depth 5 -File -Filter 'python3*.dll' -ErrorAction SilentlyContinue
          if ($pyDlls) {
            $pyDlls | ForEach-Object { W ("  dll: {0}  v{1}" -f $_.FullName, $_.VersionInfo.FileVersion) }
          }
          $py = $pyExes | Select-Object -First 1
          if (-not $py) {
            $note = if ($pyDlls) {
              "the build embeds its interpreter as python3*.dll rather than shipping python.exe (searched $dir, depth 5)"
            } else {
              "no python executable and no python3*.dll under the install dir (searched $dir, depth 5)"
            }
            AR "Cura's bundled Python" $role 'ABSENT' '<none>' $note
          } else {
            # run inside a bounded process so a launcher that waits forever
            # cannot consume the job timeout
            $out = Join-Path $EVIDENCE 'bundled-python-probe.out.txt'
            $err = Join-Path $EVIDENCE 'bundled-python-probe.err.txt'
            $code = "import sys`nprint('python', sys.version.split()[0])`ntry:`n    import PyQt6.QtCore as c`n    print('PyQt6', c.PYQT_VERSION_STR, 'Qt', c.QT_VERSION_STR)`nexcept Exception as e:`n    print('import FAILED:', type(e).__name__, e)"
            $proc = $null
            try {
              $proc = Start-Process -FilePath $py.FullName -ArgumentList @('-c', "`"$code`"") -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              $proc | Wait-Process -Timeout 60 -ErrorAction Stop
            } catch {
              W "the bundled interpreter did not finish within 60 s - killing it"
              if ($proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
            $probeOut = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
            if ($probeOut) { $probeOut -split "`r?`n" | Where-Object { $_ } | ForEach-Object { W "  $_" } }
            $probeErr = if (Test-Path $err) { Get-Content $err -Raw } else { '' }
            if ($probeErr) { W "  stderr: $($probeErr.Trim())" }
            $pyVersion = "$($py.VersionInfo.FileVersion)"
            if (-not $pyVersion) {
              $pyVersion = ($probeOut -split "`r?`n" | Where-Object { $_ -like 'python *' } | Select-Object -First 1)
            }
            if (-not $pyVersion) { $pyVersion = '<not readable>' }
            $probeOne = (($probeOut -replace "`r?`n", '; ').Trim())
            AR "Cura's bundled Python" $role 'INSTALLED BY US' $pyVersion "ships inside the installed app: $($py.FullName); probe: $probeOne"
          }

          W ""
          W "=== Qt / PyQt6 inside the install dir (versions read from what is there) ==="
          $qtDlls = Get-ChildItem -Path $dir -Recurse -Depth 5 -File -Filter 'Qt6Core*.dll' -ErrorAction SilentlyContinue
          if ($qtDlls) {
            $qtDlls | ForEach-Object { W ("  {0}  v{1}" -f $_.FullName, $_.VersionInfo.FileVersion) }
            $qtMain = $qtDlls | Select-Object -First 1
            AR "Cura's bundled Qt" 'the Qt Cura itself is linked against' 'INSTALLED BY US' "$($qtMain.VersionInfo.FileVersion)" "ships inside the installed app: $($qtMain.FullName)"
          } else {
            AR "Cura's bundled Qt" 'the Qt Cura itself is linked against' 'ABSENT' '<none>' "no Qt6Core*.dll under the install dir (searched $dir, depth 5)"
          }
          $pyqtDirs = Get-ChildItem -Path $dir -Recurse -Depth 5 -Directory -Filter 'PyQt6*' -ErrorAction SilentlyContinue
          if ($pyqtDirs) { $pyqtDirs | ForEach-Object { W "  dir: $($_.FullName)" } }
          $distInfo = $pyqtDirs | Where-Object { $_.Name -like 'PyQt6-*.dist-info' } | Select-Object -First 1
          if ($distInfo) {
            $meta = Join-Path $distInfo.FullName 'METADATA'
            $verLine = if (Test-Path $meta) { (Select-String -Path $meta -Pattern '^Version:' | Select-Object -First 1).Line } else { $null }
            if ($verLine) {
              $pv = ($verLine -split ':', 2)[1]
              AR "Cura's bundled PyQt6" 'the binding the port injects through' 'INSTALLED BY US' ($pv.Trim()) $distInfo.FullName
            } else {
              AR "Cura's bundled PyQt6" 'the binding the port injects through' 'INSTALLED BY US' '<not readable>' "$($distInfo.FullName) has no readable METADATA"
            }
          } else {
            AR "Cura's bundled PyQt6" 'the binding the port injects through' 'ABSENT' '<none>' "no PyQt6-*.dist-info under the install dir"
          }
          W ""
          W "--- rows so far ---"
          Get-Content $audit | ForEach-Object { W $_ }
          exit 0

      - name: "Q2 evidence: seed Cura's config (macOS: the local-network prompt, the machine)"
        # Two jobs, one writer. macOS raises a TCC consent alert ("... to
        # find devices on local networks") as soon as an app starts mDNS
        # discovery, and nothing on a runner can answer it: it stays on top
        # of the window, so a scenario click would land on the dialog instead
        # of Cura. Cura raises it from UM3NetworkPrinting, the one plugin in
        # the bundle that imports an mDNS stack, and its register() builds
        # the discovery client on the spot. A plugin on the registry's
        # disabled list is never registered (Uranium's
        # PluginRegistry.loadPlugin returns before register() runs), so the
        # prompt is prevented rather than answered - twice over: the id goes
        # into the seeded cura.cfg's general/disabled_plugins, and the plugin
        # directory leaves the bundle. Neither route is assumed to have
        # worked: the launch step reads the registry's own plugins.json back
        # and reports what Cura actually disabled.
        # The same file also carries the machine seed: Cura's first-run
        # "Welcome to UltiMaker Cura" wizard is shown exactly when there is
        # no active machine, and runner.py's first gate asserts it absent, so
        # a run without a machine stalls at that dialog. Both halves of the
        # restore are written here (see section 3), and whether it took is
        # reported by the launch step's welcome= line rather than assumed.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/tcc-prevention.txt"
          APP=/Applications/UltiMaker-Cura.app
          STASH="${RUNNER_TEMP:-/tmp}/cura-disabled-plugins"
          SEED_ID=UM3NetworkPrinting
          STATE="$EVIDENCE/tcc-prevention-state.txt"
          {
            echo "=== why this step exists ==="
            echo "Cura's LAN discovery is what makes macOS raise the local-network"
            echo "TCC prompt. It cannot be answered on a runner and it stays on"
            echo "top of the window, so the plugin that starts mDNS is disabled"
            echo "BEFORE the launch; the launch step reports whether it stayed away."
            if [ ! -d "$APP" ]; then
              echo "no bundle at $APP - nothing can be disabled here"
              echo "SPIKE-Q2: tcc-prevention=NONE (no bundle; the prompt is expected)" \
                | tee -a "$EVIDENCE/verdict.txt"
              echo "SPIKE-Q2: seed=SKIPPED (no bundle: the file-format versions can only be read out of the installed Cura, and nothing is installed)" \
                | tee -a "$EVIDENCE/verdict.txt"
              printf 'NONE' >"$STATE"
              exit 0
            fi

            # The plugin id IS its directory name, so renaming a directory
            # in place would still load it (and it would still discover):
            # only the registry's disabled list, or removal from the plugin
            # tree, actually counts.
            PLUGIN_DIRS="$(find "$APP/Contents" -maxdepth 4 -type d -name plugins 2>/dev/null)"
            echo
            echo "=== plugin trees in the bundle (searched, not assumed) ==="
            printf '%s\n' "${PLUGIN_DIRS:-<none found>}"

            echo
            echo "=== which plugins start mDNS? ==="
            # zeroconf and pybonjour are the mDNS stacks Cura has ever used.
            # The content probe survives a version rename; the name seed
            # keeps the id present even when nothing matches on this build.
            MDNS_IDS=""
            for tree in $PLUGIN_DIRS; do
              for d in "$tree"/*/; do
                [ -d "$d" ] || continue
                id="$(basename "$d")"
                hits="$(grep -rl -iE 'zeroconf|pybonjour' --include='*.py' "$d" 2>/dev/null | head -5)"
                if [ -n "$hits" ]; then
                  echo "$id:"
                  printf '%s\n' "$hits" | sed 's|^|  mDNS stack referenced by |'
                  MDNS_IDS="$MDNS_IDS $id"
                fi
              done
            done
            [ -n "$MDNS_IDS" ] || echo "no plugin in this bundle references an mDNS stack"
            IDS=""
            for id in $SEED_ID $MDNS_IDS; do
              case " $IDS " in *" $id "*) ;; *) IDS="$IDS $id" ;; esac
            done
            IDS="${IDS# }"
            echo "ids to disable: $IDS"

            echo
            echo "=== 1. the registry's own disabled list (cura.cfg) ==="
            # Uranium reads general/disabled_plugins from cura.cfg and skips
            # every plugin whose id is on it. The file is ignored outright
            # unless it carries the preferences-format version of the
            # Uranium inside this bundle, so that number is read out of the
            # installed code rather than assumed - it is the one value that
            # moves across 5.7-5.13.
            BUNDLE_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$APP/Contents/Info.plist" 2>/dev/null)"
            [ -n "$BUNDLE_VER" ] || BUNDLE_VER="${CURA_VERSION:-5.13.0}"
            MM="$(printf '%s' "$BUNDLE_VER" | awk -F. 'NF >= 2 && $2 != "" { print $1 "." $2; exit }')"
            if [ -z "$MM" ]; then
              MM="$(printf '%s' "${CURA_VERSION:-5.13.0}" | awk -F. '{ print $1 "." $2 }')"
            fi
            echo "bundle version $BUNDLE_VER -> config dir $MM"
            PREF_PY="$(find "$APP/Contents" -path '*/UM/Preferences.py' -print -quit 2>/dev/null)"
            PREF_VER=""
            if [ -n "$PREF_PY" ]; then
              PREF_VER="$(sed -n 's/^ *Version *= *\([0-9][0-9]*\).*/\1/p' "$PREF_PY" | head -1)"
              echo "preferences format version ${PREF_VER:-<not found>} (read from $PREF_PY)"
            else
              echo "no UM/Preferences.py in the bundle - the format version is unknown"
            fi
            # The application name is a build-time constant ("cura") and the
            # macOS config root is ~/Library/Application Support. The launch
            # step's own log read back "Config storage path is
            # ~/Library/Application Support/cura/<major.minor>" on the run
            # that recorded the wizard, so that one spelling is written: the
            # runner's filesystem is case-insensitive, which is why the
            # earlier run reported a "Cura/..." config as already present -
            # it was this same file, seen again under the other spelling.
            MACHINE="FDM Printer Base Description"
            MACHINE_FILE="FDM+Printer+Base+Description"
            EXTRUDER="fdmextruder #2"
            EXTRUDER_FILE="fdmextruder+%232"
            DIR="$HOME/Library/Application Support/cura/$MM"
            CFG="$DIR/cura.cfg"
            CONFIG_FILES=""
            PRE_EXISTED=""
            CFG_APPENDED=""
            CFG_OK=""
            if [ -e "$CFG" ]; then
              # Nothing runs Cura before this step, so a config that is
              # already there is an anomaly. It is reported rather than
              # rewritten: the keys already in it are what decide Cura's
              # behaviour. Only the section this step owns is added, and only
              # when it is absent - a second [cura] section would make Cura's
              # preferences parser reject the whole file.
              echo "  $CFG: ALREADY PRESENT before the launch - reported, not rewritten"
              PRE_EXISTED="$PRE_EXISTED $CFG"
              if grep -q '^\[cura\]' "$CFG" 2>/dev/null; then
                AM="$(sed -n 's/^ *active_machine *= *//p' "$CFG" | head -1)"
                echo "  it already carries a [cura] section: active_machine='$AM' (left as it stands)"
                # The machine is named under whichever id it is named: a
                # different one there is a seed that will not do what it says.
                [ "$AM" = "$MACHINE" ] && CFG_OK=yes
              else
                printf '\n[cura]\nactive_machine = %s\n' "$MACHINE" >>"$CFG" \
                  && CFG_APPENDED=yes && CONFIG_FILES="$CONFIG_FILES $CFG" && CFG_OK=yes
              fi
            elif [ -z "$PREF_VER" ]; then
              echo "  $CFG: skipped - the preferences format version is unknown"
            else
              mkdir -p "$DIR" 2>/dev/null
              printf '[general]\nversion = %s\ndisabled_plugins = %s\n\n[cura]\nactive_machine = %s\n' \
                "$PREF_VER" "$IDS" "$MACHINE" >"$CFG"
              if [ -s "$CFG" ]; then
                echo "  $CFG: written (version = $PREF_VER, disabled_plugins = $IDS, active_machine = $MACHINE)"
                CONFIG_FILES="$CONFIG_FILES $CFG"
                CFG_OK=yes
              else
                echo "  $CFG: COULD NOT be written - the bundle move carries this alone"
              fi
            fi
            [ -n "$CFG_APPENDED" ] && echo "  $CFG: the [cura] section was appended to the file already there"
            [ -n "$PRE_EXISTED" ] && echo "left alone (pre-existing):${PRE_EXISTED}"

            echo
            echo "=== 2. the plugin directory itself (the version-proof backstop) ==="
            mkdir -p "$STASH" 2>/dev/null
            MOVED=""
            for tree in $PLUGIN_DIRS; do
              for id in $IDS; do
                d="$tree/$id"
                [ -d "$d" ] || continue
                if sudo mv "$d" "$STASH/$id" 2>&1; then
                  echo "moved: $d -> $STASH/$id"
                  MOVED="$MOVED $id"
                else
                  echo "could not move $d - the config seed is the only mechanism left"
                fi
              done
            done
            echo "moved out of the bundle:${MOVED:-<none>}"

            echo
            echo "=== 3. the machine seed (the Welcome wizard's precondition) ==="
            # runner.py's first gate asserts "welcome absent", and Cura shows
            # the wizard exactly when shouldShowWelcomeDialog() is true. That
            # predicate is "activeMachine is None" on every version this spike
            # ranges over (5.7 up) - there is no "seen" flag to set - so the
            # only way to keep the wizard down is to have a machine. The run
            # that recorded the wizard says exactly that in its own log: "No
            # active machine, nothing to check." and never the error-check
            # lines that follow once a machine is loaded.
            # MachineManager.setInitialActiveMachine - reached from a
            # callLater inside CuraApplication.run, before the QML decides the
            # wizard's visibility - restores a machine only when BOTH halves
            # are there: cura/active_machine names one, and a stack with that
            # id can be found. The preferences half is written above; the
            # stack is written here, in the shape Cura itself writes it -
            # machine_instances/<name>.global.cfg plus every container its
            # [containers] list names, because a name Cura cannot resolve
            # makes ContainerStack.deserialize raise and then there is no
            # machine at all. The container harness gets this from its driver
            # (addMachine over RPC, which is what wrote the file this layout
            # was copied from); this leg has no RPC.
            # general/last_run_version is deliberately NOT written: empty
            # means "this version" to QtApplication, so the What's New dialog
            # stays off, where an older value would turn it on.
            CURA_PY="${PREF_PY%/UM/Preferences.py}"
            CS_VER=""
            IC_VER=""
            SET_VER=""
            if [ -n "$CURA_PY" ]; then
              CS_VER="$(sed -n 's/^ *Version *= *\([0-9][0-9]*\).*/\1/p' "$CURA_PY/UM/Settings/ContainerStack.py" 2>/dev/null | head -1)"
              IC_VER="$(sed -n 's/^ *Version *= *\([0-9][0-9]*\).*/\1/p' "$CURA_PY/UM/Settings/InstanceContainer.py" 2>/dev/null | head -1)"
              SET_VER="$(sed -n 's/^ *SettingVersion *= *\([0-9][0-9]*\).*/\1/p' "$CURA_PY/cura/CuraApplication.py" 2>/dev/null | head -1)"
            fi
            echo "the installed build's own file-format versions: preferences=${PREF_VER:-<unreadable>} stack=${CS_VER:-<unreadable>} instance=${IC_VER:-<unreadable>} setting=${SET_VER:-<unreadable>}"
            SEED_COUNT=0
            seed_file() {
              # lines are arguments, not a here-document: a block scalar cannot
              # carry one at column one without ending itself
              SEED_PATH="$1"
              shift
              mkdir -p "$(dirname "$SEED_PATH")" 2>/dev/null
              if printf '%s\n' "$@" >"$SEED_PATH" && [ -s "$SEED_PATH" ]; then
                echo "  $SEED_PATH: written ($(wc -c <"$SEED_PATH" | tr -d ' ') bytes)"
                SEED_COUNT=$((SEED_COUNT + 1))
                return 0
              fi
              echo "  $SEED_PATH: COULD NOT be written"
              return 1
            }
            SEED_MODE=""
            if [ -z "$PREF_VER" ] || [ -z "$CS_VER" ] || [ -z "$IC_VER" ] || [ -z "$SET_VER" ]; then
              SEED_MODE=SKIPPED
              echo "the machine seed is SKIPPED: a file-format version could not be read out of the installed build."
              echo "  a container file written with the wrong version is rejected outright (ContainerStack.deserialize raises), so nothing is written rather than something invalid"
            else
              SEED_MODE=PARTIAL
              # the six files are Cura's own output for this machine, copied
              # from a working 5.13 profile; only the versions are per-build,
              # and the group id is Cura's own per-install random uuid
              # (GlobalStack assigns one whenever the file carries none)
              seed_file "$DIR/machine_instances/$MACHINE_FILE.global.cfg" \
                "[general]" \
                "version = $CS_VER" \
                "name = $MACHINE" \
                "id = $MACHINE" \
                "" \
                "[metadata]" \
                "setting_version = $SET_VER" \
                "type = machine" \
                "group_id = 374276e7-a0b1-41d8-b5a5-56c7dad1c04f" \
                "" \
                "[containers]" \
                "0 = ${MACHINE}_user" \
                "1 = empty_quality_changes" \
                "2 = empty_intent" \
                "3 = normal" \
                "4 = empty_material" \
                "5 = empty_variant" \
                "6 = ${MACHINE}_settings" \
                "7 = fdmprinter"
              seed_file "$DIR/extruders/$EXTRUDER_FILE.extruder.cfg" \
                "[general]" \
                "version = $CS_VER" \
                "name = Extruder" \
                "id = $EXTRUDER" \
                "" \
                "[metadata]" \
                "setting_version = $SET_VER" \
                "type = extruder_train" \
                "position = 0" \
                "machine = $MACHINE" \
                "" \
                "[containers]" \
                "0 = ${EXTRUDER}_user" \
                "1 = empty_quality_changes" \
                "2 = empty_intent" \
                "3 = normal" \
                "4 = generic_pla" \
                "5 = empty_variant" \
                "6 = ${EXTRUDER}_settings" \
                "7 = fdmextruder"
              seed_file "$DIR/definition_changes/${MACHINE_FILE}_settings.inst.cfg" \
                "[general]" \
                "version = $IC_VER" \
                "name = ${MACHINE}_settings" \
                "definition = fdmprinter" \
                "" \
                "[metadata]" \
                "type = definition_changes" \
                "setting_version = $SET_VER" \
                "" \
                "[values]" \
                "extruders_enabled_count = 1"
              seed_file "$DIR/definition_changes/${EXTRUDER_FILE}_settings.inst.cfg" \
                "[general]" \
                "version = $IC_VER" \
                "name = ${EXTRUDER}_settings" \
                "definition = fdmextruder" \
                "" \
                "[metadata]" \
                "type = definition_changes" \
                "setting_version = $SET_VER" \
                "" \
                "[values]"
              seed_file "$DIR/user/${MACHINE_FILE}_user.inst.cfg" \
                "[general]" \
                "version = $IC_VER" \
                "name = ${MACHINE}_user" \
                "definition = fdmprinter" \
                "" \
                "[metadata]" \
                "type = user" \
                "setting_version = $SET_VER" \
                "machine = $MACHINE" \
                "" \
                "[values]"
              seed_file "$DIR/user/${EXTRUDER_FILE}_user.inst.cfg" \
                "[general]" \
                "version = $IC_VER" \
                "name = ${EXTRUDER}_user" \
                "definition = fdmprinter" \
                "" \
                "[metadata]" \
                "type = user" \
                "setting_version = $SET_VER" \
                "extruder = $EXTRUDER" \
                "" \
                "[values]"
              echo "seed read back from $CFG: $(sed -n 's/^ *\(version\|active_machine\) *= *\(.*\)/\1=\2/p' "$CFG" 2>/dev/null | tr '\n' ' ')"
              echo "seed read back from the machine stack: $(sed -n 's/^ *\(id\|type\) *= *\(.*\)/\1=\2/p' "$DIR/machine_instances/$MACHINE_FILE.global.cfg" 2>/dev/null | tr '\n' ' ')"
              if [ "$SEED_COUNT" -ge 6 ] && [ -n "$CFG_OK" ]; then
                SEED_MODE=OK
              elif [ "$SEED_COUNT" -eq 0 ]; then
                SEED_MODE=FAILED
              fi
            fi

            MECH=""
            [ -n "$CONFIG_FILES" ] && MECH="config"
            [ -n "$MOVED" ] && MECH="${MECH:+$MECH+}bundle"
            echo
            echo "seeded ids : $IDS"
            echo "config     :${CONFIG_FILES:- <none seeded>}"
            echo "left alone :${PRE_EXISTED:- <none>}"
            echo "bundle     :${MOVED:- <none moved>} -> $STASH"
            printf '%s' "${MECH:-NONE}" >"$STATE"
            echo "SPIKE-Q2: tcc-prevention=${MECH:-NONE} (ids=$IDS, config=${CONFIG_FILES:-none}, pre-existing=${PRE_EXISTED:-none}, bundle-moved=${MOVED:-none})" \
              | tee -a "$EVIDENCE/verdict.txt"
            echo "SPIKE-Q2: seed=${SEED_MODE:-FAILED} (machine '$MACHINE' and extruder '$EXTRUDER' seeded under ${DIR:-<no config root>}: ${SEED_COUNT}/6 stack files written, active_machine seeded=${CFG_OK:-no}; the launch step's welcome= line reports whether Cura loaded it)" \
              | tee -a "$EVIDENCE/verdict.txt"
          } 2>&1 | tee "$LOG"
          exit 0

      - name: "Q2 evidence: launch Cura and capture the screen (macOS)"
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/launch-macos.txt"
          APP=/Applications/UltiMaker-Cura.app
          BIN_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$APP/Contents/Info.plist" 2>/dev/null)"
          if [ -z "$BIN_NAME" ]; then
            BIN_NAME=UltiMaker-Cura
          fi
          BIN="$APP/Contents/MacOS/$BIN_NAME"
          SHOT="$EVIDENCE/cura-desktop.png"
          VIDEO="$EVIDENCE/scenario.mp4"
          FFSTILL="$EVIDENCE/ffmpeg-still.png"
          # The harness's own geometry (runner.py SIZE / HARNESS_GEOMETRY):
          # the same value is what keeps the native artifacts comparable.
          VIDEO_SIZE="${HARNESS_GEOMETRY:-1920x1080}"
          WAIT_SECS=35
          FFMPEG="$(command -v ffmpeg)"
          SCREEN_INDEX=""
          {
            if [ ! -x "$BIN" ]; then
              echo "Cura is not installed - launch not attempted (see the install step)"
              echo "SPIKE-Q1: launch=NOT-ATTEMPTED (no install)" \
                | tee -a "$EVIDENCE/verdict.txt"
              exit 0
            fi
            echo
            echo "=== display geometry (the harness pins one screen size) ==="
            # A full-screen capture is only comparable with the Linux leg
            # if the screen is the harness's size: runner.py records
            # -video_size SIZE (HARNESS_GEOMETRY, 1920x1080) of an Xvfb
            # display, and avfoundation IGNORES -video_size and records the
            # display it is given - run 35934260021 recorded 1024x768 here
            # while the argv asked for 1920x1080. So the argv cannot decide
            # the geometry, this reading cannot either, and the authority is
            # a frame ffmpeg actually produced: the set below is attempted on
            # this reading, and the verdict comes from the probe further down
            # (and from the recorded frame size after the run).
            WANT_W="${VIDEO_SIZE%%x*}"
            WANT_H="${VIDEO_SIZE##*x}"
            # Read by function: displayplacer prints one Resolution line per
            # screen and is the tool the set below uses, system_profiler
            # prints the same value with spaces around the x on the images
            # that print it at all (the runner that reported "unreadable" had
            # a system_profiler that reported no resolution at all).
            read_res() {
              OUT=""
              if [ -n "$DP" ]; then
                OUT="$(sed -n 's/.*Resolution: *\([0-9][0-9]*\) *x *\([0-9][0-9]*\).*/\1x\2/p' \
                  "$EVIDENCE/displayplacer-list.txt" 2>/dev/null | head -1)"
                [ -n "$OUT" ] && { echo "$OUT"; return; }
              fi
              OUT="$(system_profiler SPDisplaysDataType 2>&1 | \
                sed -n 's/^ *Resolution: *\([0-9][0-9]*\) *x *\([0-9][0-9]*\).*/\1x\2/p' | head -1)"
              [ -n "$OUT" ] && { echo "$OUT"; return; }
              echo ""
            }
            DP="$(command -v displayplacer)"
            if [ -n "$DP" ]; then
              "$DP" list >"$EVIDENCE/displayplacer-list.txt" 2>&1
              echo "--- displayplacer list ---"
              cat "$EVIDENCE/displayplacer-list.txt"
            else
              echo "displayplacer: ABSENT (the set below provisions it if Homebrew is here)"
            fi
            DISP_BEFORE="$(read_res)"
            echo "display before: ${DISP_BEFORE:-<unreadable>}"
            echo "the harness geometry this run is pinned to: $VIDEO_SIZE"
            DISPLAY_WHY="not attempted"
            if [ "$DISP_BEFORE" = "$VIDEO_SIZE" ]; then
              DISPLAY_WHY="already at the pinned geometry"
            else
              # The set is attempted whenever the reading is not the pinned
              # geometry - INCLUDING when the reading is empty, which is the
              # case that skipped the set altogether and left the recording at
              # whatever the runner had.
              if [ -z "$DP" ] && command -v brew >/dev/null 2>&1; then
                echo "displayplacer: ABSENT - provisioning it (brew install displayplacer)"
                HOMEBREW_NO_AUTO_UPDATE=1 brew install displayplacer
                echo "brew install displayplacer exit: $?"
                DP="$(command -v displayplacer)"
                if [ -n "$DP" ]; then
                  AU="$EVIDENCE/dependency-audit.tsv"
                  [ -s "$AU" ] || printf 'platform\tcomponent\trole\tstatus\tversion\tnotes\n' >"$AU"
                  printf '%s\t%s\t%s\t%s\t%s\t%s\n' "macOS/$RUNNER_ARCH" "displayplacer" \
                    "moves the display to the harness geometry for the full-screen capture" \
                    "INSTALLED BY US" "$(displayplacer --version 2>&1 | head -1)" \
                    "installed by the launch step: the audit step did not provision it" >>"$AU"
                fi
              fi
              if [ -z "$DP" ]; then
                DISPLAY_WHY="no displayplacer and no Homebrew to provision one, so the display cannot be moved"
              else
                [ -s "$EVIDENCE/displayplacer-list.txt" ] || "$DP" list >"$EVIDENCE/displayplacer-list.txt" 2>&1
                DPID="$(sed -n 's/.*Persistent screen id: *\([^ ]*\).*/\1/p' "$EVIDENCE/displayplacer-list.txt" | head -1)"
                DPHZ="$(sed -n 's/.*hz:\([0-9][0-9]*\).*/\1/p' "$EVIDENCE/displayplacer-list.txt" | head -1)"
                if [ -z "$DPHZ" ]; then
                  DPHZ="$(sed -n 's/.*Hertz: *\([0-9][0-9]*\).*/\1/p' "$EVIDENCE/displayplacer-list.txt" | head -1)"
                fi
                [ -n "$DPHZ" ] || DPHZ=60
                if [ -z "$DPID" ]; then
                  DISPLAY_WHY="displayplacer reported no persistent screen id"
                else
                  echo "displayplacer: setting ${WANT_W}x${WANT_H} on id $DPID at ${DPHZ} Hz (was ${DISP_BEFORE:-unreadable})"
                  "$DP" "id:$DPID res:${WANT_W}x${WANT_H} hz:$DPHZ color_depth:8"
                  echo "displayplacer exit: $?"
                  sleep 3
                  DISPLAY_WHY="displayplacer set res:${WANT_W}x${WANT_H}"
                fi
              fi
            fi
            DISP_AFTER="$(read_res)"
            echo "display after: ${DISP_AFTER:-<unreadable>} ($DISPLAY_WHY)"
            echo "the reading above is what the tools say; what decides the verdict is the frame below, because avfoundation ignores the requested size"

            # The recorder is ffmpeg on every platform, matching
            # tests/harness/runner.py:247-250 exactly - same flags, same
            # framerate, same scenario.mp4 naming, started with the app,
            # stopped with a signal at teardown, never a kill: an
            # unindexed mp4 is what a kill leaves, and the native
            # artifacts stay comparable with the Linux runs. Only the
            # INPUT DEVICE differs: x11grab on Linux, gdigrab on Windows,
            # avfoundation here. The region is the WHOLE DISPLAY on every
            # platform - the Linux capture is a full display whose only
            # occupant is the app - because no ffmpeg input device
            # re-reads its region once running (gdigrab bakes the clip
            # rectangle into its header, avfoundation's crop filter is a
            # constant expression), so a window-bounded capture would clip
            # the window as a resize test grew it, silently.
            if [ -z "$FFMPEG" ]; then
              echo "ffmpeg: ABSENT - attempting brew install (the images"
              echo "usually ship it; the Windows leg does the same via choco)"
              if command -v brew >/dev/null; then
                HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
                echo "brew exit: $?"
                FFMPEG="$(command -v ffmpeg)"
                if [ -n "$FFMPEG" ]; then
                  # recorded here too, so the audit table can never
                  # under-report who provisioned what
                  AU="$EVIDENCE/dependency-audit.tsv"
                  [ -s "$AU" ] || printf 'platform\tcomponent\trole\tstatus\tversion\tnotes\n' >"$AU"
                  printf '%s\t%s\t%s\t%s\t%s\t%s\n' "macOS/$RUNNER_ARCH" "ffmpeg" \
                    "the video recorder (runner.py:247-250)" "INSTALLED BY US" \
                    "$(ffmpeg -version 2>&1 | head -1)" \
                    "installed by the launch step: the audit step did not provision it" >>"$AU"
                fi
              else
                echo "brew: ABSENT too - no encoder path on this image"
              fi
            fi
            if [ -z "$FFMPEG" ]; then
              echo "SPIKE-Q2: video=FAILED (no ffmpeg on the macOS runner)" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "ffmpeg: $FFMPEG"
              echo "=== avfoundation device probe (which index is the screen?) ==="
              ffmpeg -f avfoundation -list_devices true -i "" \
                >"$EVIDENCE/avfoundation-devices.txt" 2>&1
              cat "$EVIDENCE/avfoundation-devices.txt"
              # The index is taken from what the probe reported, not
              # assumed - avfoundation ordering is not guaranteed.
              SCREEN_INDEX="$(sed -n \
                's/.*\[\([0-9][0-9]*\)\] Capture screen.*/\1/p' \
                "$EVIDENCE/avfoundation-devices.txt" | head -1)"
              if [ -z "$SCREEN_INDEX" ]; then
                echo "no 'Capture screen' device in the probe output -"
                echo "falling back to index 1, the conventional screen device"
                SCREEN_INDEX=1
              fi
              echo "screen device index: $SCREEN_INDEX"
              echo
              echo "=== display geometry, measured (the only authority) ==="
              # The reading above is a tool's opinion and avfoundation ignores
              # the requested size, so what the recording will be is decided by
              # a frame ffmpeg produces from the SAME input spec the recorder
              # uses. One second, read back with ffprobe, and the display
              # verdict is that number - so the verdict and the recording
              # cannot disagree, and a runner whose display cannot be moved
              # says so in the size it will actually record.
              PROBE="$EVIDENCE/display-probe.mp4"
              ffmpeg -y -loglevel error -f avfoundation \
                -video_size "$VIDEO_SIZE" -framerate 15 \
                -i "${SCREEN_INDEX}:none" -t 1 "$PROBE" \
                >"$EVIDENCE/display-probe.log" 2>&1
              PROBE_RC=$?
              PROBE_BYTES="$(wc -c <"$PROBE" 2>/dev/null | tr -d ' ')"
              echo "display probe: ffmpeg exit $PROBE_RC, ${PROBE_BYTES:-0} bytes (${WANT_W}x${WANT_H} requested, and avfoundation ignores that)"
              PROBE_DIMS="$(ffprobe -v error -select_streams v:0 \
                -show_entries stream=width,height -of csv=p=0:s=x \
                "$PROBE" 2>/dev/null | head -1 | tr -d '\r')"
              echo "display probe frame size: ${PROBE_DIMS:-<unreadable>} (ffprobe on a frame avfoundation produced)"
              case "$PROBE_DIMS" in
                "${WANT_W}x${WANT_H}")
                  echo "SPIKE-Q2: display=OK (${PROBE_DIMS} recorded, $DISPLAY_WHY)" \
                    | tee -a "$EVIDENCE/verdict.txt" ;;
                "")
                  echo "SPIKE-Q2: display=UNKNOWN (the probe produced no readable frame: ffmpeg exit $PROBE_RC, ${PROBE_BYTES:-0} bytes; $DISPLAY_WHY - the recorded frame size is printed below)" \
                    | tee -a "$EVIDENCE/verdict.txt" ;;
                *)
                  echo "SPIKE-Q2: display=MISMATCH (pinned $VIDEO_SIZE, this runner records ${PROBE_DIMS}, $DISPLAY_WHY)" \
                    | tee -a "$EVIDENCE/verdict.txt"
                  echo "FINDING: this runner's display cannot be moved to the harness geometry, so its recording is not the size the Linux leg records and the pinned window cannot fit - reported here rather than recorded silently" ;;
              esac
              echo "--- recorder argv ---"
              # Fragmented, so the moov is written up front and every fragment
              # is self-contained. A plain mp4 keeps its index at the end, so a
              # recorder that is killed rather than stopped leaves an mdat with
              # no moov - unplayable, which is exactly what the Windows leg
              # produced. This costs nothing when the stop is clean.
              echo "ffmpeg -y -loglevel error -f avfoundation -video_size $VIDEO_SIZE -framerate 15 -i ${SCREEN_INDEX}:none -movflags +frag_keyframe+empty_moov+default_base_moof $VIDEO"
              ffmpeg -y -loglevel error -f avfoundation \
                -video_size "$VIDEO_SIZE" -framerate 15 \
                -i "${SCREEN_INDEX}:none" \
                -movflags +frag_keyframe+empty_moov+default_base_moof "$VIDEO" \
                >"$EVIDENCE/recorder.log" 2>&1 &
              REC_PID=$!
              echo "recorder pid: $REC_PID (started BEFORE the launch)"
              sleep 2
            fi
            echo "=== launching $BIN (direct exec: its own output is evidence) ==="
            ( cd "$APP/Contents/MacOS" && exec "$BIN" ) \
              >"$EVIDENCE/cura-launch.log" 2>&1 &
            CURA_PID=$!
            echo "pid: $CURA_PID"
            DEADLINE=$((SECONDS + WAIT_SECS))
            ALIVE=yes
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              # kill -0 succeeds on a zombie, so the state is what counts.
              PS_STATE="$(ps -p "$CURA_PID" -o stat= 2>/dev/null | tr -d ' \n')"
              if [ -z "$PS_STATE" ] || [ "${PS_STATE#Z}" != "$PS_STATE" ]; then
                ALIVE=no
                break
              fi
              sleep 5
            done
            echo "after the wait: alive=$ALIVE (waited $SECONDS s of $WAIT_SECS)"
            if [ "$ALIVE" = no ]; then
              wait "$CURA_PID"
              echo "Cura exit status: $?"
              echo "--- the process is gone; its own output ---"
              tail -40 "$EVIDENCE/cura-launch.log"
              echo "=== retrying through LaunchServices (open -n) ==="
              open -n "$APP"
              echo "open exit: $?"
              sleep 10
            fi
            echo "--- does a GUI app instance exist? (LaunchServices) ---"
            LSAPP="$(lsappinfo list 2>&1 | grep -i -A2 cura | head -20)"
            echo "${LSAPP:-lsappinfo: no Cura entry}"
            if pgrep -f 'UltiMaker-Cur[a]' >/dev/null; then
              echo "process: STILL RUNNING"
            else
              echo "process: NOT RUNNING"
            fi

            echo
            echo "=== the macOS local-network prompt (the port blocker) ==="
            # The alert is presented by UserNotificationCenter and takes the
            # focus, so it is looked for outright and named rather than left
            # to ruin a scenario silently. The System Events queries may
            # themselves need an Automation grant, so a refusal is recorded
            # as the result instead of being assumed away.
            TCC_SEEN=""
            DISMISSED=""
            if pgrep -x UserNotificationCenter >/dev/null 2>&1; then
              echo "UserNotificationCenter: RUNNING (something is presenting an alert)"
              TCC_SEEN=yes
            else
              echo "UserNotificationCenter: not running"
            fi
            pgrep -x tccd >/dev/null 2>&1 && echo "tccd: RUNNING"
            FRONT="$(osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1)"
            echo "frontmost: ${FRONT:-<unreadable>}"
            case "$FRONT" in
              ""|*rror*|*authorized*) echo "  the focus holder could not be read - see the text above" ;;
              *[Cc]ura*) echo "  Cura holds the focus: no alert is sitting on top of it" ;;
              *) echo "  the focus is NOT on Cura" ;;
            esac
            TCC_TEXT="$(osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to get value of every static text of every window' 2>&1 | tr '\n' ' ' | cut -c1-300)"
            echo "alert text: ${TCC_TEXT:-<nothing readable>}"
            TCC_KIND=other
            case "$TCC_TEXT" in
              ""|*rror*|*authorized*) ;;
              *) TCC_SEEN=yes; echo "  an alert window is on screen" ;;
            esac
            # The two alerts this leg can produce read differently, and the
            # probes above can raise the second one themselves - so which
            # one it is belongs in the verdict, not left to be guessed.
            case "$TCC_TEXT" in
              *"local network"*|*"find devices"*) TCC_KIND=local-network ;;
              *"System Events"*) TCC_KIND=automation-from-these-probes ;;
            esac
            if [ -n "$TCC_SEEN" ]; then
              echo "SPIKE-Q2: tcc-prompt=PRESENT kind=$TCC_KIND (${TCC_TEXT:-text unreadable})" \
                | tee -a "$EVIDENCE/verdict.txt"
              echo "--- attempting a dismissal (System Events click; no credentials are involved) ---"
              # An answer here is good for the rest of THIS session and
              # nothing else, so it is reported as a click that worked, not
              # as the prompt being dealt with.
              for b in "Allow" "Don't Allow"; do
                R="$(osascript -e "tell application \"System Events\" to click button \"$b\" of window 1 of process \"UserNotificationCenter\"" 2>&1)"
                echo "click \"$b\": ${R:-<no output>}"
                sleep 2
                if ! pgrep -x UserNotificationCenter >/dev/null 2>&1; then
                  echo "the alert is gone"
                  TCC_SEEN=""
                  DISMISSED="$b"
                  break
                fi
              done
            fi
            if [ -n "$DISMISSED" ]; then
              echo "SPIKE-Q2: tcc-dismiss=OK (clicked \"$DISMISSED\"; answered for this run only)" \
                | tee -a "$EVIDENCE/verdict.txt"
            elif [ -n "$TCC_SEEN" ]; then
              echo "SPIKE-Q2: tcc-dismiss=FAILED (the prompt is still up; every later click lands on it)" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q2: tcc-prompt=ABSENT (no UserNotificationCenter alert; see the probes above)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi

            echo
            echo "--- did Cura's own registry record the disable? ---"
            # Uranium's registry rewrites plugins.json from its disabled list
            # on every start, so that file is the registry's own account of
            # whether the seeded cura.cfg was read at all.
            HONOURED=no
            PJS="$(find "$HOME/Library/Application Support" -maxdepth 4 -name plugins.json 2>/dev/null | head -5)"
            if [ -n "$PJS" ]; then
              # read-into-while, not for-over-$PJS: the path has a space in
              # it ("Application Support"), and a here-string keeps the loop
              # in this shell so HONOURED survives it.
              while IFS= read -r f; do
                echo "$f: $(tr -d '\n' <"$f" | cut -c1-400)"
                case "$(grep -o '"disabled": *\[[^]]*\]' "$f" 2>/dev/null | head -1)" in
                  *UM3NetworkPrinting*) HONOURED=yes ;;
                esac
              done <<< "$PJS"
            else
              echo "no plugins.json anywhere under $HOME/Library/Application Support"
            fi
            PREV="$(cat "$EVIDENCE/tcc-prevention-state.txt" 2>/dev/null)"
            echo "SPIKE-Q2: tcc-prevention-honoured=$HONOURED (registry read-back; prevention=${PREV:-unknown})" \
              | tee -a "$EVIDENCE/verdict.txt"
            if [ -n "$DISMISSED" ]; then
              echo "SPIKE-Q2: tcc-outcome=PRESENT-DISMISSED kind=$TCC_KIND (prevention was ${PREV:-unknown}; the alert had to be clicked away)" \
                | tee -a "$EVIDENCE/verdict.txt"
            elif [ -n "$TCC_SEEN" ]; then
              echo "SPIKE-Q2: tcc-outcome=PRESENT-NOT-DISMISSED kind=$TCC_KIND (prevention was ${PREV:-unknown}; the prompt sat over the session)" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q2: tcc-outcome=ABSENT (prevention was ${PREV:-unknown}; no local-network prompt appeared)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi

            echo
            echo "=== where Cura's window is (the capture itself is the whole display) ==="
            # The recorder captures the whole display, so this is not a bound:
            # it is the check that the frame contains Cura rather than whatever
            # is in front of it - and that the window is wholly INSIDE the
            # display, because a window placed partly off the screen is
            # CLIPPED by a full-display capture and nothing in the file says
            # so. The reads go through System Events, which may itself need an
            # Automation grant, so a refusal is recorded as the result rather
            # than assumed away. The window is NOT maximised: the harness pins
            # it smaller than the screen on purpose, so the screen-fits
            # assertion keeps its subject. A test that deliberately moves the
            # window out of bounds opts out with SPIKE_OFFSCREEN_WINDOW=allow.
            BOUNDS_POLICY="${SPIKE_OFFSCREEN_WINDOW:-clamp}"
            echo "window bounds policy: $BOUNDS_POLICY (SPIKE_OFFSCREEN_WINDOW; 'allow' leaves a deliberately off-screen window where the test put it)"
            # The display the window is compared against: the size the
            # recording actually is, from the probe above, because that is the
            # area a clipped window would be clipped out of. Never the pinned
            # geometry - a runner that could not be moved to the pinned size
            # would then have its window reported as fitting inside a display
            # it does not have, which is what the 1024x768 run's
            # "inside the 1920x1080 display" line claimed.
            DISP_W="${PROBE_DIMS%%x*}"
            DISP_H="${PROBE_DIMS##*x}"
            DISP_SRC="the frame the recorder produces (ffprobe on the probe)"
            if [ -z "$DISP_W" ] || [ -z "$DISP_H" ] || [ "$DISP_W" = "$PROBE_DIMS" ]; then
              # No probe frame: the desktop bounds System Events reports are
              # still a measurement of the screen rather than of the argv.
              DESKTOP="$(osascript -e 'tell application "Finder" to get bounds of window of desktop' 2>&1)"
              DISP_W="$(printf '%s' "$DESKTOP" | cut -d, -f3 | tr -dc '0-9')"
              DISP_H="$(printf '%s' "$DESKTOP" | cut -d, -f4 | tr -dc '0-9')"
              DISP_SRC="the desktop bounds (System Events: ${DESKTOP:-unreadable})"
            fi
            if [ -z "$DISP_W" ] || [ -z "$DISP_H" ]; then
              DISP_W="$(printf '%s' "${DISP_AFTER:-}" | sed -n 's/^\([0-9][0-9]*\)x.*/\1/p')"
              DISP_H="$(printf '%s' "${DISP_AFTER:-}" | sed -n 's/^[0-9][0-9]*x\([0-9][0-9]*\).*/\1/p')"
              DISP_SRC="the display reading (${DISP_AFTER:-unreadable}, ${DISPLAY_WHY})"
            fi
            case "${DISP_W}${DISP_H}" in
              ''|*[!0-9]*) DISP_W=""; DISP_H="" ;;
            esac
            if [ -z "$DISP_W" ] || [ -z "$DISP_H" ]; then
              echo "window bounds: neither a recorded frame nor the desktop bounds nor the display reading gave a size, so the window cannot be checked against the area the recording covers - the verdict below is UNKNOWN, not a fit against a geometry this runner may not have"
            else
              echo "window bounds: the display the window is checked against is ${DISP_W}x${DISP_H}, from ${DISP_SRC}"
            fi
            WPROC="$(osascript -e 'tell application "System Events" to get name of every process whose name contains "Cura"' 2>&1 | tr ',' '\n' | sed -n '/[Cc]ura/p' | head -1 | sed 's/^ *//;s/ *$//')"
            WFRONT=""
            WMIN="<unreadable>"
            WRECT="<unreadable>"
            WPX=""; WPY=""; WPW=""; WPH=""
            # One reader for every look, so the position, size, focus and
            # minimised state always come from the same instant.
            read_window() {
              WFRONT="$(osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1)"
              local wpos wsize
              wpos="$(osascript -e "tell application \"System Events\" to tell process \"$WPROC\" to get position of window 1" 2>&1)"
              wsize="$(osascript -e "tell application \"System Events\" to tell process \"$WPROC\" to get size of window 1" 2>&1)"
              WMIN="$(osascript -e "tell application \"System Events\" to tell process \"$WPROC\" to get value of attribute \"AXMinimized\" of window 1" 2>&1)"
              WRECT="$wpos / $wsize"
              WPX="$(printf '%s' "$wpos" | cut -d, -f1 | tr -dc '0-9-')"
              WPY="$(printf '%s' "$wpos" | cut -d, -f2 | tr -dc '0-9-')"
              WPW="$(printf '%s' "$wsize" | cut -d, -f1 | tr -dc '0-9-')"
              WPH="$(printf '%s' "$wsize" | cut -d, -f2 | tr -dc '0-9-')"
              echo "window 1: position='${wpos}' size='${wsize}' minimised='${WMIN}' frontmost='${WFRONT:-<unreadable>}'"
            }
            if [ -z "$WPROC" ]; then
              echo "window: no process name containing 'Cura' could be read (System Events may be ungranted)"
            else
              echo "window process (read, not assumed): $WPROC"
              # Up to three looks: an alert can hold the focus for a moment
              # after it is dismissed, and what matters is the state the
              # recording runs in, not the state it was found in.
              for attempt in 1 2 3; do
                read_window
                case "$WFRONT" in
                  *[Cc]ura*) break ;;
                esac
                if [ "$attempt" = 1 ]; then
                  echo "Cura does not hold the focus - bringing it forward (open -a: no permission needed)"
                  open -a "$APP"
                  echo "open -a exit: $?"
                fi
                sleep 3
              done
              # Bounds, against the display: a window placed partly off the
              # screen is clipped by the full-screen capture, which is what
              # the owner saw in a recording of this leg.
              case "$WPX$WPY$WPW$WPH" in
                ''|*[!0-9-]*)
                  echo "window bounds: the rectangle could not be read, so it cannot be checked against the display" ;;
                *)
                  if [ -z "$DISP_W" ] || [ -z "$DISP_H" ]; then
                    echo "window bounds: the display this run records could not be measured, so the window is not checked against it and no clamp is attempted (moving a window against an invented bound is worse than saying the bound is unknown)"
                    echo "SPIKE-Q2: window-bounds=UNKNOWN ($WPX,$WPY ${WPW}x${WPH}; the display this run records could not be measured)" \
                      | tee -a "$EVIDENCE/verdict.txt"
                  elif [ "$WPX" -ge 0 ] && [ "$WPY" -ge 0 ] && \
                     [ $((WPX + WPW)) -le "$DISP_W" ] && [ $((WPY + WPH)) -le "$DISP_H" ]; then
                    echo "window bounds: in-bounds ($WPX,$WPY ${WPW}x${WPH} inside ${DISP_W}x${DISP_H})"
                    echo "SPIKE-Q2: window-bounds=OK ($WPX,$WPY ${WPW}x${WPH} inside the ${DISP_W}x${DISP_H} display, nothing clipped)" \
                      | tee -a "$EVIDENCE/verdict.txt"
                  elif [ "$BOUNDS_POLICY" = allow ]; then
                    echo "window bounds: OUT of bounds ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H}) and the run opted out (SPIKE_OFFSCREEN_WINDOW=allow), so it is left where it is and a clipped frame is expected"
                    echo "SPIKE-Q2: window-bounds=CLIPPED-ON-PURPOSE ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H}; the test moved it out and the run allowed it)" \
                      | tee -a "$EVIDENCE/verdict.txt"
                  elif [ "$WPW" -gt "$DISP_W" ] || [ "$WPH" -gt "$DISP_H" ]; then
                    echo "window bounds: OUT of bounds and the window (${WPW}x${WPH}) is larger than the display (${DISP_W}x${DISP_H}), so it cannot be brought fully inside it"
                    echo "SPIKE-Q2: window-bounds=CLIPPED ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H}: part of the window is outside the display, so the full-screen recording omits it)" \
                      | tee -a "$EVIDENCE/verdict.txt"
                  else
                    echo "window bounds: OUT of bounds ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H})"
                    NEWX="$WPX"
                    NEWY="$WPY"
                    [ "$NEWX" -lt 0 ] && NEWX=0
                    [ $((NEWX + WPW)) -gt "$DISP_W" ] && NEWX=$((DISP_W - WPW))
                    [ "$NEWY" -lt 0 ] && NEWY=0
                    [ $((NEWY + WPH)) -gt "$DISP_H" ] && NEWY=$((DISP_H - WPH))
                    # The mechanism is System Events' set position, which needs
                    # the Automation/Accessibility grant; a refusal is recorded
                    # with its own words rather than assumed to have worked.
                    echo "moving the window to $NEWX,$NEWY (System Events set position of window 1; size kept at ${WPW}x${WPH})"
                    MOVE_OUT="$(osascript -e "tell application \"System Events\" to tell process \"$WPROC\" to set position of window 1 to {$NEWX, $NEWY}" 2>&1)"
                    echo "set position result: ${MOVE_OUT:-<no output>}"
                    sleep 2
                    read_window
                    if [ "$WPX" -ge 0 ] && [ "$WPY" -ge 0 ] && \
                       [ $((WPX + WPW)) -le "$DISP_W" ] && [ $((WPY + WPH)) -le "$DISP_H" ]; then
                      echo "SPIKE-Q2: window-bounds=OK (moved to $WPX,$WPY ${WPW}x${WPH} inside ${DISP_W}x${DISP_H} by System Events set position)" \
                        | tee -a "$EVIDENCE/verdict.txt"
                    else
                      echo "SPIKE-Q2: window-bounds=CLIPPED ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H}: the window is outside the display and the move did not bring it back)" \
                        | tee -a "$EVIDENCE/verdict.txt"
                      echo "FINDING: the window is not wholly inside the display and could not be moved into it, so the recording is clipped - reported here rather than left to be noticed by eye"
                    fi
                  fi
                  ;;
              esac
            fi
            # The verdict is about what was VERIFIED. The recording continues
            # either way: a whole-display capture needs neither a rectangle nor
            # the focus to start, so an unverified window is reported as a
            # frame that may show something else, not as a failed recording.
            case "$WFRONT$WMIN$WPX$WPY$WPW$WPH" in
              *[Cc]ura*false*[0-9]*)
                echo "SPIKE-Q2: window=VISIBLE ($WPROC holds the front, window 1 at $WRECT, not minimised; the capture is the whole display, so Cura is in frame wherever the window sits)" \
                  | tee -a "$EVIDENCE/verdict.txt" ;;
              *)
                echo "SPIKE-Q2: window=NOT-VERIFIED (frontmost='${WFRONT:-<unreadable>}' minimised='${WMIN}' window1='${WRECT}')" \
                  | tee -a "$EVIDENCE/verdict.txt"
                echo "FINDING: Cura's window could not be shown to be frontmost, unminimised and readable, so the full-screen recording may be of whatever covers it - reported rather than assumed, and the recording continues because a whole-display capture needs no rectangle to start" ;;
            esac

            echo
            echo "=== the Welcome wizard (runner.py's first gate asserts it absent) ==="
            # Cura shows "Welcome to UltiMaker Cura" exactly when there is no
            # active machine, and it has no "seen" flag to set: the wizard is
            # in-window QML whose visibility is decided once, at
            # initializationFinished. So the machine is what keeps it down,
            # and the machine is visible in Cura's own log, in lines only the
            # error checker writes: "Error check finished, result" and "New
            # error check scheduled." appear only while a machine is active
            # and repeat every ~10 s, where "No active machine, nothing to
            # check." is written once when there is none - and that last one
            # appears in WORKING runs too, in the moment before the machine is
            # restored, so an active-machine line settles it and the
            # no-machine line alone is the weaker, inferred case.
            WELCOME_LOGS=""
            WELCOME_AC=""
            WELCOME_NA=""
            # Read line by line rather than over a word-split list: the
            # directory this searches is "Application Support", so a split
            # would hand every path in it over in two pieces.
            WELCOME_CANDIDATES="$(printf '%s\n%s\n' \
              "$(find "$HOME/Library/Application Support" -maxdepth 5 -type f -name 'cura.log*' 2>/dev/null | sort)" \
              "$EVIDENCE/cura-launch.log")"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              [ -f "$f" ] || continue
              WELCOME_LOGS="$WELCOME_LOGS $f"
              WELCOME_AC_N="$(grep -c -e 'Error check finished, result' -e 'New error check scheduled' "$f" 2>/dev/null)"
              WELCOME_NA_N="$(grep -c 'No active machine, nothing to check' "$f" 2>/dev/null)"
              echo "  $f: active-machine lines ${WELCOME_AC_N:-0}, no-active-machine lines ${WELCOME_NA_N:-0}"
              [ "${WELCOME_AC_N:-0}" -gt 0 ] && WELCOME_AC="$WELCOME_AC $f"
              [ "${WELCOME_NA_N:-0}" -gt 0 ] && WELCOME_NA="$WELCOME_NA $f"
            done <<< "$WELCOME_CANDIDATES"
            [ -n "$WELCOME_LOGS" ] || echo "  no Cura log could be read (neither its own nor the launch capture): nothing to read a machine state out of"
            # The one direct look: the wizard's own words in the window. It can
            # only ever prove PRESENT - an ungranted Automation permission or a
            # Qt build that exposes no text reads as nothing, never as absent.
            WELCOME_TEXT=""
            if [ -n "$WPROC" ]; then
              WELCOME_TEXT="$(osascript -e "tell application \"System Events\" to tell process \"$WPROC\" to get value of every static text of window 1" 2>&1)"
              echo "  window text probe: ${WELCOME_TEXT:-<no output>}"
            else
              echo "  window text probe: not attempted (no Cura process name was readable)"
            fi
            WELCOME_MODE=UNKNOWN
            WELCOME_WHY="no readable source carried a machine-state marker (logs read:${WELCOME_LOGS:- <none>}; window text: ${WELCOME_TEXT:-<none>})"
            case "$WELCOME_TEXT" in
              *"Welcome to UltiMaker Cura"*|*"set up UltiMaker Cura"*|*"Get started"*)
                WELCOME_MODE=PRESENT
                WELCOME_WHY="the wizard's own words are in Cura's window right now: $(printf '%s' "$WELCOME_TEXT" | tr -d '\r\n' | cut -c1-100)" ;;
              *)
                if [ -n "$WELCOME_AC" ]; then
                  WELCOME_MODE=ABSENT
                  WELCOME_WHY="Cura's own log shows an active machine (active-machine lines in${WELCOME_AC}); the wizard's visibility is decided at startup from exactly that, so it was never shown"
                elif [ -n "$WELCOME_NA" ]; then
                  WELCOME_MODE=PRESENT
                  WELCOME_WHY="no wizard text was readable, but Cura's log has only the no-active-machine line (in${WELCOME_NA}) - the wizard's precondition holds, so it is on screen and runner.py's first gate would stall"
                fi ;;
            esac
            echo "SPIKE-Q2: welcome=$WELCOME_MODE ($WELCOME_WHY)" \
              | tee -a "$EVIDENCE/verdict.txt"
            if [ "$WELCOME_MODE" != "ABSENT" ]; then
              echo "FINDING: the welcome= line above is not ABSENT - either the wizard is up, or the state could not be read. The seed= lines in the config step name what was written and read back (cura.cfg's active_machine, the machine stack's id); runner.py's first gate asserts the wizard absent, so this has to read ABSENT before the integration phase can run a scenario"
            fi

            echo
            echo "=== still capture (inside the recording window) ==="
            # Full-screen, like the recorder and like runner.py's own stills:
            # a still of the whole display follows whatever a resize test does
            # to the window, where a still of a fixed rectangle would not.
            screencapture -x "$SHOT"
            echo "screencapture exit: $?"
            if [ -f "$SHOT" ]; then
              ls -l "$SHOT"
              file "$SHOT"
              PNG_WH="$(file "$SHOT" | sed -n 's/.*PNG image data, \([0-9][0-9]* x [0-9][0-9]*\).*/\1/p')"
              echo "still size: ${PNG_WH:-unreadable} (the display this run captures is ${DISP_W}x${DISP_H})"
              echo "note: a solid/empty frame compresses to a few KB, a real"
              echo "      desktop to hundreds - the size IS the signal"
            fi
            # Steady-state re-read of the geometry that decides whether the
            # recording is clipped: a window the run moved after the bounds
            # check above shows up here rather than in someone's eye later.
            if [ -n "$WPROC" ]; then
              read_window
              case "$WPX$WPY$WPW$WPH" in
                ''|*[!0-9-]*) echo "window rectangle at the still: unreadable ($WRECT)" ;;
                *)
                  echo "window rectangle at the still, vs the display ${DISP_W}x${DISP_H}: $WPX,$WPY ${WPW}x${WPH}"
                  if [ "$WPX" -lt 0 ] || [ "$WPY" -lt 0 ] || \
                     [ $((WPX + WPW)) -gt "$DISP_W" ] || [ $((WPY + WPH)) -gt "$DISP_H" ]; then
                    echo "SPIKE-Q2: window-bounds=CLIPPED-AT-STILL ($WPX,$WPY ${WPW}x${WPH} against ${DISP_W}x${DISP_H}: the window moved out of the display during the run, so the recording omits that part of it)" \
                      | tee -a "$EVIDENCE/verdict.txt"
                  fi
                  ;;
              esac
            fi
            echo
            echo "=== stopping the recorder (SIGINT first, as the harness stops it: a kill leaves no mp4 index) ==="
            if [ -n "${REC_PID:-}" ] && kill -0 "$REC_PID" 2>/dev/null; then
              # SIGINT is what lets ffmpeg finalise the mp4 index; the
              # harness's pkill -9 sweep below is the backstop.
              kill -INT "$REC_PID" 2>/dev/null
              sleep 3
              if kill -0 "$REC_PID" 2>/dev/null; then
                echo "still running after SIGINT - SIGKILL, as ui_test.sh does"
                kill -9 "$REC_PID" 2>/dev/null
                sleep 2
              fi
              wait "$REC_PID" 2>/dev/null
              echo "recorder exit status: $?"
            else
              echo "no recorder process to stop"
            fi
            pkill -9 -f 'ffmpe[g]' 2>/dev/null
            echo "teardown sweep (pkill -9 -f ffmpe[g], as ui_test.sh) done"
            echo "--- recorder output ---"
            tail -20 "$EVIDENCE/recorder.log" 2>/dev/null
            echo "--- the recording ---"
            # A file that exists is not a recording: an ffmpeg killed before
            # it encoded anything leaves a valid container of a few dozen
            # bytes, and that must never read as OK. 10 KB sits well above
            # an empty one and well below a single 1080p frame.
            VIDEO_MIN=10240
            VSIZE=0
            [ -f "$VIDEO" ] && VSIZE="$(stat -f%z "$VIDEO" 2>/dev/null || echo 0)"
            if [ "$VSIZE" -ge "$VIDEO_MIN" ]; then
              ls -l "$VIDEO"
              du -h "$VIDEO"
              file "$VIDEO"
              echo "--- container/codec (ffmpeg -i exits non-zero here: expected) ---"
              ffmpeg -hide_banner -i "$VIDEO" 2>&1 | head -12
              echo "--- ffprobe's own reading of the container ---"
              PROBE_TEXT="$(ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,nb_frames \
                -of default=noprint_wrappers=1 "$VIDEO" 2>&1 | head -12)"
              echo "$PROBE_TEXT"
              # The recorded frame size, against the pinned geometry: "the
              # recordings look low resolution" is answered by the numbers,
              # and a capture that came out at the display's own size rather
              # than the pinned one must be visible here, not inferred.
              REC_W="$(printf '%s\n' "$PROBE_TEXT" | sed -n 's/^width=//p' | head -1)"
              REC_H="$(printf '%s\n' "$PROBE_TEXT" | sed -n 's/^height=//p' | head -1)"
              REC_DIMS="unknown"
              [ -n "$REC_W" ] && [ -n "$REC_H" ] && REC_DIMS="${REC_W}x${REC_H}"
              echo "recorded frame size: $REC_DIMS (pinned geometry $VIDEO_SIZE, display before the run: ${DISP_BEFORE:-unreadable})"
              echo "SPIKE-Q2: video=OK ($VSIZE bytes, mp4, avfoundation, $REC_DIMS)" \
                | tee -a "$EVIDENCE/verdict.txt"
            elif [ "$VSIZE" -gt 0 ]; then
              echo "SPIKE-Q2: video=FAILED ($VSIZE bytes: a container with no frames - see recorder.log above)" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q2: video=FAILED (ffmpeg wrote no scenario.mp4 - see recorder.log and the device probe above)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi
            echo
            echo "=== the harness's own still form: ffmpeg -frames:v 1 ==="
            # runner.py:96-104 captures stills through ffmpeg as well
            # (x11grab, -video_size SIZE, -frames:v 1), so one here reports
            # whether the harness's capture path itself works natively on
            # this runner - the display, one frame, no -framerate.
            if [ -n "$FFMPEG" ]; then
              ffmpeg -y -loglevel error -f avfoundation -video_size "$VIDEO_SIZE" \
                -i "${SCREEN_INDEX}:none" -frames:v 1 "$FFSTILL"
              echo "ffmpeg still exit: $?"
              if [ -s "$FFSTILL" ]; then
                ls -l "$FFSTILL"
                file "$FFSTILL"
                echo "SPIKE-Q2: ffmpeg-still=OK ($(du -h "$FFSTILL" | cut -f1), asked for $VIDEO_SIZE)" \
                  | tee -a "$EVIDENCE/verdict.txt"
              else
                echo "SPIKE-Q2: ffmpeg-still=FAILED (no PNG written)" \
                  | tee -a "$EVIDENCE/verdict.txt"
              fi
            fi
            echo
            echo "--- launch log (tail) ---"
            tail -40 "$EVIDENCE/cura-launch.log" 2>/dev/null
            echo
            echo "--- cleaning up ---"
            pkill -f 'UltiMaker-Cur[a]'
            echo "pkill exit: $?"
            sleep 2
            if [ -s "$SHOT" ]; then
              echo "SPIKE-Q2: screenshot=OK ($(du -h "$SHOT" | cut -f1))" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q2: screenshot=FAILED (no PNG written)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi
            if [ "$ALIVE" = no ]; then
              echo "SPIKE-Q1: launch=FAILED (process exited within ${WAIT_SECS} s)" \
                | tee -a "$EVIDENCE/verdict.txt"
            else
              echo "SPIKE-Q1: launch=OK (still running after the wait)" \
                | tee -a "$EVIDENCE/verdict.txt"
            fi
          } 2>&1 | tee "$LOG"
          exit 0
      - name: "Q2 evidence: seed Cura's config (Windows: the machine that keeps the wizard down)"
        # runner.py's first gate asserts "welcome absent", and Cura puts the
        # "Welcome to UltiMaker Cura" wizard up exactly when there is no
        # active machine: shouldShowWelcomeDialog is "activeMachine is None"
        # on every version this spike ranges over, and there is no "seen" flag
        # to set. A run without a machine therefore stalls at that dialog
        # before a scenario can do anything.
        # MachineManager.setInitialActiveMachine - reached from a callLater
        # inside CuraApplication.run, before the QML decides the wizard's
        # visibility - restores a machine only when BOTH halves are there:
        # cura/active_machine names one, and a stack with that id can be
        # found. The preferences half is cura.cfg; the stack half is Cura's
        # own machine_instances/<name>.global.cfg plus every container its
        # [containers] list names, because a name Cura cannot resolve makes
        # ContainerStack.deserialize raise and then there is no machine at
        # all. Each file's format version is read out of the installed build
        # rather than assumed. Whether the seed took is reported by the
        # launch step's welcome= line, not assumed from this step's success.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $EVIDENCE = (Resolve-Path -LiteralPath $EVIDENCE).Path
          $log = Join-Path $EVIDENCE 'config-seed-windows.txt'
          $verdict = Join-Path $EVIDENCE 'verdict.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          function V($m) { W $m; Add-Content -Path $verdict -Value $m }
          $machine = 'FDM Printer Base Description'
          $machineFile = 'FDM+Printer+Base+Description'
          $extruder = 'fdmextruder #2'
          $extruderFile = 'fdmextruder+%232'
          W "=== the machine seed (the Welcome wizard's precondition) ==="

          # The install dir, from the install step's own record. Every format
          # version is read out of the tree that will consume it.
          $pathFile = Join-Path $EVIDENCE 'binary-path.txt'
          $binary = if (Test-Path $pathFile) { Get-Content $pathFile -First 1 } else { $null }
          if (-not $binary -or -not (Test-Path -LiteralPath $binary)) {
            W "no installed binary on record - the file-format versions cannot be read, so nothing is seeded"
            V "SPIKE-Q2: seed=SKIPPED (no install: those versions are read out of the installed build, and nothing is installed)"
            exit 0
          }
          $dir = Split-Path -Parent $binary
          W "install dir: $dir"
          function Find-Under($root, $name, $parentName) {
            # The package tree sits under the install root on this build, but
            # the search does not assume it: the first file of that name whose
            # parent directory is the package is the one that is read.
            $hit = Get-ChildItem -LiteralPath $root -Recurse -Depth 6 -File -Filter $name -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq $parentName } | Select-Object -First 1
            if ($hit) { return $hit.FullName }
            return ''
          }
          $prefPy = Find-Under $dir 'Preferences.py' 'UM'
          $stackPy = Find-Under $dir 'ContainerStack.py' 'Settings'
          $instPy = Find-Under $dir 'InstanceContainer.py' 'Settings'
          $curaAppPy = Find-Under $dir 'CuraApplication.py' 'cura'
          function Get-VersionConst($path, $name) {
            if (-not $path -or -not (Test-Path -LiteralPath $path)) { return '' }
            $m = Select-String -LiteralPath $path -Pattern ("^\s*" + $name + "\s*=\s*([0-9]+)") -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($m) { return $m.Matches[0].Groups[1].Value }
            return ''
          }
          $prefVer = Get-VersionConst $prefPy 'Version'
          $csVer = Get-VersionConst $stackPy 'Version'
          $icVer = Get-VersionConst $instPy 'Version'
          $setVer = Get-VersionConst $curaAppPy 'SettingVersion'
          W ("preferences format version : {0}  (from {1})" -f $(if ($prefVer) { $prefVer } else { '<unreadable>' }), $prefPy)
          W ("container stack version    : {0}  (from {1})" -f $(if ($csVer) { $csVer } else { '<unreadable>' }), $stackPy)
          W ("instance container version : {0}  (from {1})" -f $(if ($icVer) { $icVer } else { '<unreadable>' }), $instPy)
          W ("setting version            : {0}  (from {1})" -f $(if ($setVer) { $setVer } else { '<unreadable>' }), $curaAppPy)

          # The config root: APPDATA on Windows (Uranium's
          # _getConfigStorageRootPath), with the application identifier and the
          # major.minor of the installed build below it; LOCALAPPDATA held this
          # only before 4.x. Both are listed, so a tree Cura already made shows
          # up here rather than being guessed at.
          $verInfo = (Get-Item -LiteralPath $binary).VersionInfo
          $bundleVer = $verInfo.ProductVersion
          if (-not $bundleVer) { $bundleVer = $verInfo.FileVersion }
          if (-not $bundleVer) { $bundleVer = $env:CURA_VERSION }
          $mm = ''
          if ($bundleVer -match '^([0-9]+)\.([0-9]+)') { $mm = $matches[1] + '.' + $matches[2] }
          if (-not $mm -and $env:CURA_VERSION -match '^([0-9]+)\.([0-9]+)') { $mm = $matches[1] + '.' + $matches[2] }
          if (-not $mm) {
            W "the installed version could not be read (ProductVersion, FileVersion and CURA_VERSION are all empty)"
            V "SPIKE-Q2: seed=SKIPPED (no version: the config directory is version-stamped, and writing the wrong one is worse than writing none)"
            exit 0
          }
          foreach ($e in @('APPDATA', 'LOCALAPPDATA')) {
            $v = [System.Environment]::GetEnvironmentVariable($e)
            if ($v) {
              $p = Join-Path (Join-Path $v 'cura') $mm
              W ("{0} root: {1} exists={2}" -f $e, $p, (Test-Path -LiteralPath $p))
            }
          }
          $cfgDir = Join-Path (Join-Path $env:APPDATA 'cura') $mm
          $cfgPath = Join-Path $cfgDir 'cura.cfg'
          W "installed version: $bundleVer -> config dir $cfgDir"

          $seedCount = 0
          function Set-SeedFile($path, $lines, [ref]$count) {
            $parent = Split-Path -Parent $path
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            try {
              # ASCII: a BOM would make Cura's configparser read the first key
              # as garbage, and nothing written here needs more than ASCII.
              Set-Content -LiteralPath $path -Value $lines -Encoding ASCII -ErrorAction Stop
            } catch {
              W ("  {0}: could not be written ({1})" -f $path, $_.Exception.Message)
              return $false
            }
            if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -gt 0) {
              $count.Value = $count.Value + 1
              W ("  {0}: written ({1} bytes)" -f $path, (Get-Item -LiteralPath $path).Length)
              return $true
            }
            W ("  {0}: COULD NOT be written" -f $path)
            return $false
          }

          $seedMode = 'FAILED'
          $cfgOk = $false
          if (-not $prefVer -or -not $csVer -or -not $icVer -or -not $setVer) {
            $seedMode = 'SKIPPED'
            W "the machine seed is SKIPPED: a file-format version could not be read out of the installed build."
            W "  a container file written with the wrong version is rejected outright (ContainerStack.deserialize raises), so nothing is written rather than something invalid"
          } else {
            $seedMode = 'PARTIAL'
            # The preferences half. Nothing runs Cura before this step, so a
            # config already here would be an anomaly: it is reported, and only
            # the section this step owns is added, because a second [cura]
            # section would make the parser reject the whole file.
            if (Test-Path -LiteralPath $cfgPath) {
              W ("  {0}: ALREADY PRESENT before the launch - reported, not rewritten" -f $cfgPath)
              $hasCura = Select-String -LiteralPath $cfgPath -Pattern '^\[cura\]' -ErrorAction SilentlyContinue
              if ($hasCura) {
                $am = (Select-String -LiteralPath $cfgPath -Pattern '^\s*active_machine\s*=' -ErrorAction SilentlyContinue |
                  Select-Object -First 1)
                $amValue = ''
                if ($am) { $amValue = (($am.Line -split '=', 2)[1]).Trim() }
                W ("  it already carries a [cura] section: active_machine='{0}' (left as it stands)" -f $amValue)
                if ($amValue -eq $machine) { $cfgOk = $true }
              } else {
                Add-Content -LiteralPath $cfgPath -Value "`r`n[cura]`r`nactive_machine = $machine" -Encoding ASCII
                $seedCount++
                $cfgOk = $true
                W "  the [cura] section was appended to the file already there"
              }
            } else {
              if (Set-SeedFile $cfgPath @(
                  '[general]',
                  "version = $prefVer",
                  '',
                  '[cura]',
                  "active_machine = $machine"
                ) ([ref]$seedCount)) {
                $cfgOk = $true
              } else {
                W "  the preferences half is missing, so the machine cannot be restored"
              }
            }
            # The stack half, in the shape Cura itself writes it. The versions
            # are the installed build's own; the group id is Cura's own
            # per-install random uuid (GlobalStack assigns one when the file
            # carries none), so the constant here is only a valid uuid.
            Set-SeedFile (Join-Path $cfgDir "machine_instances\$machineFile.global.cfg") @(
              '[general]',
              "version = $csVer",
              "name = $machine",
              "id = $machine",
              '',
              '[metadata]',
              "setting_version = $setVer",
              'type = machine',
              'group_id = 374276e7-a0b1-41d8-b5a5-56c7dad1c04f',
              '',
              '[containers]',
              "0 = ${machine}_user",
              '1 = empty_quality_changes',
              '2 = empty_intent',
              '3 = normal',
              '4 = empty_material',
              '5 = empty_variant',
              "6 = ${machine}_settings",
              '7 = fdmprinter'
            ) ([ref]$seedCount) | Out-Null
            Set-SeedFile (Join-Path $cfgDir "extruders\$extruderFile.extruder.cfg") @(
              '[general]',
              "version = $csVer",
              'name = Extruder',
              "id = $extruder",
              '',
              '[metadata]',
              "setting_version = $setVer",
              'type = extruder_train',
              'position = 0',
              "machine = $machine",
              '',
              '[containers]',
              "0 = ${extruder}_user",
              '1 = empty_quality_changes',
              '2 = empty_intent',
              '3 = normal',
              '4 = generic_pla',
              '5 = empty_variant',
              "6 = ${extruder}_settings",
              '7 = fdmextruder'
            ) ([ref]$seedCount) | Out-Null
            Set-SeedFile (Join-Path $cfgDir "definition_changes\${machineFile}_settings.inst.cfg") @(
              '[general]',
              "version = $icVer",
              "name = ${machine}_settings",
              'definition = fdmprinter',
              '',
              '[metadata]',
              'type = definition_changes',
              "setting_version = $setVer",
              '',
              '[values]',
              'extruders_enabled_count = 1'
            ) ([ref]$seedCount) | Out-Null
            Set-SeedFile (Join-Path $cfgDir "definition_changes\${extruderFile}_settings.inst.cfg") @(
              '[general]',
              "version = $icVer",
              "name = ${extruder}_settings",
              'definition = fdmextruder',
              '',
              '[metadata]',
              'type = definition_changes',
              "setting_version = $setVer",
              '',
              '[values]'
            ) ([ref]$seedCount) | Out-Null
            Set-SeedFile (Join-Path $cfgDir "user\${machineFile}_user.inst.cfg") @(
              '[general]',
              "version = $icVer",
              "name = ${machine}_user",
              'definition = fdmprinter',
              '',
              '[metadata]',
              'type = user',
              "setting_version = $setVer",
              "machine = $machine",
              '',
              '[values]'
            ) ([ref]$seedCount) | Out-Null
            Set-SeedFile (Join-Path $cfgDir "user\${extruderFile}_user.inst.cfg") @(
              '[general]',
              "version = $icVer",
              "name = ${extruder}_user",
              'definition = fdmprinter',
              '',
              '[metadata]',
              'type = user',
              "setting_version = $setVer",
              "extruder = $extruder",
              '',
              '[values]'
            ) ([ref]$seedCount) | Out-Null
            W "--- read back ---"
            if (Test-Path -LiteralPath $cfgPath) {
              Select-String -LiteralPath $cfgPath -Pattern '^\s*(version|active_machine)\s*=' -ErrorAction SilentlyContinue |
                ForEach-Object { W ("  cura.cfg: " + $_.Line.Trim()) }
            }
            $miPath = Join-Path $cfgDir "machine_instances\$machineFile.global.cfg"
            if (Test-Path -LiteralPath $miPath) {
              Select-String -LiteralPath $miPath -Pattern '^\s*(id|type)\s*=' -ErrorAction SilentlyContinue |
                ForEach-Object { W ("  machine stack: " + $_.Line.Trim()) }
            }
            if ($cfgOk -and $seedCount -ge 6) { $seedMode = 'OK' }
            elseif ($seedCount -eq 0) { $seedMode = 'FAILED' }
          }
          W "--- what is under the config dir now ---"
          if (Test-Path -LiteralPath $cfgDir) {
            Get-ChildItem -LiteralPath $cfgDir -Recurse -Depth 2 -File -ErrorAction SilentlyContinue |
              ForEach-Object { W ("  " + $_.FullName.Substring($cfgDir.Length + 1) + " (" + $_.Length + " bytes)") }
          } else {
            W "  the config dir does not exist"
          }
          V "SPIKE-Q2: seed=$seedMode (machine '$machine' and extruder '$extruder' seeded under $cfgDir : $seedCount/7 files written, active_machine seeded=$cfgOk; the launch step's welcome= line reports whether Cura loaded it)"
          if ($seedMode -ne 'OK') {
            W "FINDING: the machine seed is not OK, so the Welcome wizard is expected to be up when Cura starts - see the seed= line above and the launch step's welcome= line"
          }


      - name: "Q2 evidence: launch Cura and capture the screen (Windows)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          # The directory this step runs in. Every foreground command here (the
          # gdigrab probes, ffmpeg, the still capture) resolves its relative
          # output path against it, so anything started in the background has
          # to be handed the same directory explicitly - see Start-BgCapture.
          $stepCwd = (Get-Location).Path
          $log = Join-Path $EVIDENCE 'launch-windows.txt'
          $verdict = Join-Path $EVIDENCE 'verdict.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          function V($m) { W $m; Add-Content -Path $verdict -Value $m }

          # --- the native calls this step needs ---------------------------
          # One compiled class in three groups, every one of them a Windows
          # API call with no managed equivalent:
          #   * window: the rectangle the window occupies and the checks
          #     that say it is on screen and in front rather than behind
          #     something - the capture is the whole display, so a window
          #     that is occluded is a frame recording whatever covers it;
          #   * console: the control event that stops the recorder the way
          #     the harness stops it everywhere else (the teardown below);
          #   * display: EnumDisplaySettings / ChangeDisplaySettings, the
          #     only way to move this runner to the harness geometry.
          # A build failure is reported rather than fatal: the teardown then
          # falls back to the force, and the video verdict already names a
          # missing index as its own fault.
          # The structs are TOP-LEVEL, never nested in the class below. A
          # nested type is addressed by its CLR name (Outer+Inner); the
          # dotted spelling that reads naturally in PowerShell does not
          # resolve, so New-Object returns nothing and every [ref] handed to
          # an out parameter fails to convert. That is what a 0x0 window
          # rectangle and an empty DEVMODE size both were: the same silent
          # null, not two bugs in the API calls.
          $csSrc = @(
            'using System;',
            'using System.Text;',
            'using System.Runtime.InteropServices;',
            '[StructLayout(LayoutKind.Sequential)]',
            'public struct MpfRect { public int Left; public int Top; public int Right; public int Bottom; }',
            '[StructLayout(LayoutKind.Sequential)]',
            'public struct MpfPoint { public int X; public int Y; }',
            # Windows defines DEVMODE as 220 bytes. That needs the Unicode
            # layout (EnumDisplaySettingsW/ChangeDisplaySettingsW), the two
            # fixed character arrays as ByValTStr of CCHDEVICENAME and
            # CCHFORMNAME (32 wide characters each) and the default packing
            # of 8. The caller measures this struct before it is used.
            '[StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode, Pack = 8)]',
            'public struct MpfDevMode {',
            '  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;',
            '  public ushort dmSpecVersion;',
            '  public ushort dmDriverVersion;',
            '  public ushort dmSize;',
            '  public ushort dmDriverExtra;',
            '  public uint dmFields;',
            '  public int dmUnionWord0;',
            '  public int dmUnionWord1;',
            '  public int dmUnionWord2;',
            '  public int dmUnionWord3;',
            '  public short dmColor;',
            '  public short dmDuplex;',
            '  public short dmYResolution;',
            '  public short dmTTOption;',
            '  public short dmCollate;',
            '  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;',
            '  public ushort dmLogPixels;',
            '  public uint dmBitsPerPel;',
            '  public uint dmPelsWidth;',
            '  public uint dmPelsHeight;',
            '  public uint dmDisplayFlags;',
            '  public uint dmDisplayFrequency;',
            '  public uint dmICMMethod;',
            '  public uint dmICMIntent;',
            '  public uint dmMediaType;',
            '  public uint dmDitherType;',
            '  public uint dmReserved1;',
            '  public uint dmReserved2;',
            '  public uint dmPanningWidth;',
            '  public uint dmPanningHeight;',
            '}',
            'public static class SpikeNative {',
            '  public delegate bool MpfEnumProc(IntPtr hwnd, IntPtr lparam);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool GetWindowRect(IntPtr hwnd, out MpfRect rect);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool IsWindow(IntPtr hwnd);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool IsWindowVisible(IntPtr hwnd);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool IsIconic(IntPtr hwnd);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern IntPtr GetForegroundWindow();',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool SetForegroundWindow(IntPtr hwnd);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool ShowWindow(IntPtr hwnd, int cmd);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool SetWindowPos(IntPtr hwnd, IntPtr after, int x, int y, int cx, int cy, uint flags);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern IntPtr WindowFromPoint(MpfPoint point);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern int GetSystemMetrics(int index);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern bool EnumWindows(MpfEnumProc callback, IntPtr lparam);',
            '  [DllImport("user32.dll", SetLastError = true)]',
            '  public static extern IntPtr GetWindow(IntPtr hwnd, uint cmd);',
            '  [DllImport("user32.dll", EntryPoint = "GetWindowTextLengthW", CharSet = CharSet.Unicode, SetLastError = true)]',
            '  public static extern int GetWindowTextLength(IntPtr hwnd);',
            '  [DllImport("user32.dll", EntryPoint = "GetWindowTextW", CharSet = CharSet.Unicode, SetLastError = true)]',
            '  public static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int max);',
            '  [DllImport("user32.dll", EntryPoint = "GetClassNameW", CharSet = CharSet.Unicode, SetLastError = true)]',
            '  public static extern int GetClassName(IntPtr hwnd, StringBuilder text, int max);',
            # A window that is not DWM-composited has no extended frame bounds;
            # the call then fails and GetWindowRect is the right answer.
            '  [DllImport("dwmapi.dll")]',
            '  public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attribute, out MpfRect value, int size);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern bool AttachConsole(uint pid);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern bool FreeConsole();',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern bool SetConsoleCtrlHandler(IntPtr handler, bool add);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern bool GenerateConsoleCtrlEvent(uint evt, uint group);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern uint GetConsoleProcessList(uint[] list, uint count);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern IntPtr GetConsoleWindow();',
            '  [DllImport("user32.dll", EntryPoint = "EnumDisplaySettingsW", CharSet = CharSet.Unicode, SetLastError = true)]',
            '  public static extern bool EnumDisplaySettings(string device, int mode, ref MpfDevMode devmode);',
            '  [DllImport("user32.dll", EntryPoint = "ChangeDisplaySettingsW", CharSet = CharSet.Unicode, SetLastError = true)]',
            '  public static extern int ChangeDisplaySettings(ref MpfDevMode devmode, int flags);',
            '  public static string DevModeLayout() {',
            '    Type t = typeof(MpfDevMode);',
            '    return string.Format("size={0} dmDeviceName@{1} dmSize@{2} dmFields@{3} dmFormName@{4} dmLogPixels@{5} dmBitsPerPel@{6} dmPelsWidth@{7} dmPelsHeight@{8}", Marshal.SizeOf(t), Marshal.OffsetOf(t, "dmDeviceName"), Marshal.OffsetOf(t, "dmSize"), Marshal.OffsetOf(t, "dmFields"), Marshal.OffsetOf(t, "dmFormName"), Marshal.OffsetOf(t, "dmLogPixels"), Marshal.OffsetOf(t, "dmBitsPerPel"), Marshal.OffsetOf(t, "dmPelsWidth"), Marshal.OffsetOf(t, "dmPelsHeight"));',
            '  }',
            '  public static bool DevModeOk() {',
            '    Type t = typeof(MpfDevMode);',
            '    return Marshal.SizeOf(t) == 220 && (int)Marshal.OffsetOf(t, "dmSize") == 68 && (int)Marshal.OffsetOf(t, "dmFields") == 72 && (int)Marshal.OffsetOf(t, "dmPelsWidth") == 172 && (int)Marshal.OffsetOf(t, "dmPelsHeight") == 176;',
            '  }',
            '  public static string DevModeText(MpfDevMode dm) {',
            '    return string.Format("{0}x{1} {2}bpp {3}Hz fields=0x{4:X}", dm.dmPelsWidth, dm.dmPelsHeight, dm.dmBitsPerPel, dm.dmDisplayFrequency, dm.dmFields);',
            '  }',
            '  public static string WindowTitle(IntPtr hwnd) {',
            '    int n = GetWindowTextLength(hwnd);',
            '    StringBuilder sb = new StringBuilder(n + 2);',
            '    GetWindowText(hwnd, sb, sb.Capacity);',
            '    return sb.ToString();',
            '  }',
            '  public static string WindowClass(IntPtr hwnd) {',
            '    StringBuilder sb = new StringBuilder(256);',
            '    GetClassName(hwnd, sb, sb.Capacity);',
            '    return sb.ToString();',
            '  }',
            '  public static uint WindowPid(IntPtr hwnd) { uint pid; GetWindowThreadProcessId(hwnd, out pid); return pid; }',
            '  public static string RectText(IntPtr hwnd) {',
            '    MpfRect r;',
            '    if (!GetWindowRect(hwnd, out r)) { return "unreadable"; }',
            '    return string.Format("{0},{1} {2}x{3}", r.Left, r.Top, r.Right - r.Left, r.Bottom - r.Top);',
            '  }',
            '  public static bool FrameRect(IntPtr hwnd, out MpfRect rect) {',
            '    rect = new MpfRect();',
            '    if (hwnd == IntPtr.Zero) { return false; }',
            '    try {',
            '      return DwmGetWindowAttribute(hwnd, 9, out rect, Marshal.SizeOf(typeof(MpfRect))) == 0;',
            '    } catch {',
            '      rect = new MpfRect();',
            '      return false;',
            '    }',
            '  }',
            # The main window handle of the launched pid is not always Cura's
            # (a launcher can own it), so the handle is chosen from an
            # enumeration and the row that won is printed with its score.
            '  private static IntPtr windowPick = IntPtr.Zero;',
            '  public static IntPtr LastPick() { return windowPick; }',
            '  public static string WindowReport(uint pid, string titleHint) {',
            '    windowPick = IntPtr.Zero;',
            '    StringBuilder rows = new StringBuilder();',
            '    int bestScore = 0;',
            '    EnumWindows(delegate(IntPtr hwnd, IntPtr lparam) {',
            '      string title = WindowTitle(hwnd);',
            '      string cls = WindowClass(hwnd);',
            '      uint wpid = WindowPid(hwnd);',
            '      bool visible = IsWindowVisible(hwnd);',
            '      bool iconic = IsIconic(hwnd);',
            '      bool owned = GetWindow(hwnd, 4) != IntPtr.Zero;',
            '      bool hint = titleHint.Length > 0 && title.IndexOf(titleHint, StringComparison.OrdinalIgnoreCase) >= 0;',
            '      bool cura = title.Length > 0 && title.IndexOf("cura", StringComparison.OrdinalIgnoreCase) >= 0;',
            '      int score = 0;',
            '      if (title.Length > 0) {',
            '        if (wpid == pid) { score += 4; }',
            '        if (hint) { score += 4; }',
            '        if (visible) { score += 1; }',
            '        if (!iconic) { score += 1; }',
            '        if (!owned) { score += 1; }',
            '      }',
            '      if (score > bestScore) { bestScore = score; windowPick = hwnd; }',
            '      bool interesting = wpid == pid || cura || hint;',
            '      if (interesting) {',
            '        MpfRect frame;',
            '        bool framed = FrameRect(hwnd, out frame);',
            '        rows.Append(string.Format("hwnd=0x{0:X} pid={1} class={2} visible={3} minimised={4} owned={5} rect={6} dwmframe={7} score={8} title=[{9}]", hwnd.ToInt64(), wpid, cls, visible, iconic, owned, RectText(hwnd), framed ? string.Format("{0},{1} {2}x{3}", frame.Left, frame.Top, frame.Right - frame.Left, frame.Bottom - frame.Top) : "-", score, title));',
            '        rows.Append("\n");',
            '      }',
            '      return true;',
            '    }, IntPtr.Zero);',
            '    if (windowPick == IntPtr.Zero) {',
            '      rows.Append("chosen=none (no titled top-level window matched this pid or title)\n");',
            '    } else {',
            '      MpfRect frame;',
            '      bool framed = FrameRect(windowPick, out frame);',
            '      rows.Append(string.Format("chosen=0x{0:X} pid={1} class={2} rect={3} dwmframe={4} title=[{5}]", windowPick.ToInt64(), WindowPid(windowPick), WindowClass(windowPick), RectText(windowPick), framed ? string.Format("{0},{1} {2}x{3}", frame.Left, frame.Top, frame.Right - frame.Left, frame.Bottom - frame.Top) : "-", WindowTitle(windowPick)));',
            '    }',
            '    return rows.ToString();',
            '  }',
            '}'
          ) -join "`n"
          $nativeOk = $false
          try {
            Add-Type -TypeDefinition $csSrc -ErrorAction Stop
            $nativeOk = $true
          } catch {
            W "the native helper could not be compiled on this image ($($_.Exception.Message)) - no window rectangle, no graceful recorder stop and no display change"
          }
          W ("native helper: compiled={0}" -f $nativeOk)

          $pathFile = Join-Path $EVIDENCE 'binary-path.txt'
          $binary = if (Test-Path $pathFile) { Get-Content $pathFile -First 1 } else { $null }
          if (-not $binary -or -not (Test-Path $binary)) {
            $binary = Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA) `
                -Filter 'UltiMaker-Cura.exe' -Recurse -Depth 4 -File -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $binary) {
            W "Cura is not installed - launch not attempted (see the install step)"
            V "SPIKE-Q1: launch=NOT-ATTEMPTED (no install)"
            exit 0
          }
          # The recorder is ffmpeg on every platform, matching
          # tests/harness/runner.py:247-250 exactly - same flags, same
          # framerate, same scenario.mp4 naming, started with the app and
          # stopped with a signal at teardown, never a kill: an unindexed
          # mp4 is what a kill leaves, and the artifacts stay comparable
          # with the Linux runs. Only the INPUT DEVICE differs: x11grab on
          # Linux, gdigrab here, avfoundation on macOS. It starts BEFORE
          # the launch so the recording spans launch and first paint.
          $video = Join-Path $EVIDENCE 'scenario.mp4'
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) {
            W "ffmpeg absent - attempting choco install (the runner ships none)"
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              & choco install ffmpeg -y --no-progress 2>&1 |
                Select-Object -Last 8 | ForEach-Object { W $_ }
              W "choco exit: $LASTEXITCODE"
              $env:Path = "$([System.Environment]::GetEnvironmentVariable('Path','Machine'));$([System.Environment]::GetEnvironmentVariable('Path','User'))"
            } else {
              W "choco absent too - this image has no encoder path"
            }
            $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($ff) {
              # recorded here too, so the audit table can never
              # under-report who provisioned what
              $au = Join-Path $EVIDENCE 'dependency-audit.tsv'
              if (-not (Test-Path $au)) {
                Add-Content -Path $au -Value "platform`tcomponent`trole`tstatus`tversion`tnotes"
              }
              Add-Content -Path $au -Value ("Windows/$env:RUNNER_ARCH`tffmpeg`tthe video recorder (runner.py:247-250)`tINSTALLED BY US`t$((& $ff.Source --version 2>&1 | Select-Object -First 1))`tinstalled by the launch step: the audit step did not provision it")
            }
          }
          # --- starting a long-lived capture ---------------------------------
          # Start-BgCapture is how THIS leg starts a background process that
          # has to SEE the desktop. Run 35932140235 came back with no
          # scenario.mp4 at all, and its recorder.log says why in ffmpeg's own
          # words: "Error opening output spike-evidence\scenario.mp4: No such
          # file or directory", exit code -2 - the recorder started and never
          # got as far as grabbing a frame. The cause was the working
          # directory, not the desktop and not the argv. WorkingDirectory here
          # becomes CreateProcess's lpCurrentDirectory, and a RELATIVE one is
          # resolved against the CALLING process's directory, not the child's:
          # the call passed $EVIDENCE ('spike-evidence', relative to the
          # workspace), so the recorder's directory became
          # <workspace>\spike-evidence and the relative output path in the argv
          # - the very string the foreground probes use - was resolved a second
          # time from there, to
          # <workspace>\spike-evidence\spike-evidence\scenario.mp4, which does
          # not exist. The foreground probes are untouched by this because they
          # run in this step's own directory. The recorder is therefore given
          # that same directory as an ABSOLUTE path taken from this process:
          # same argv, same flags, same relative output name as the 179,381-byte
          # foreground probes, one directory.
          # UseShellExecute = $false is CreateProcess called by THIS process,
          # so the child gets this process's own token, session, window station
          # and desktop: the very ones the foreground gdigrab probes and the
          # still capture above see. CreateNoWindow keeps a console out of the
          # picture (a capture tool needs none) and says nothing about the
          # desktop. Both streams are redirected because that is where
          # ffmpeg's reason for an empty capture goes; .NET redirection is an
          # anonymous pipe, so both are drained by reads started here and
          # collected at teardown, and a pipe filling up can never block the
          # encoder mid-recording.
          function Start-BgCapture($exe, [string[]]$argList, $cwd) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = ($argList -join ' ')
            $psi.WorkingDirectory = $cwd
            # Logged and checked here rather than at the call sites: this is
            # the value CreateProcess resolves, and a relative one is how the
            # missing scenario.mp4 happened. Equal directories mean the child
            # resolves the argv's relative output path exactly as the
            # foreground probes do.
            W ("background child: {0}, working directory '{1}' (this step: '{2}')" -f $exe, $cwd, $stepCwd)
            if ($cwd -ne $stepCwd) {
              W "NOTE: this child does not run in this step's own directory, so a relative output path in its argv does not resolve to the file a foreground command would write"
            }
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            $null = $proc.Start()
            $outTask = $null
            $errTask = $null
            try {
              $outTask = $proc.StandardOutput.ReadToEndAsync()
              $errTask = $proc.StandardError.ReadToEndAsync()
            } catch {
              # the capture runs regardless: losing its diagnostics must not
              # cost the recording
            }
            [pscustomobject]@{ Process = $proc; OutTask = $outTask; ErrTask = $errTask }
          }

          # Bounded collection: a task that never completes means a stream that
          # never closed, which is itself a finding rather than a hang.
          function Get-CaptureText($task) {
            if (-not $task) { return '(no stream was redirected for this process)' }
            try {
              if (-not $task.Wait(10000)) { return '(the redirected stream did not close within 10 s)' }
              if ($task.IsFaulted) { return ('(the redirected stream broke: ' + $task.Exception.GetBaseException().Message + ')') }
              return [string]$task.Result
            } catch {
              return ('(the redirected stream could not be collected: ' + $_.Exception.Message + ')')
            }
          }

          function Save-CaptureText($capPath, $capText) {
            if (-not $capPath) { return }
            try { [System.IO.File]::WriteAllText($capPath, [string]$capText) } catch { }
          }

          $rec = $null
          $recOutTask = $null
          $recErrTask = $null
          $recSess = $null
          $mySess = $null
          $recExitedEarly = $false
          $recGoneLogged = $false
          $recWasForced = $false
          # Collected after teardown and reused by the video verdict, which
          # quotes ffmpeg's own first line when no container was written: the
          # recorder's words are the diagnosis, so they travel with the verdict.
          $recErrText = ''
          $recOutText = ''
          # The recorder starts below, before the launch, and captures the
          # whole display - so nothing about the window has to be known first
          # and the recording spans the boot as well as the session. The
          # window rectangle is measured after the boot; it verifies the app
          # is on screen, it does not bound the capture.

          # --- GL: hand Cura a renderer that exists on this runner --------
          # WHY THE FIRST RUN ENDED IN A MODAL "Failed to probe OpenGL"
          # (run 35929485153; read out of Qt 6.6's own sources - the Qt the
          # pinned Cura build embeds, 6.6.0.0 as that run's evidence reports
          # it, not guessed. Nothing below keys on a Cura version: every
          # check reads Qt's own log lines and the module paths the running
          # process actually loaded, so the same code covers the whole
          # 5.7-and-up range this project supports):
          #   * Cura's UM.Qt.QtApplication sets AA_UseDesktopOpenGL before any
          #     window exists;
          #   * QWindowsOpenGLTester::requestedRenderer() tests that attribute
          #     BEFORE it looks at QT_OPENGL, so the QT_OPENGL=software this
          #     step used to set was inert: the desktop path always ran;
          #   * the desktop path loads opengl32 through QSystemLibrary, which
          #     is LoadLibraryEx with LOAD_LIBRARY_SEARCH_SYSTEM32 - System32
          #     only - so the opengl32sw.dll that IS in the bundle was never
          #     asked to load, and no DLL placed beside the executable could
          #     have been seen either;
          #   * System32's opengl32.dll on this GPU-less runner is Microsoft's
          #     GDI generic OpenGL 1.1, so Cura's context attempts (4.1 core,
          #     then 2.0) both fail and the dialog is the whole UI - which is
          #     also why no cura.log existed: the probe dies before Cura's own
          #     loggers start.
          # THE REQUIRED LEVER, and what the runs say about it: QT_OPENGL_DLL.
          # Qt 6.6 qwindowsglcontext.cpp reads it and then skips both the
          # software/desktop choice and the system-directory search:
          #     openglDll = qgetenv("QT_OPENGL_DLL"); if empty -> sw/opengl32
          #     useSystemLib = !softwareRendering   (false when the var is set)
          #     m_lib = useSystemLib ? QSystemLibrary::load(..) : LoadLibraryA(..)
          # An absolute path there loads exactly that library, with Cura left
          # untouched - the Windows side of ui_test.sh's
          # LIBGL_ALWAYS_SOFTWARE=1 against the Mesa the container image has.
          # It is set below and read back from a launched child, because the
          # run of 35932140235 shows the variable alone is not enough: this
          # step had set it to an absolute Mesa path and Qt still logged
          # 'Qt: Using WGL and OpenGL from "opengl32"' - a bare name, which
          # only happens when the variable was EMPTY in that process. The
          # reason is in Cura's own cura_app.py, which on every non-Linux
          # platform runs os.environ["QT_OPENGL_DLL"] = "" before PyQt6 is
          # imported (upstream Ultimaker/Cura 5.13.0; the security workaround
          # that also blanks the plugin and QML search paths). Cura therefore
          # deletes the variable before Qt can read it, whatever the launcher
          # does, so the deployment below does not stop at it either.
          # DIAGNOSE FIRST, and cheap: qt.qpa.gl makes Qt print the library it
          # chose ("Qt: Using WGL and OpenGL from ...") and why one was refused
          # ("Failed to load ...", with the Win32 error), and
          # QT_FORCE_STDERR_LOGGING puts those lines in the stderr file this
          # step already redirects - Qt on Windows otherwise sends debug output
          # to the debugger and a redirected file stays empty.
          # Set on this process, and inherited by every process this step
          # launches: Start-Process has no -Environment before PowerShell 7, so
          # this process's own environment block IS the mechanism - and the
          # child probe further down reads it back from a launched process
          # rather than trusting this one's copy.
          $glVars = [ordered]@{
            'QT_OPENGL'               = 'software'
            'QSG_RHI_BACKEND'         = 'software'
            'QT_QUICK_BACKEND'        = 'software'
            'QT_LOGGING_RULES'        = 'qt.qpa.gl=true'
            'QT_FORCE_STDERR_LOGGING' = '1'
            'GALLIUM_DRIVER'          = 'llvmpipe'
            'LIBGL_ALWAYS_SOFTWARE'   = '1'
          }
          # One setter, so a value chosen later (QT_OPENGL_DLL, below) is
          # printed in the same shape as the rest and cannot be set without
          # being reported next to them.
          function Set-GlVar($name, $value) {
            Set-Item -Path ("env:" + $name) -Value $value
            $glVars[$name] = $value
            W ("GL env: {0}={1}" -f $name, $value)
          }
          # The keys are copied out first: Set-GlVar writes back into the same
          # table, and enumerating a collection that is being modified throws.
          foreach ($k in @($glVars.Keys)) { Set-GlVar $k $glVars[$k] }
          W "FINDING: QT_OPENGL=software cannot take effect while Cura sets AA_UseDesktopOpenGL, and the desktop path only ever looks in System32; QT_OPENGL_DLL is the variable meant to name a library directly, and whether it survives into Cura's own process is what the read-back and the deployment below measure"
          # The probe dialog's own words. A window carrying any of them is the
          # block, not the application, wherever it is found.
          $markers = @('probe OpenGL', 'Could not probe', 'OpenGL 2.0', 'video card drivers')
          function Test-ProbeTitle($t) {
            foreach ($m in $markers) { if ($t -like ("*" + $m + "*")) { return $true } }
            return $false
          }
          # One rectangle reader for every call site: the DWM frame bounds
          # when the compositor has them (that is the rectangle actually
          # drawn), GetWindowRect for a window that is not composited, and
          # $null when neither answers. The source is returned with the
          # rectangle so a reading can be traced to the call that produced it.
          function Get-WindowRect([IntPtr]$handle) {
            $r = New-Object MpfRect
            if ($null -eq $r) { return $null }
            if ([SpikeNative]::FrameRect($handle, [ref]$r) -and
                (($r.Right - $r.Left) -gt 0) -and (($r.Bottom - $r.Top) -gt 0)) {
              return @{ X = $r.Left; Y = $r.Top; W = $r.Right - $r.Left; H = $r.Bottom - $r.Top; Source = 'DwmGetWindowAttribute(DWMWA_EXTENDED_FRAME_BOUNDS)' }
            }
            if ([SpikeNative]::GetWindowRect($handle, [ref]$r)) {
              return @{ X = $r.Left; Y = $r.Top; W = $r.Right - $r.Left; H = $r.Bottom - $r.Top; Source = 'GetWindowRect' }
            }
            return $null
          }
          function Audit-Row($component, $role, $status, $version, $notes) {
            # The audit table is owned by the audit step; this step adds rows
            # for what it provisions itself, as the ffmpeg fallback above does,
            # so the table can never under-report who installed what.
            $auPath = Join-Path $EVIDENCE 'dependency-audit.tsv'
            if (-not (Test-Path $auPath)) {
              Add-Content -Path $auPath -Value "platform`tcomponent`trole`tstatus`tversion`tnotes"
            }
            Add-Content -Path $auPath -Value ("Windows/$env:RUNNER_ARCH`t$component`t$role`t$status`t$version`t$notes")
            W "[audit] $component | $status | $version | $notes"
          }

          # --- provisioning: Mesa llvmpipe, pinned, the way Linux has it ----
          # No third-party library is assumed to be present: this leg installs
          # the software rasteriser it needs, at a pinned version and with the
          # digest verified before anything uses it, and says in the audit table
          # exactly what it installed, from where, and whether it loaded.
          $curaDir = Split-Path -Parent $binary
          $MESA_VER = '26.1.8'
          $MESA_ASSET = "mesa3d-$MESA_VER-release-msvc.7z"
          $MESA_SHA256 = '4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9'
          $MESA_URL = "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VER/$MESA_ASSET"
          $mesaRoot = Join-Path $env:RUNNER_TEMP ("mesa-llvmpipe-" + $MESA_VER)
          $mesaDir = Join-Path $mesaRoot 'x64'
          $mesaArchive = Join-Path $mesaRoot $MESA_ASSET
          # opengl32.dll is only a loader since Mesa 21.3; libgallium_wgl.dll
          # beside it is the rasteriser; dxil.dll is the DirectX IL
          # redistributable the D3D12 driver needs to load at all, carried so a
          # missing redistributable cannot be what a failed run blames.
          $MESA_FILES = @('opengl32.dll', 'libgallium_wgl.dll', 'dxil.dll')
          New-Item -ItemType Directory -Force $mesaRoot | Out-Null
          W "Mesa: $MESA_VER ($MESA_ASSET), sha256 pinned to $MESA_SHA256"
          W "Mesa download: $MESA_URL"
          try {
            & curl.exe -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$mesaArchive" "$MESA_URL" 2>&1 |
              Select-Object -Last 4 | ForEach-Object { W $_ }
            W "curl.exe exit: $LASTEXITCODE"
          } catch {
            W "curl.exe threw: $($_.Exception.Message)"
          }
          $mesaHash = ''
          if (Test-Path $mesaArchive) {
            $mesaHash = (Get-FileHash -Path $mesaArchive -Algorithm SHA256).Hash.ToLower()
            W ("Mesa archive on disk: {0:N0} bytes, sha256 {1}" -f (Get-Item $mesaArchive).Length, $mesaHash)
          } else {
            W "Mesa archive absent - the download did not produce a file"
          }
          $mesaOk = $false
          $extractTool = 'none'
          if ($mesaHash -eq $MESA_SHA256) {
            # The image's own extractor, probed rather than assumed: 7-Zip
            # first, then the libarchive tar.exe this image ships (it reads
            # 7z), and the archive is only unpacked once.
            $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if (-not $sevenZip) {
              $sevenZipPath = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
              if (Test-Path $sevenZipPath) { $sevenZip = Get-Item $sevenZipPath }
            }
            if ($sevenZip) {
              $extractTool = $sevenZip.Source
              W "extractor: $extractTool (7z)"
              & $sevenZip.Source x -y ("-o" + $mesaRoot) "$mesaArchive" 'x64/opengl32.dll' 'x64/libgallium_wgl.dll' 'x64/dxil.dll' 2>&1 |
                Select-Object -Last 6 | ForEach-Object { W $_ }
              W "7z exit: $LASTEXITCODE"
            }
            $need = @('opengl32.dll', 'libgallium_wgl.dll')
            $missing = @($need | Where-Object { -not (Test-Path (Join-Path $mesaDir $_)) })
            if ($missing.Count -gt 0) {
              # A filtered extraction that produced nothing is worth one retry
              # without the filter, rather than a run lost to a naming rule.
              $tarExe = Get-Command tar.exe -ErrorAction SilentlyContinue
              if ($tarExe) {
                $extractTool = $tarExe.Source
                W "the filtered extraction left $($missing -join ', ') missing - retrying with tar.exe (libarchive reads 7z)"
                & $tarExe.Source -xf "$mesaArchive" -C "$mesaRoot" 'x64/opengl32.dll' 'x64/libgallium_wgl.dll' 'x64/dxil.dll' 2>&1 |
                  Select-Object -Last 6 | ForEach-Object { W $_ }
                W "tar.exe exit: $LASTEXITCODE"
              }
              $missing = @($need | Where-Object { -not (Test-Path (Join-Path $mesaDir $_)) })
            }
            foreach ($f in $MESA_FILES) {
              $p = Join-Path $mesaDir $f
              if (Test-Path $p) { W ("Mesa file: {0} ({1:N0} bytes)" -f $p, (Get-Item $p).Length) }
              else { W "Mesa file: $p MISSING" }
            }
            if ($missing.Count -eq 0) { $mesaOk = $true }
          } elseif ($mesaHash) {
            W "Mesa archive hash does not match the pin - refusing to unpack it"
          }
          if ($mesaOk) {
            # PATH, because Mesa's loader resolves libgallium_wgl.dll by bare
            # name, and the search order reaches PATH after the executable's own
            # directory, which the copy below also covers.
            $env:Path = "$mesaDir;$env:Path"
            W "Mesa staged: $mesaDir, and that directory is on PATH so the bare-name megadriver load finds it"
            # Beside the executable as well: Mesa's documented per-app
            # deployment, so the drop-in works even for a bare-name load.
            foreach ($f in $MESA_FILES) {
              $src = Join-Path $mesaDir $f
              if (-not (Test-Path $src)) { continue }
              try {
                Copy-Item -Path $src -Destination (Join-Path $curaDir $f) -Force -ErrorAction Stop
                W "placed beside the executable: $(Join-Path $curaDir $f)"
              } catch {
                W "could not place $f beside the executable ($($_.Exception.Message)); PATH still reaches it, and the System32 deployment below is what the desktop path loads"
              }
            }
            Audit-Row 'Mesa3D llvmpipe (Windows)' 'the software OpenGL Cura needs, the Windows side of LIBGL_ALWAYS_SOFTWARE=1' 'INSTALLED BY US' "llvmpipe in Mesa $MESA_VER (msvc x64)" "curl $MESA_URL; sha256 verified $MESA_SHA256; extracted with $extractTool to $mesaDir; GALLIUM_DRIVER=llvmpipe; placed on PATH and beside Cura's executable; the deployment that reaches Cura is reported below"
          } else {
            Audit-Row 'Mesa3D llvmpipe (Windows)' 'the software OpenGL Cura needs, the Windows side of LIBGL_ALWAYS_SOFTWARE=1' 'ABSENT' "wanted $MESA_VER (msvc x64)" "download/extract failed: curl exit above, archive hash '$mesaHash', extractor $extractTool; the bundled Qt rasteriser is used instead (see the candidates below)"
          }
          # The candidates, in order: the Mesa just provisioned, then the
          # software rasteriser Cura's own Qt ships. Each is load-tested before
          # anything is launched, so a library the OS refuses is reported here
          # and not as a mystery window later.
          $swGl = Get-ChildItem -Path $curaDir -Filter 'opengl32sw.dll' -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($swGl) { W "software GL present: $swGl" }
          else { W "software GL absent: no opengl32sw.dll under $curaDir" }
          $glCandidates = @()
          if ($mesaOk) { $glCandidates += (Join-Path $mesaDir 'opengl32.dll') }
          if ($swGl) { $glCandidates += $swGl }
          # The load test is a plain LoadLibrary: it resolves the imports of
          # the candidate, so a missing companion DLL or runtime is named here
          # rather than guessed at later.
          $loadProbe = $false
          $csSrc = @(
            'using System;',
            'using System.Runtime.InteropServices;',
            'public static class MpfNativeLoad {',
            '  [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]',
            '  public static extern IntPtr LoadLibraryW(string path);',
            '  [DllImport("kernel32.dll", SetLastError = true)]',
            '  public static extern bool FreeLibrary(IntPtr module);',
            '}'
          ) -join "`n"
          try {
            Add-Type -TypeDefinition $csSrc -ErrorAction Stop
            $loadProbe = $true
          } catch {
            W "the load test could not be compiled on this image ($($_.Exception.Message)); candidates are reported by size and version only"
          }
          $glLib = $null
          $glWhy = 'no candidate was available'
          foreach ($cand in $glCandidates) {
            $res = 'not load-tested'
            $h = [IntPtr]::Zero
            if ($loadProbe) {
              try {
                $h = [MpfNativeLoad]::LoadLibraryW($cand)
                if ($h -ne [IntPtr]::Zero) {
                  $res = 'loads'
                  $null = [MpfNativeLoad]::FreeLibrary($h)
                } else {
                  $res = ('REFUSED by the OS, Win32 error ' + [System.Runtime.InteropServices.Marshal]::GetLastWin32Error())
                }
              } catch {
                $res = ('load test failed: ' + $_.Exception.Message)
              }
            }
            $candVer = ''
            try { $candVer = "$((Get-Item $cand).VersionInfo.FileVersion)" } catch { }
            W ("GL candidate: {0} ({1:N0} bytes{2}) - {3}" -f $cand, (Get-Item $cand).Length,
               $(if ($candVer) { ', v' + $candVer } else { '' }), $res)
            if ((-not $glLib) -and ($res -eq 'loads')) {
              $glLib = $cand
              $glWhy = 'the first candidate the OS would load'
            }
          }
          if ((-not $glLib) -and ($glCandidates.Count -gt 0)) {
            $glLib = $glCandidates[0]
            $glWhy = 'no candidate could be load-tested, so this one is handed over untested'
          }
          if ($glLib) {
            Set-GlVar 'QT_OPENGL_DLL' $glLib
            W ("GL choice: QT_OPENGL_DLL={0} ({1})" -f $glLib, $glWhy)
            W "  this is the variable that makes Qt load exactly this file and skip the System32-only search; Cura's own cura_app.py empties it on non-Linux before PyQt6 is imported, so what this buys is a read-back that the environment is inherited - the library Qt actually loads is verified below, by Qt's own line and by the System32 deployment"
          } else {
            W "GL choice: none - QT_OPENGL_DLL stays unset and Cura gets the system OpenGL this runner has already failed to probe"
          }

          # --- read-back: the variables in a LAUNCHED CHILD's environment ----
          # The claim this step makes is about the environments of the
          # processes it launches, not about its own copy of one, so it is read
          # out of a process that was actually launched. cmd /c set prints the
          # whole environment block of that child and the GL entries are
          # quoted from the file it wrote; a variable that is set here and
          # absent there would be the finding for this leg.
          $envProbe = Join-Path $EVIDENCE 'gl-env-child.txt'
          if (-not [System.IO.Path]::IsPathRooted($envProbe)) { $envProbe = Join-Path $stepCwd $envProbe }
          Remove-Item -LiteralPath $envProbe -Force -ErrorAction SilentlyContinue
          try {
            $null = Start-Process -FilePath $env:ComSpec -ArgumentList '/c', 'set' -Wait -NoNewWindow `
                      -RedirectStandardOutput $envProbe
          } catch {
            W "GL env read-back: the child probe could not be started ($($_.Exception.Message))"
          }
          if (Test-Path $envProbe) {
            $childEnv = @(Get-Content -LiteralPath $envProbe | Where-Object {
              $_ -match '^(QT_OPENGL_DLL|QT_OPENGL|QSG_RHI_BACKEND|QT_QUICK_BACKEND|QT_LOGGING_RULES|QT_FORCE_STDERR_LOGGING|GALLIUM_DRIVER|LIBGL_ALWAYS_SOFTWARE)=' })
            W ("GL env read-back (cmd /c set inside a process this step launched): {0} of the names above are present in the child" -f $childEnv.Count)
            foreach ($l in $childEnv) { W ("  child env: " + $l.Trim()) }
            $childHasDll = @($childEnv | Where-Object { $_ -like 'QT_OPENGL_DLL=*' }).Count -gt 0
            if ($childHasDll) {
              W "  child env: QT_OPENGL_DLL reached the launched child, so this step's environment IS inherited; what happens to it inside Cura is Cura's own doing (cura_app.py empties it before PyQt6 is imported)"
            } elseif ($glLib) {
              W "  child env: QT_OPENGL_DLL is ABSENT from the launched child although this step set it - the variable is not reaching launched processes, which is the fault this read-back exists to catch"
            } else {
              W "  child env: QT_OPENGL_DLL is absent because this step set none (no candidate library was chosen above), not because inheritance failed"
            }
          } else {
            W "GL env read-back: the child probe wrote no file, so no launched child's environment could be read"
          }

          # --- the deployment that reaches Cura ------------------------------
          # QT_OPENGL_DLL is delivered (read-back above) and then deleted BY
          # CURA before Qt reads it, so the renderer has to arrive as the file
          # the desktop path loads anyway. That path is a System32-only search
          # (proven above, by the run itself: the provisioned Mesa sitting
          # beside Cura's executable was not the opengl32.DLL that got loaded -
          # System32's was), and Cura's UM.Qt.QtApplication sets
          # AA_UseDesktopOpenGL before any window exists, so every other lever
          # in Qt is out of reach: QT_OPENGL is never consulted, and so is the
          # windows platform option that would otherwise force the software
          # rasteriser. What remains is C:\Windows\System32\opengl32.dll,
          # which IS the OpenGL implementation on this image - Microsoft's GDI
          # generic 1.1, the exact thing that failed to probe. Mesa's own
          # system-wide deployment is therefore what this does, and the
          # result is read back by hash rather than assumed: same own/ACL work
          # as any system file, then the length and digest of the file that is
          # on disk afterwards.
          $sysGl = Join-Path $env:SystemRoot 'System32\opengl32.dll'
          $mesaGl = Join-Path $mesaDir 'opengl32.dll'
          $sysGlDeployed = $false
          $sysGlWhy = 'not attempted'
          if ($mesaOk -and (Test-Path $mesaGl) -and (Test-Path $sysGl)) {
            $origSz = (Get-Item $sysGl).Length
            $origVer = ''
            try { $origVer = "$((Get-Item $sysGl).VersionInfo.FileVersion)" } catch { }
            W ("system OpenGL before: {0} ({1:N0} bytes, v{2})" -f $sysGl, $origSz, $origVer)
            $mesaGlHash = (Get-FileHash -Path $mesaGl -Algorithm SHA256).Hash.ToLower()
            $nowHash = ''
            try {
              # System32's files are owned by TrustedInstaller and written by
              # nothing else, so ownership and a write grant come first; both
              # exits are reported, because a refusal here is the whole answer
              # for this run rather than a detail.
              & takeown.exe /f "$sysGl" 2>&1 | Select-Object -Last 2 | ForEach-Object { W $_ }
              W "takeown exit: $LASTEXITCODE"
              & icacls.exe "$sysGl" /grant '*S-1-5-32-544:F' 2>&1 | Select-Object -Last 2 | ForEach-Object { W $_ }
              W "icacls exit: $LASTEXITCODE"
              # The library itself first, because it is what decides the
              # renderer; the companions after it, because they are optional:
              # Mesa's loader resolves libgallium_wgl.dll by bare name and
              # finds it beside Cura's executable and on this process's PATH
              # as well, so only the failure of the library is fatal here.
              Copy-Item -Path $mesaGl -Destination $sysGl -Force -ErrorAction Stop
              W "placed system-wide: $sysGl"
              foreach ($f in @('libgallium_wgl.dll', 'dxil.dll')) {
                $src = Join-Path $mesaDir $f
                if (-not (Test-Path $src)) { continue }
                try {
                  Copy-Item -Path $src -Destination (Join-Path $env:SystemRoot ('System32\' + $f)) -Force -ErrorAction Stop
                  W "placed system-wide: $env:SystemRoot\System32\$f"
                } catch {
                  W "could not place System32\$f ($($_.Exception.Message)) - Mesa finds it beside Cura's executable or on PATH instead"
                }
              }
              $nowHash = (Get-FileHash -Path $sysGl -Algorithm SHA256).Hash.ToLower()
              if ($nowHash -eq $mesaGlHash) {
                $sysGlDeployed = $true
                $sysGlWhy = "sha256 matches the provisioned Mesa $MESA_VER"
              } else {
                $sysGlWhy = "the file on disk is not Mesa (sha256 $nowHash)"
              }
            } catch {
              $sysGlWhy = "the replacement was refused: $($_.Exception.Message)"
            }
            if (Test-Path $sysGl) {
              W ("system OpenGL after: {0:N0} bytes, sha256 {1} - {2}" -f (Get-Item $sysGl).Length, $nowHash, $sysGlWhy)
            }
          } else {
            $sysGlWhy = 'Mesa or the system library is missing, so nothing was replaced'
            W "system OpenGL: $sysGlWhy"
          }
          if ($sysGlDeployed) {
            W "the renderer Cura's desktop path will load is Mesa llvmpipe: $sysGl ($sysGlWhy)"
            Audit-Row 'OpenGL library handed to Cura' 'the GL implementation the Windows desktop path actually loads' 'INSTALLED BY US' "Mesa $MESA_VER llvmpipe as System32\opengl32.dll" "QT_OPENGL_DLL is emptied by Cura's own cura_app.py before Qt reads it, and AA_UseDesktopOpenGL makes the System32-only desktop path the only one, so Mesa is deployed there; $sysGlWhy"
          } else {
            Audit-Row 'OpenGL library handed to Cura' 'the GL implementation the Windows desktop path actually loads' 'ABSENT' "Mesa $MESA_VER llvmpipe wanted as System32\opengl32.dll" "QT_OPENGL_DLL cannot be used (Cura's cura_app.py empties it on non-Linux and AA_UseDesktopOpenGL makes the System32-only desktop path the only one) and the System32 deployment did not take: $sysGlWhy"
          }

          W "=== display geometry (the harness pins one screen size) ==="
          # The harness resolves ONE screen size (HARNESS_GEOMETRY, 1920x1080
          # by default) and pins the window INSIDE it (HARNESS_WINDOW,
          # 1840x1040) - deliberately smaller, so the screen-fits assertion
          # has something to defend. The capture is the whole display, so a
          # runner whose display is smaller than the pinned geometry breaks
          # two things at once: the pinned window cannot fit the screen at
          # all, and the recording comes out at the runner's size rather than
          # the Linux leg's, which is also why the recordings looked low
          # resolution. So the display is read, moved, and read again - the
          # values are logged because neither is known in advance (run
          # 35934260021 was 1024x768 on BOTH runners).
          $wantGeo = "$env:HARNESS_GEOMETRY"
          if (-not $wantGeo) { $wantGeo = '1920x1080' }
          $wantW = 0
          $wantH = 0
          if ($wantGeo -match '^([0-9]+)x([0-9]+)$') { $wantW = [int]$Matches[1]; $wantH = [int]$Matches[2] }
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $vsNow = [System.Windows.Forms.SystemInformation]::VirtualScreen
          W ("display before: primary {0}x{1} at {2},{3}; virtual screen {4}x{5} at {6},{7}" -f `
              $scr.Width, $scr.Height, $scr.X, $scr.Y, $vsNow.Width, $vsNow.Height, $vsNow.X, $vsNow.Y)
          W "the harness geometry this run is pinned to: $wantGeo"
          $displayWhy = 'not attempted'
          if ($wantW -le 0) {
            $displayWhy = "the pinned geometry '$wantGeo' is not WxH"
          } elseif (($scr.Width -eq $wantW) -and ($scr.Height -eq $wantH)) {
            $displayWhy = 'already at the pinned geometry'
          } elseif (-not $nativeOk) {
            $displayWhy = 'the native helper did not compile, so no mode can be set'
          } else {
            $dmNow = New-Object MpfDevMode
            if (-not $dmNow) {
              # A type that does not resolve leaves $null here, and every call
              # built on it then fails non-terminating under this step's
              # Continue preference - which is how an empty DEVMODE size got
              # reported as a marshalling bug once already.
              $displayWhy = 'the DEVMODE type did not resolve in PowerShell (New-Object MpfDevMode gave nothing)'
            } else {
              $dmLayout = [SpikeNative]::DevModeLayout()
              W ("DEVMODE type {0} marshals as {1}" -f $dmNow.GetType().FullName, $dmLayout)
              if (-not [SpikeNative]::DevModeOk()) {
                # Windows defines DEVMODE as 220 bytes; a struct that
                # marshals to any other size would hand the display API a
                # buffer it does not own, so the call is not made at all.
                $displayWhy = ("the DEVMODE this helper marshals is not the Windows layout: {0}" -f $dmLayout)
              } else {
                $found = $null
                $modes = 0
                $i = 0
                while ($i -lt 4096) {
                  $cand = New-Object MpfDevMode
                  if (-not [SpikeNative]::EnumDisplaySettings($null, $i, [ref]$cand)) { break }
                  $modes++
                  if (($cand.dmPelsWidth -eq $wantW) -and ($cand.dmPelsHeight -eq $wantH) -and ($cand.dmBitsPerPel -ge 32)) {
                    $found = $cand
                    break
                  }
                  $i++
                }
                W ("display modes this adapter reports: {0} (looking for {1}x{2} at 32 bpp)" -f $modes, $wantW, $wantH)
                if (-not $found) {
                  $displayWhy = ("no {0}x{1} mode in this adapter's list" -f $wantW, $wantH)
                } else {
                  # DM_BITSPERPEL | DM_PELSWIDTH | DM_PELSHEIGHT | DM_DISPLAYFREQUENCY
                  $found.dmFields = 0x00040000 -bor 0x00080000 -bor 0x00100000 -bor 0x00400000
                  $rc = [SpikeNative]::ChangeDisplaySettings([ref]$found, 0)
                  W ("ChangeDisplaySettings({0}x{1}, dynamic) returned {2} (0 = DISP_CHANGE_SUCCESSFUL)" -f $wantW, $wantH, $rc)
                  if ($rc -eq 0) {
                    $displayWhy = ("moved from {0}x{1} by ChangeDisplaySettings" -f $scr.Width, $scr.Height)
                    Start-Sleep -Seconds 3
                  } else {
                    $displayWhy = ("ChangeDisplaySettings returned {0}" -f $rc)
                  }
                }
              }
            }
          }
          $scr2 = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $vs2 = [System.Windows.Forms.SystemInformation]::VirtualScreen
          # The read-back the setting has to answer to comes from the same API
          # that was asked to change it, so a WinForms value that is stale or
          # scaled cannot be mistaken for the mode the recorder will capture.
          $apiMode = 'unreadable'
          $dmBack = New-Object MpfDevMode
          if ($nativeOk -and $dmBack) {
            if ([SpikeNative]::EnumDisplaySettings($null, -1, [ref]$dmBack)) {
              $apiMode = [SpikeNative]::DevModeText($dmBack)
            }
          }
          W ("display after: primary {0}x{1}; virtual screen {2}x{3}; EnumDisplaySettings says {4} ({5})" -f `
              $scr2.Width, $scr2.Height, $vs2.Width, $vs2.Height, $apiMode, $displayWhy)
          if (($scr2.Width -eq $wantW) -and ($scr2.Height -eq $wantH)) {
            V ("SPIKE-Q2: display=OK ({0}x{1}, {2}; {3})" -f $scr2.Width, $scr2.Height, $displayWhy, $apiMode)
          } else {
            V ("SPIKE-Q2: display=MISMATCH (pinned {0}, this runner has {1}x{2}, {3}; {4})" -f `
                $wantGeo, $scr2.Width, $scr2.Height, $displayWhy, $apiMode)
            W "FINDING: this runner's display cannot be moved to the harness geometry, so its recording is not the size the Linux leg records and the pinned window cannot fit - reported here rather than recorded silently"
          }

          # THE RECORDER. The harness's recipe (runner.py:247-250: same flags,
          # -framerate 15, scenario.mp4), this platform's input device, and
          # the WHOLE DISPLAY as the region - started before the launch,
          # exactly where the Linux harness starts its own.
          #
          # Why not the window rectangle: part of the scenarios resize the
          # window (the screen-fits assertion exists to defend exactly that),
          # and no ffmpeg input device re-reads its region once running -
          # x11grab fixes it in the input spec, gdigrab bakes the clip
          # rectangle into its header (its window-title mode bakes the client
          # rectangle the same way, so that platform-specific route would not
          # follow a resize either), and avfoundation's crop filter is a
          # constant expression. A rectangle frozen at start clips the window
          # as it grows and pads it as it shrinks: a recording that
          # misrepresents the run plausibly. The display cannot be wrong, and
          # it is what the Linux leg captures - x11grab's -video_size SIZE of
          # a display whose only occupant is the app. The window rectangle is
          # measured below all the same, to verify the app is on screen rather
          # than to bound the capture.
          $capW = $scr2.Width
          $capH = $scr2.Height
          $captureArgs = @('-video_size', ("{0}x{1}" -f $capW, $capH))
          if (($scr2.Width -eq $wantW) -and ($scr2.Height -eq $wantH)) {
            W ("capture region: the whole display, {0}x{1} - the pinned geometry, so this recording is the size the Linux leg records" -f $capW, $capH)
          } else {
            W ("capture region: the whole display, {0}x{1} - the display could not be moved to the pinned {2}, so this recording is NOT that size (see the display lines above)" -f $capW, $capH, $wantGeo)
          }
          $recErr = Join-Path $EVIDENCE 'recorder.log'
          $recOut = Join-Path $EVIDENCE 'recorder-stdout.txt'
          if (-not $ff) {
            W "no recorder available - the video leg cannot run on this image"
          } else {
            W "recorder: ffmpeg $($ff.Source)"
            # Fragmented: the moov goes up front and each fragment stands
            # alone, so the recording survives being killed rather than
            # stopped. The previous round's plain mp4 came back with an mdat
            # and no moov - an unplayable file that no reader could open.
            $ffArgs = @('-y', '-loglevel', 'error', '-f', 'gdigrab') + $captureArgs +
                      @('-framerate', '15', '-i', 'desktop',
                        '-movflags', '+frag_keyframe+empty_moov+default_base_moof',
                        "`"$video`"")
            W "recorder argv: ffmpeg $($ffArgs -join ' ')"
            # The launch mechanism, recorded because the next run has to be
            # readable without re-deriving it: System.Diagnostics.Process with
            # UseShellExecute=FALSE and CreateNoWindow=TRUE - a CreateProcess
            # child of this step, so it shares the session, window station and
            # desktop the foreground probes capture through - started in this
            # step's OWN directory, which is the one difference the earlier
            # run's missing recording turned out to be. Both streams are
            # redirected, because that is where ffmpeg's reason for an empty
            # capture goes.
            W "recorder launch: System.Diagnostics.Process, UseShellExecute=FALSE, CreateNoWindow=TRUE - a CreateProcess child of this step, in working directory $stepCwd (the directory the foreground probes resolve the same relative output path against)"
            $videoAbs = $video
            if (-not [System.IO.Path]::IsPathRooted($videoAbs)) { $videoAbs = Join-Path $stepCwd $videoAbs }
            W "recorder output path: $videoAbs"
            if (-not (Test-Path (Split-Path -Parent $videoAbs))) {
              W "recorder output directory does not exist: $(Split-Path -Parent $videoAbs) - nothing can be written there"
            }
            try {
              $rec = Start-BgCapture $ff.Source $ffArgs $stepCwd
            } catch {
              W "recorder launch FAILED: $($_.Exception.Message)"
              $rec = $null
            }
            if ($rec) {
              $recOutTask = $rec.OutTask
              $recErrTask = $rec.ErrTask
              W "recorder pid: $($rec.Process.Id) (started before the launch, as the Linux harness starts its own)"
              W "recorder stderr: $recErr, stdout: $recOut (both uploaded with the evidence)"
              # The session is the thing the hypothesis is about, so it is
              # measured rather than assumed: equal session ids mean the
              # recorder sits where the desktop lives.
              $mySess = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
              $recSess = $rec.Process.SessionId
              W "recorder session: $recSess (this step runs in $mySess)"
              if ($recSess -ne $mySess) {
                W "SESSION MISMATCH: the recorder is in session $recSess and the step in $mySess - another session is a desktop the recorder cannot see, which is exactly what an empty scenario.mp4 looks like"
              }
              Start-Sleep -Seconds 3
              $rec.Process.Refresh()
              if ($rec.Process.HasExited) {
                $recExitedEarly = $true
                W ("recorder already exited after 3 s, code {0} - no capture is running" -f $rec.Process.ExitCode)
              } else {
                W "recorder alive after 3 s (a capture is running)"
              }
              if (Test-Path $video) { W ("scenario.mp4 after 3 s: {0} bytes" -f (Get-Item $video).Length) }
              else { W "scenario.mp4 not created after 3 s" }
            }
          }

          W "=== launching $binary ==="
          # Cura's own streams are captured, not left to a console of its own:
          # the probe warning is printed there as well as shown, and the first
          # run had nowhere to look for either.
          $curaOut = Join-Path $EVIDENCE 'cura-stdout.txt'
          $curaErr = Join-Path $EVIDENCE 'cura-stderr.txt'
          $p = Start-Process -FilePath $binary -PassThru `
                 -RedirectStandardOutput $curaOut -RedirectStandardError $curaErr
          W "pid: $($p.Id)"
          W "cura stdout/stderr: $curaOut / $curaErr"

          # Bounded wait, polled: an early crash is reported at once
          # rather than after the full window. Shorter than the recording,
          # so the capture covers the whole boot.
          $WAIT_SECS = 35
          $deadline = (Get-Date).AddSeconds($WAIT_SECS)
          $died = $false
          # Sampled so the verdict can name the fault instead of reporting the
          # same word for both: while the container stays at its header size,
          # no frame was ever muxed (the recorder had nothing to capture);
          # once it grows, frames were muxed whatever the index says later.
          # An empty mov is ftyp + free + an mdat of size 0, ~48 bytes, so
          # 1 KB is the header and nothing above it.
          $HEADER_MAX = 1024
          $recGrew = $false
          $recSamples = @()
          $realTitle = ''
          # The recorder is already running (started before this launch), so
          # these samples cover the boot as well as the session.
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $p.Refresh()
            if ($p.HasExited) { $died = $true; break }
            $t = "$($p.MainWindowTitle)"
            if ($t -and -not (Test-ProbeTitle $t)) { $realTitle = $t }
          }
          $BOOT_SECS = 90
          if ($died) {
            W "process exited early with code $($p.ExitCode)"
          } else {
            $p.Refresh()
            W "process alive after the wait: Responding=$($p.Responding)"
            W "MainWindowTitle='$($p.MainWindowTitle)'  <- non-empty means a real window"
            W "MainWindowHandle=$($p.MainWindowHandle)"
            # 35 s is a liveness wait, not a boot budget. The Linux harness
            # gives a boot 300 s for exactly this reason ("the CI runners are
            # 2-vCPU VMs and boot Cura far more slowly than a dev box"), and a
            # software rasteriser makes a first boot slower still. So the wait
            # above stays what it was, and this boot wait is what decides
            # whether a real window ever appeared: alive is not launched, and
            # this is the line that stops a windowless Cura counting as one.
            $bootDeadline = (Get-Date).AddSeconds($BOOT_SECS)
            $lastTitle = $null
            while ((Get-Date) -lt $bootDeadline) {
              $p.Refresh()
              if ($p.HasExited) {
                $died = $true
                W "process exited during the boot wait with code $($p.ExitCode)"
                break
              }
              $t = "$($p.MainWindowTitle)"
              if ($t -ne $lastTitle) {
                $lastTitle = $t
                W ("[{0}] window title: '{1}'" -f (Get-Date -Format 'HH:mm:ss'), $t)
              }
              if ($t -and -not (Test-ProbeTitle $t)) { $realTitle = $t; break }
              Start-Sleep -Seconds 5
            }
            if ($realTitle) { W "real window seen: '$realTitle' (boot wait up to ${BOOT_SECS} s)" }
            else { W "no real window within the ${BOOT_SECS} s boot wait - the titles above are what the process put up" }
          }

          W ""
          W "=== where Cura's window is (the capture itself is the whole display) ==="
          # The recorder is already running against the whole display, so this
          # is not a bound - it is the check that the frame contains Cura
          # rather than whatever is in front of it. The failure mode is
          # silent: something covering the window is recorded as the session
          # and nothing in the file says so. The rectangle is MEASURED, never
          # assumed: no window manager and no harness pin place the window on
          # this runner, so its position is whatever Cura asked for (the
          # harness's HARNESS_WINDOW pin is the Linux boot gate's job).
          $winX = 0
          $winY = 0
          $winW = 0
          $winH = 0
          $rectWhy = 'no window handle'
          $visible = $false
          $minimised = $true
          $front = $false
          $topPid = 0
          $hwnd = [IntPtr]::Zero
          $handledBy = 'none'
          for ($k = 0; $k -lt 12; $k++) {
            $p.Refresh()
            $hwnd = $p.MainWindowHandle
            if ($hwnd -ne [IntPtr]::Zero) { break }
            Start-Sleep -Seconds 2
          }
          W ("MainWindowHandle of pid {0}: {1}" -f $p.Id, $hwnd)
          $titleHint = "$realTitle"
          if (-not $titleHint) { $titleHint = 'UltiMaker Cura' }
          if ($nativeOk) {
            # The handle is ENUMERATED rather than taken on trust: a launcher
            # can own the top-level window this process reports, and a handle
            # that is not the app's window measures a rectangle that says
            # nothing about the recording. Every top-level window of this pid
            # or carrying the app's name is printed with its class, geometry
            # and score, and the row that won is repeated on its own line.
            $winTable = [SpikeNative]::WindowReport([uint32]$p.Id, $titleHint)
            foreach ($row in ($winTable -split "`n")) {
              if ($row -and $row.Trim()) { W ("window row: {0}" -f $row.TrimEnd()) }
            }
            $picked = [SpikeNative]::LastPick()
            if ($picked -ne [IntPtr]::Zero) {
              $hwnd = $picked
              $handledBy = 'the enumerated window table'
            } elseif ($hwnd -ne [IntPtr]::Zero) {
              $handledBy = 'MainWindowHandle (no enumerated row won)'
            } else {
              $handledBy = 'nowhere (no top-level window of this pid and no MainWindowHandle)'
            }
          } else {
            $handledBy = 'MainWindowHandle (the native helper did not compile, so nothing can be enumerated)'
          }
          $hwndTitle = ''
          $hwndClass = ''
          if ($nativeOk -and ($hwnd -ne [IntPtr]::Zero)) {
            $hwndTitle = [SpikeNative]::WindowTitle($hwnd)
            $hwndClass = [SpikeNative]::WindowClass($hwnd)
          }
          W ("window handle: {0} (pid {1}, title '{2}', class '{3}', from {4})" -f `
              $hwnd, $p.Id, $hwndTitle, $hwndClass, $handledBy)
          if (($hwnd -ne [IntPtr]::Zero) -and (-not $nativeOk)) {
            $rectWhy = 'the native helper did not compile, so GetWindowRect cannot be called'
          } elseif ($hwnd -ne [IntPtr]::Zero) {
            $rc = Get-WindowRect $hwnd
            if ($rc) {
              $winX = $rc.X
              $winY = $rc.Y
              $winW = $rc.W
              $winH = $rc.H
              $rectWhy = $rc.Source
            } else {
              $rectWhy = ('no rectangle could be read from this window (GetWindowRect win32 error {0})' -f [System.Runtime.InteropServices.Marshal]::GetLastWin32Error())
            }
          }
          $wantWin = "$env:HARNESS_WINDOW"
          if (-not $wantWin) { $wantWin = '1840x1040' }
          W ("window rectangle: {0},{1} {2}x{3} ({4}); the harness window pin is {5}" -f $winX, $winY, $winW, $winH, $rectWhy, $wantWin)
          # BOUNDS, checked against the display rather than assumed: a window
          # placed partly off the screen is CLIPPED by a full-display capture -
          # the frame silently omits part of the window, which is what the
          # owner saw in a recording of this leg. Nothing here trusts the
          # window manager to have placed it sensibly, and the rule is that a
          # moved or resized window stays inside the capture area unless the
          # test itself calls for otherwise: SPIKE_OFFSCREEN_WINDOW=allow is
          # that opt-out, and the default brings the window back in.
          $boundsPolicy = "$env:SPIKE_OFFSCREEN_WINDOW"
          if (-not $boundsPolicy) { $boundsPolicy = 'clamp' }
          W ("window bounds policy: {0} (SPIKE_OFFSCREEN_WINDOW; 'allow' leaves a deliberately off-screen window where the test put it)" -f $boundsPolicy)
          $inBounds = (($winW -gt 0) -and ($winH -gt 0) -and ($winX -ge 0) -and ($winY -ge 0) -and
                       (($winX + $winW) -le $capW) -and (($winY + $winH) -le $capH))
          W ("window rectangle vs the capture area (0,0 {0}x{1}): in-bounds={2} rect={3},{4} {5}x{6}" -f `
              $capW, $capH, $inBounds, $winX, $winY, $winW, $winH)
          $clampWhy = 'the whole window is already inside the capture area'
          if (-not $inBounds) {
            if ($boundsPolicy -eq 'allow') {
              $clampWhy = 'the run opted out (SPIKE_OFFSCREEN_WINDOW=allow), so the window is left where it is and a clipped frame is expected'
              W $clampWhy
            } elseif (-not $nativeOk) {
              $clampWhy = 'the native helper did not compile, so the window cannot be moved'
            } elseif ($hwnd -eq [IntPtr]::Zero) {
              $clampWhy = 'there is no window handle to move'
            } elseif (($winW -gt $capW) -or ($winH -gt $capH)) {
              # The window cannot fit this display at its pinned size (1840x1040
              # on a 1024x768 runner). Refusing to touch it left it clipped, and
              # a full-display capture then omits part of the window silently.
              # Shrinking it keeps every pixel in frame: the window pin is a
              # target, not a precondition, and a complete smaller window is
              # usable evidence where a clipped one is not.
              # SWP_NOZORDER | SWP_NOACTIVATE: resize and move only, so the
              # stacking and the focus stay as they were and the visibility
              # check below reads what this move did and nothing else.
              $nw = [Math]::Min($winW, $capW)
              $nh = [Math]::Min($winH, $capH)
              $moved = [SpikeNative]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $nw, $nh, 0x0014)
              W ("window larger than the capture area: resizing {0}x{1} -> {2}x{3} at 0,0" -f $winW, $winH, $nw, $nh)
              if ($moved) {
                Start-Sleep -Seconds 2
                $rcC = Get-WindowRect $hwnd
                if ($rcC) {
                  $winX = $rcC.X
                  $winY = $rcC.Y
                  $winW = $rcC.W
                  $winH = $rcC.H
                }
                # The DWM frame carries an invisible border, so a resize to the
                # exact display size still overflows by it. Shrink by the
                # overflow this move actually measured rather than by a guess.
                if ((($winX + $winW) -gt $capW) -or (($winY + $winH) -gt $capH)) {
                  $ow = [Math]::Max(0, ($winX + $winW) - $capW)
                  $oh = [Math]::Max(0, ($winY + $winH) - $capH)
                  $nw2 = [Math]::Max(1, $winW - $ow)
                  $nh2 = [Math]::Max(1, $winH - $oh)
                  W ("the frame border overflowed by {0}x{1}: resizing again to {2}x{3}" -f $ow, $oh, $nw2, $nh2)
                  if ([SpikeNative]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $nw2, $nh2, 0x0014)) {
                    Start-Sleep -Seconds 2
                    $rcC2 = Get-WindowRect $hwnd
                    if ($rcC2) {
                      $winX = $rcC2.X
                      $winY = $rcC2.Y
                      $winW = $rcC2.W
                      $winH = $rcC2.H
                    }
                  }
                }
                $inBounds = (($winW -gt 0) -and ($winH -gt 0) -and ($winX -ge 0) -and ($winY -ge 0) -and
                             (($winX + $winW) -le $capW) -and (($winY + $winH) -le $capH))
                $clampWhy = ("resized to {0}x{1} at {2},{3} to fit the {4}x{5} display" -f `
                    $winW, $winH, $winX, $winY, $capW, $capH)
              } else {
                $clampWhy = ("SetWindowPos could not resize the window (win32 error {0})" -f [System.Runtime.InteropServices.Marshal]::GetLastWin32Error())
              }
            } else {
              $nx = [Math]::Max(0, [Math]::Min($winX, $capW - $winW))
              $ny = [Math]::Max(0, [Math]::Min($winY, $capH - $winH))
              # SWP_NOSIZE | SWP_NOZORDER | SWP_NOACTIVATE: move only, keep the
              # pinned size (the screen-fits assertion keeps its subject) and
              # leave the stacking and the focus alone, so the visibility
              # check below reads the state the move produced and nothing else.
              $moved = [SpikeNative]::SetWindowPos($hwnd, [IntPtr]::Zero, $nx, $ny, 0, 0, 0x0015)
              W ("window out of bounds: moving {0},{1} -> {2},{3} (SetWindowPos, size kept at {4}x{5})" -f $winX, $winY, $nx, $ny, $winW, $winH)
              if ($moved) {
                Start-Sleep -Seconds 2
                $rcC = Get-WindowRect $hwnd
                if ($rcC) {
                  $winX = $rcC.X
                  $winY = $rcC.Y
                  $winW = $rcC.W
                  $winH = $rcC.H
                }
                $inBounds = (($winW -gt 0) -and ($winH -gt 0) -and ($winX -ge 0) -and ($winY -ge 0) -and
                             (($winX + $winW) -le $capW) -and (($winY + $winH) -le $capH))
                $clampWhy = ("SetWindowPos to {0},{1}" -f $nx, $ny)
              } else {
                $clampWhy = ("SetWindowPos failed (win32 error {0})" -f [System.Runtime.InteropServices.Marshal]::GetLastWin32Error())
              }
            }
            W ("window rectangle after the bounds fix: {0},{1} {2}x{3} in-bounds={4} ({5})" -f `
                $winX, $winY, $winW, $winH, $inBounds, $clampWhy)
          }
          if ($inBounds) {
            V ("SPIKE-Q2: window-bounds=OK ({0},{1} {2}x{3} inside the {4}x{5} capture area; {6})" -f `
                $winX, $winY, $winW, $winH, $capW, $capH, $clampWhy)
          } else {
            V ("SPIKE-Q2: window-bounds=CLIPPED ({0},{1} {2}x{3} against the {4}x{5} capture area: part of the window is outside the display, so the full-screen recording omits it; {5})" -f `
                $winX, $winY, $winW, $winH, $capW, $capH, $clampWhy)
            W "FINDING: the window is not wholly inside the capture area and could not be moved into it, so the recording is clipped - reported here rather than left to be noticed by eye"
          }
          # Visibility, checked rather than assumed. The failure mode is the
          # reason: with something else covering the window, the frame
          # records that something else instead of Cura, and nothing about
          # the file says so afterwards.
          if (($hwnd -ne [IntPtr]::Zero) -and $nativeOk) {
            $visible = [SpikeNative]::IsWindowVisible($hwnd)
            $minimised = [SpikeNative]::IsIconic($hwnd)
            $front = ([SpikeNative]::GetForegroundWindow() -eq $hwnd)
            $probe = New-Object MpfPoint
            $topPid = 0
            if ($null -ne $probe) {
              $probe.X = [int]($winX + ($winW / 2))
              $probe.Y = [int]($winY + ($winH / 2))
              $topHwnd = [SpikeNative]::WindowFromPoint($probe)
              [void][SpikeNative]::GetWindowThreadProcessId($topHwnd, [ref]$topPid)
            }
            W ("visibility: IsWindowVisible={0} IsIconic={1} foreground={2} topmost window at the rectangle centre belongs to pid {3} (Cura is pid {4})" -f `
                $visible, $minimised, $front, $topPid, $p.Id)
            if ((-not $front) -or $minimised) {
              # Ask for the front and then look again: what matters is the
              # state the recording runs in, not the state it was found in.
              W "bringing the window to the front (ShowWindow(SW_RESTORE) then SetForegroundWindow)"
              if ($minimised) { [void][SpikeNative]::ShowWindow($hwnd, 9) }
              [void][SpikeNative]::SetForegroundWindow($hwnd)
              Start-Sleep -Seconds 3
              $p.Refresh()
              $rcF = Get-WindowRect $hwnd
              if ($rcF) {
                $winX = $rcF.X
                $winY = $rcF.Y
                $winW = $rcF.W
                $winH = $rcF.H
              }
              $visible = [SpikeNative]::IsWindowVisible($hwnd)
              $minimised = [SpikeNative]::IsIconic($hwnd)
              $front = ([SpikeNative]::GetForegroundWindow() -eq $hwnd)
              if ($null -ne $probe) {
                $probe.X = [int]($winX + ($winW / 2))
                $probe.Y = [int]($winY + ($winH / 2))
                $topHwnd = [SpikeNative]::WindowFromPoint($probe)
                $topPid = 0
                [void][SpikeNative]::GetWindowThreadProcessId($topHwnd, [ref]$topPid)
              }
              W ("visibility after bringing it forward: IsWindowVisible={0} IsIconic={1} foreground={2} topmost pid {3}" -f `
                  $visible, $minimised, $front, $topPid)
            }
          }
          # The rectangle must be a real region of this desktop, and the
          # topmost window at its centre must be Cura: a rectangle off the
          # screen is a different fault from an occluded one.
          $vsRect = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $rectOnScreen = (($winW -gt 0) -and ($winH -gt 0) -and
                           ($winX -ge $vsRect.Left) -and ($winY -ge $vsRect.Top) -and
                           (($winX + $winW) -le $vsRect.Right) -and (($winY + $winH) -le $vsRect.Bottom))
          $unoccluded = ($topPid -eq $p.Id)
          if ($visible -and (-not $minimised) -and $rectOnScreen -and $unoccluded) {
            V ("SPIKE-Q2: window=VISIBLE ({0},{1} {2}x{3}, foreground={4}, topmost pid {5}, inside the virtual screen; the capture is the whole display, so Cura is in frame wherever the window sits)" -f `
                $winX, $winY, $winW, $winH, $front, $topPid)
          } else {
            V ("SPIKE-Q2: window=NOT-VERIFIED (visible={0} minimised={1} on-screen={2} unoccluded={3} rect={4},{5} {6}x{7})" -f `
                $visible, $minimised, $rectOnScreen, $unoccluded, $winX, $winY, $winW, $winH)
            W "FINDING: the window could not be shown to be visible, unminimised and unoccluded, so the full-screen recording may be of something else at that spot - reported rather than assumed, and the recording continues because a whole-display capture needs no rectangle to start"
          }
          # The recorder is already running (started before the launch), so
          # these samples say whether frames are arriving while Cura boots.
          if ($rec) {
            # Sampled while the rest of the step runs, because the verdict
            # separates "no frame was ever muxed" from "frames went in and
            # no index came out" by whether this container ever grew past
            # its header. Four samples over 20 s, then the checks below add
            # the recording's remaining length ($HEADER_MAX is the same 1 KB
            # the recorder's own header check uses).
            for ($s = 0; $s -lt 4; $s++) {
              Start-Sleep -Seconds 5
              $rec.Process.Refresh()
              $recAlive = -not $rec.Process.HasExited
              if (Test-Path $video) {
                $sLen = (Get-Item $video).Length
                if ($sLen -gt $HEADER_MAX) { $recGrew = $true }
                $recSamples += $sLen
                W ("[{0}] scenario.mp4: {1} bytes, recorder alive={2}" -f (Get-Date -Format 'HH:mm:ss'), $sLen, $recAlive)
              } else {
                W ("[{0}] scenario.mp4: not created yet, recorder alive={1}" -f (Get-Date -Format 'HH:mm:ss'), $recAlive)
              }
              if (-not $recAlive -and -not $recGoneLogged) {
                $recGoneLogged = $true
                $recExitedEarly = $true
                W "recorder is gone - the recording ended without teardown being asked"
              }
            }
          }

          W ""
          W "=== did Cura get GL? (the probe warning is the only signal) ==="
          # The first run's window title was "Failed to probe OpenGL": the
          # dialog was the main window, which is why no UI was ever shown.
          # Three places can carry the warning - the window title, Cura's own
          # streams, and Cura's log - and all three are checked, so "absent"
          # is a claim about the set rather than about the easiest one.
          $glHits = @()
          $title = if ($died) { '' } else { "$($p.MainWindowTitle)" }
          W "window title at the wait: '$title'"
          W "last real (non-probe) title seen: '$realTitle'"
          if ($died) { W "the process had exited, so no window of its own can be inspected" }
          foreach ($m in $markers) {
            if ($title -like ("*" + $m + "*")) { $glHits += "window title: $m" }
          }
          foreach ($f in @($curaOut, $curaErr)) {
            if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
              W "--- $f ($((Get-Item $f).Length) bytes) ---"
              $txt = ''
              # Cura still holds the handle, so the read is guarded rather
              # than assumed: a sharing violation must not cost the verdict.
              try {
                $txt = (Get-Content $f -Raw -ErrorAction Stop)
                $txt -split "`n" | Select-Object -Last 25 | ForEach-Object { W $_.TrimEnd() }
              } catch {
                W "could not read $f while Cura holds it: $($_.Exception.Message)"
              }
              foreach ($m in $markers) {
                if ($txt -like ("*" + $m + "*")) { $glHits += "$([System.IO.Path]::GetFileName($f)): $m" }
              }
            } else {
              W "--- ${f}: empty or absent (a GUI subsystem binary may print nothing at all) ---"
            }
          }
          # Cura's own log, wherever this image keeps it. The roots are built
          # from the environment rather than interpolated, so a variable that
          # is not set skips its root instead of failing the lookup.
          $curaLogs = @()
          $logRoots = @()
          foreach ($e in @('APPDATA', 'LOCALAPPDATA')) {
            $v = [System.Environment]::GetEnvironmentVariable($e)
            if ($v) { $logRoots += (Join-Path $v 'cura') }
          }
          foreach ($base in $logRoots) {
            if (Test-Path $base) {
              $curaLogs += Get-ChildItem -Path $base -Filter 'cura.log' -Recurse -Depth 3 -File -ErrorAction SilentlyContinue |
                Select-Object -First 3 -ExpandProperty FullName
            }
          }
          if ($curaLogs.Count -eq 0) { W "no cura.log found under APPDATA or LOCALAPPDATA" }
          foreach ($lg in $curaLogs) {
            W "--- Cura log: $lg ---"
            $found = $null
            try { $found = Select-String -Path $lg -Pattern $markers -ErrorAction Stop }
            catch { W "could not scan this log: $($_.Exception.Message)" }
            if ($found) {
              foreach ($h in ($found | Select-Object -First 10)) {
                W ("  line {0}: {1}" -f $h.LineNumber, $h.Line.Trim())
                $glHits += "cura.log: $($h.Line.Trim())"
              }
            } else {
              W "  no probe-warning line in this log"
            }
            W "  tail:"
            Get-Content $lg -Tail 12 -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_) }
          }
          # The cheap diagnosis, read back: what Qt itself said about the GL
          # library it loaded. "Qt: Using WGL and OpenGL from" names the file it
          # chose, "Failed to load" carries the Win32 error when one is refused,
          # "Falling back" says it went looking for another. These lines are
          # evidence rather than failure markers - Cura's own words are the
          # marker - so a GL warning that never became a dialog is reported
          # rather than swallowed.
          $glDiag = @()
          $glDiagPat = 'Using WGL and OpenGL from|Failed to load|Falling back|WGL and OpenGL|llvmpipe|OpenGL renderer|OpenGL version|OpenGL context'
          $glDiagErrPat = '(?i)(opengl|wgl|gallium|llvmpipe).*(fail|error|could not|cannot|unsupported|missing|refus)'
          foreach ($f in @($curaOut, $curaErr)) {
            if (-not (Test-Path $f)) { continue }
            $dtxt = ''
            try { $dtxt = (Get-Content $f -Raw -ErrorAction Stop) } catch { continue }
            foreach ($ln in ($dtxt -split "`n")) {
              $l = $ln.Trim()
              if (-not $l) { continue }
              if ($l -match $glDiagPat) {
                if ($l -match $glDiagErrPat) { $glDiag += ("ERROR " + $l) }
                else { $glDiag += ("info  " + $l) }
              }
            }
          }
          $glDiag = @($glDiag | Select-Object -Unique)
          $glDiagErr = @($glDiag | Where-Object { $_ -like 'ERROR *' })
          if ($glDiag.Count -gt 0) {
            W "--- Qt GL diagnostics from Cura's streams ---"
            foreach ($l in ($glDiag | Select-Object -First 12)) { W ("  " + $l) }
            W "note: a bare name on that line is what an emptied QT_OPENGL_DLL looks like in Qt's own words - the variable this step set pointed at an absolute path, so an absolute path there would mean Cura kept it"
          } else {
            W "--- no Qt GL diagnostic line in Cura's streams (qt.qpa.gl was on; a GUI build can still print nothing) ---"
          }
          # Which GL library the process actually holds: the fact the verdict
          # rests on. A path under the Mesa directory, or a gallium loader or
          # Qt's own rasteriser in the module list, is the software renderer at
          # work; so is a System32\opengl32.dll whose bytes are the provisioned
          # Mesa's, which is the deployment above and the only way the desktop
          # path can be given llvmpipe at all; the untouched system32 opengl32
          # alone is the driver stack; no GL module at all is a process that
          # never got that far.
          $glModules = @()
          $modProcs = @($p) + @(Get-Process -Name 'UltiMaker-Cura*' -ErrorAction SilentlyContinue)
          foreach ($mp in $modProcs) {
            if (-not $mp) { continue }
            try {
              foreach ($m in $mp.Modules) {
                if ($m.ModuleName -match '(?i)^(opengl32|opengl32sw|libgallium_wgl|libglapi|dxil|libEGL|libGLESv2|nvoglv|atio6axx|ig[0-9]*icd|ig[0-9]*dumd|swiftshader)') {
                  $glModules += ("{0} (pid {1}): {2}" -f $m.ModuleName, $mp.Id, $m.FileName)
                }
              }
            } catch {
              W "could not read the module list of pid $($mp.Id): $($_.Exception.Message)"
            }
          }
          $glModules = @($glModules | Select-Object -Unique)
          if ($glModules.Count -gt 0) {
            W "--- GL libraries loaded in Cura's process ---"
            foreach ($l in $glModules) { W ("  " + $l) }
          } else {
            W "--- no GL library is visible in Cura's module list ---"
          }
          $glSoftware = @($glModules | Where-Object {
            ($_ -match '(?i)opengl32sw|libgallium_wgl|libglapi|swiftshader') -or
            ($mesaDir -and ($_ -like ("*" + $mesaDir + "*"))) })
          # The System32 file is the same module path whether it is Mesa's or
          # Microsoft's, so the hash of the deployed file is what separates
          # llvmpipe from the GDI generic that failed to probe.
          if ($sysGlDeployed) {
            $glSoftware += ("System32\opengl32.dll is the provisioned Mesa llvmpipe (" + $sysGlWhy + ")")
          }
          $glMesaDiag = @($glDiag | Where-Object { $_ -match '(?i)llvmpipe' })
          if ($glMesaDiag.Count -gt 0) { $glSoftware += ("Qt named the driver: " + $glMesaDiag[0]) }
          $glSystem = @($glModules | Where-Object { $_ -like '*System32\opengl32.dll*' })
          $glHits = @($glHits | Select-Object -Unique)
          $glLibShown = '<unset>'
          if ($glLib) { $glLibShown = $glLib }
          $glErrShown = 'no error line from Qt'
          if ($glDiagErr.Count -gt 0) { $glErrShown = ($glDiagErr -join ' | ') }
          W ""
          # The verdict asks only what can be checked afterwards: Cura's own
          # probe warning, and which GL library the process was holding. A GL
          # error line without the dialog is reported alongside it rather than
          # counted as success by omission.
          if ($glHits.Count -gt 0) {
            foreach ($h in $glHits) { W "probe warning found in $h" }
            V "SPIKE-Q2: gl=unknown (probe warning: present)"
            W "  the probe dialog is still what Cura puts up; loaded GL modules: $($glModules -join '; ')"
            W ("  diagnostics: QT_OPENGL_DLL={0}; {1}" -f $glLibShown, $glErrShown)
          } elseif ($died) {
            V "SPIKE-Q2: gl=unknown (probe warning: absent)"
            W "  the process had already exited, so its window and module list could not be read"
          } elseif ($glSoftware.Count -gt 0) {
            V "SPIKE-Q2: gl=software (probe warning: absent)"
            W ("  software renderer loaded: " + ($glSoftware -join '; '))
          } elseif ($glSystem.Count -gt 0) {
            V "SPIKE-Q2: gl=hardware (probe warning: absent)"
            W ("  only the system OpenGL library is loaded: " + ($glSystem -join '; '))
            W "  (the runner is a GPU-less VM, so the module list is what says which implementation answered)"
          } else {
            V "SPIKE-Q2: gl=unknown (probe warning: absent)"
            W "  no GL library is visible in the module list, so which implementation answered cannot be said"
          }
          if ($glDiagErr.Count -gt 0) { W "  note: Qt reported GL errors without a probe dialog - see the error lines above" }

          W ""
          W "=== the Welcome wizard (runner.py's first gate asserts it absent) ==="
          # Cura puts "Welcome to UltiMaker Cura" up exactly when there is no
          # active machine, and it has no "seen" flag to set: the wizard is
          # in-window QML, decided once at initializationFinished. What the
          # machine manager reached is in Cura's own log, in lines only the
          # error checker writes: "Error check finished, result" and "New
          # error check scheduled." only while a machine is active, and "No
          # active machine, nothing to check." once when there is none - that
          # last one appears in working runs too, in the moment before a
          # machine is restored, so an active-machine line settles it.
          $welcomeFiles = @()
          foreach ($f in (@($curaOut, $curaErr) + @($curaLogs))) {
            if ($f -and (Test-Path $f)) { $welcomeFiles += $f }
          }
          $welcomeAc = @()
          $welcomeNa = @()
          foreach ($f in $welcomeFiles) {
            $acN = 0
            $naN = 0
            try {
              $acN = @(Select-String -Path $f -SimpleMatch -ErrorAction Stop `
                -Pattern 'Error check finished, result', 'New error check scheduled').Count
              $naN = @(Select-String -Path $f -SimpleMatch -ErrorAction Stop `
                -Pattern 'No active machine, nothing to check').Count
            } catch {
              W "could not scan $f for a machine-state marker: $($_.Exception.Message)"
            }
            W ("  {0}: active-machine lines {1}, no-active-machine lines {2}" -f $f, $acN, $naN)
            if ($acN -gt 0) { $welcomeAc += $f }
            if ($naN -gt 0) { $welcomeNa += $f }
          }
          if ($welcomeFiles.Count -eq 0) {
            W "  no Cura log or captured stream could be read: nothing to read a machine state out of"
          }
          $welcomeList = '<none>'
          if ($welcomeFiles.Count -gt 0) { $welcomeList = ($welcomeFiles -join '; ') }
          $welcomeMode = 'UNKNOWN'
          $welcomeWhy = "no readable source carried a machine-state marker (files read: $welcomeList)"
          if ($welcomeAc.Count -gt 0) {
            $welcomeMode = 'ABSENT'
            $welcomeWhy = ("Cura's own log shows an active machine (active-machine lines in {0}); the wizard's visibility is decided at startup from exactly that, so it was never shown" -f ($welcomeAc -join '; '))
          } elseif ($welcomeNa.Count -gt 0) {
            $welcomeMode = 'PRESENT'
            $welcomeWhy = ("Cura's log has only the no-active-machine line (in {0}) - the wizard's precondition holds, so it is on screen and runner.py's first gate would stall" -f ($welcomeNa -join '; '))
          }
          V ("SPIKE-Q2: welcome={0} ({1})" -f $welcomeMode, $welcomeWhy)
          if ($welcomeMode -ne 'ABSENT') {
            W "FINDING: the welcome= line above is not ABSENT - either the wizard is up, or the state could not be read. The seed= line in the Windows config step names what was written and read back; runner.py's first gate asserts the wizard absent, so this has to read ABSENT before the integration phase can run a scenario"
          }

          W ""
          W "=== screen geometry ==="
          $vs = $null
          try {
            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            W "VirtualScreen: x=$($vs.X) y=$($vs.Y) w=$($vs.Width) h=$($vs.Height)"
          } catch {
            W "SystemInformation FAILED: $($_.Exception.Message)"
          }
          # GDI screen capture: if it cannot see a desktop, no still can
          # be taken this way.
          function Get-PngSize($path) {
            # A PNG's IHDR carries the pixel size, so a still's declared
            # dimensions can be reported without an image library: 8-byte
            # signature, then the chunk length, "IHDR", then width and height
            # as big-endian uint32.
            try {
              $b = [System.IO.File]::ReadAllBytes($path)
              if ($b.Length -lt 24) { return '' }
              $w = [int]$b[16] * 16777216 + [int]$b[17] * 65536 + [int]$b[18] * 256 + [int]$b[19]
              $h = [int]$b[20] * 16777216 + [int]$b[21] * 65536 + [int]$b[22] * 256 + [int]$b[23]
              return ("{0}x{1}" -f $w, $h)
            } catch { return '' }
          }

          function Grab-Frame($path) {
            if (-not $vs) { return $false }
            try {
              $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $gfx.CopyFromScreen($vs.Left, $vs.Top, 0, 0, $bmp.Size)
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $gfx.Dispose(); $bmp.Dispose()
              return ((Get-Item $path).Length -gt 0)
            } catch {
              W "frame capture failed: $($_.Exception.Message)"
              return $false
            }
          }

          W ""
          W "=== still capture (System.Drawing CopyFromScreen) ==="
          # Full-screen, like the recorder and like runner.py's own stills: a
          # still taken of the whole display follows whatever a resize test
          # does to the window, where a still of a fixed rectangle would not.
          $shot = Join-Path $EVIDENCE 'cura-desktop.png'
          if (Grab-Frame $shot) {
            $len = (Get-Item $shot).Length
            W ("wrote {0}: {1:N1} KB" -f $shot, ($len / 1KB))
            $pngWH = Get-PngSize $shot
            W ("still size: {0} (the display this run captures is {1}x{2})" -f $(if ($pngWH) { $pngWH } else { 'unreadable' }), $capW, $capH)
            W "note: a solid/empty frame compresses to a few KB, a real"
            W "      desktop to hundreds - the size IS the signal"
            V ("SPIKE-Q2: screenshot=OK ({0:N1} KB{1})" -f ($len / 1KB), $(if ($pngWH) { ', ' + $pngWH } else { '' }))
          } else {
            W "still capture wrote nothing"
            V "SPIKE-Q2: screenshot=FAILED (no PNG written)"
          }
          # Steady-state re-read of the only geometry that decides whether the
          # recording is clipped: the window against the capture area. A
          # window the run moved after the bounds check above shows up here
          # rather than in someone's eye later.
          if (($hwnd -ne [IntPtr]::Zero) -and $nativeOk) {
            $rcL = Get-WindowRect $hwnd
            if ($rcL) {
              $lx = $rcL.X
              $ly = $rcL.Y
              $lw = $rcL.W
              $lh = $rcL.H
              $lIn = (($lw -gt 0) -and ($lh -gt 0) -and ($lx -ge 0) -and ($ly -ge 0) -and
                      (($lx + $lw) -le $capW) -and (($ly + $lh) -le $capH))
              W ("window rectangle at the still, vs the capture area (0,0 {0}x{1}): in-bounds={2} rect={3},{4} {5}x{6}" -f `
                  $capW, $capH, $lIn, $lx, $ly, $lw, $lh)
              if (-not $lIn) {
                V ("SPIKE-Q2: window-bounds=CLIPPED-AT-STILL ({0},{1} {2}x{3} against {4}x{5}: the window moved out of the capture area during the run, so the recording omits that part of it)" -f `
                    $lx, $ly, $lw, $lh, $capW, $capH)
              }
            }
          }

          W ""
          W "=== stopping the recorder (the harness's own graceful stop) ==="
          # HOW THE HARNESS STOPS ITS RECORDER, on every platform: with a
          # signal, never a kill, so ffmpeg reaches av_write_trailer and the
          # mp4 gets its index. runner.py:278-281 waits a second and calls
          # Popen.terminate() (SIGTERM on Linux) with a 10 s wait, then kills
          # only if that wait expires; the macOS leg sends SIGINT and does the
          # same. tools/ui_test.sh's pkill -9 is a backstop that runs AFTER
          # that stop, not the stop itself. Windows has the same lever and not
          # a different one: ffmpeg installs a console control handler
          # (fftools/ffmpeg.c, term_init: SetConsoleCtrlHandler(CtrlHandler,
          # TRUE)) and turns CTRL_C_EVENT and CTRL_BREAK_EVENT into the same
          # shutdown as SIGINT - sigterm_handler(SIGINT), the transcode loop
          # returns, the trailer is written. What a windowless child cannot
          # receive is a WM_CLOSE, which is all taskkill posts without /F, and
          # that is why run 35934448026 ended with 524336 bytes of frames and
          # no index: the capture worked and the stop was a kill.
          # A console control event is aimed at a CONSOLE, never at a pid, so
          # sending one is not the same as delivering it: the event is raised
          # on this step's console unless this step first attaches to the
          # recorder's own. Every run so far raised it on the step's console
          # and reported it sent - the recorder was on a console of its own,
          # and the event reached nobody. So: read which console the recorder
          # is on, raise the event there, then the harness's own 10 s bounded
          # wait, then the force as the last resort. CTRL_BREAK_EVENT is the
          # event that can be aimed (a targeted CTRL_C_EVENT is not delivered
          # to a process group by design), and group 0 means every process
          # sharing the console the event is generated on.
          $stopWhy = 'not attempted'
          if ($rec -and (-not $rec.Process.HasExited)) {
            if (-not $nativeOk) {
              $stopWhy = 'the native helper did not compile, so no console control event can be sent'
              W $stopWhy
            } else {
              # This process must survive the event it raises: with a handler
              # of NULL and TRUE, the calling process ignores the console
              # control events it generates.
              [void][SpikeNative]::SetConsoleCtrlHandler([IntPtr]::Zero, $true)
              $recPid = [uint32]$rec.Process.Id
              $stopRoute = 'none'
              # Which console the recorder is on decides where the event has to
              # be raised, and the answer is read rather than assumed. The
              # event is generated on the CONSOLE, not on a pid: a child that
              # was given a console of its own is not on this step's console at
              # all, and an event raised here is sent-and-not-delivered - which
              # is exactly how a run ended with 524336 bytes of frames and no
              # index. GetConsoleProcessList names the processes on this step's
              # console, so the recorder's absence from that list is what says
              # its own console has to be attached.
              $consolePids = @()
              $buf = New-Object 'uint32[]' 64
              $n = [SpikeNative]::GetConsoleProcessList($buf, [uint32]64)
              $listErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              for ($c = 0; $c -lt [Math]::Min([int]$n, 64); $c++) { $consolePids += $buf[$c] }
              W ("this step's console holds processes: {0} (list call returned {1}, win32 error {2}); the recorder is pid {3}" -f `
                  $(if ($consolePids.Count -gt 0) { $consolePids -join ', ' } else { 'none readable' }), $n, $listErr, $recPid)
              try {
                if ($consolePids -contains $recPid) {
                  # Shared console: group 0 is every process attached to this
                  # console, the recorder among them, and this process ignores
                  # the event by the handler above.
                  $sent = [SpikeNative]::GenerateConsoleCtrlEvent(0x1, 0)
                  $sentErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                  W ("GenerateConsoleCtrlEvent(CTRL_BREAK_EVENT, 0) on this step's own console returned {0} (win32 error {1})" -f $sent, $sentErr)
                  if ($sent) { $stopRoute = 'this step''s console, which the recorder shares' }
                } else {
                  # A console of its own. AttachConsole fails while this
                  # process holds a console, so this step's own is given up
                  # first; the console it then has is the recorder's, and an
                  # event raised there reaches the recorder and nothing else.
                  # CREATE_NO_WINDOW is what creates that console, and it is
                  # why the pid has to be attached to rather than signalled.
                  [void][SpikeNative]::FreeConsole()
                  $attached = [SpikeNative]::AttachConsole($recPid)
                  if ($attached) {
                    W ("the recorder has a console of its own; attached to pid {0}" -f $recPid)
                    # The targeted event first: a process that owns its
                    # console is the root of that console's process group,
                    # and CTRL_BREAK is the one that can be aimed (a targeted
                    # CTRL_C_EVENT is not delivered to a process group by
                    # design). Group 0 on the same console is the fallback,
                    # and it can only reach the recorder either way.
                    $targeted = [SpikeNative]::GenerateConsoleCtrlEvent(0x1, $recPid)
                    $targetedErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                    W ("GenerateConsoleCtrlEvent(CTRL_BREAK_EVENT, {0}) returned {1} (win32 error {2})" -f $recPid, $targeted, $targetedErr)
                    $broad = [SpikeNative]::GenerateConsoleCtrlEvent(0x1, 0)
                    $broadErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                    W ("GenerateConsoleCtrlEvent(CTRL_BREAK_EVENT, 0) on the recorder's own console returned {0} (win32 error {1})" -f $broad, $broadErr)
                    if ($targeted -or $broad) { $stopRoute = 'the console the recorder owns' }
                    [void][SpikeNative]::FreeConsole()
                  } else {
                    $attErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                    W ("AttachConsole({0}) failed (win32 error {1}) and the recorder was not on this step's console, so no console carrying the recorder could be reached" -f $recPid, $attErr)
                  }
                }
              } catch {
                W ('the console control event threw: ' + $_.Exception.Message)
              }
              if ($stopRoute -eq 'none') {
                $stopWhy = 'no console carrying the recorder could be reached, so the event was not delivered'
              } else {
                $stopWhy = ("the console control event was sent on {0}" -f $stopRoute)
              }
              W $stopWhy
            }
            # The bounded wait the harness uses: video.wait(timeout=10) in
            # runner.py, so a recorder that is writing its index is given the
            # same ten seconds and only then forced. Forcing during the
            # trailer write is exactly how an index goes missing.
            $waited = 0
            while ($waited -lt 10) {
              Start-Sleep -Seconds 1
              $rec.Process.Refresh()
              if ($rec.Process.HasExited) { break }
              $waited++
            }
            $rec.Process.Refresh()
            if ($rec.Process.HasExited) {
              W ("recorder stopped {0} s after the event ({1})" -f $waited, $stopWhy)
            } else {
              W ("still running {0} s after the console control event ({1}) - force, as ui_test.sh's pkill -9 does" -f $waited, $stopWhy)
              $recWasForced = $true
              Stop-Process -Id $rec.Process.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
          } elseif ($rec) {
            $recExitedEarly = $true
            W "the recorder had already exited on its own before teardown"
          }
          if ($rec) {
            $rec.Process.Refresh()
            if ($rec.Process.HasExited) { W "recorder exit code: $($rec.Process.ExitCode)" }
          }
          Get-Process ffmpeg -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          W "teardown sweep (all ffmpeg processes, as ui_test.sh) done"
          W ""
          W "--- the recording ---"
          # The recorder's own diagnostics, collected from the redirected pipes
          # now that the process is gone and written out as the evidence files
          # the Linux leg names. Run 35929485153 lost them to a console nobody
          # reads, which is why its empty video explained nothing; run
          # 35932140235 kept them, and they are the reason the fault is known
          # rather than guessed - ffmpeg never reached the desktop because the
          # child's working directory put the argv's relative output path one
          # directory too deep, and it said so in its first line.
          if ($rec) {
            $recErrText = Get-CaptureText $recErrTask
            $recOutText = Get-CaptureText $recOutTask
            Save-CaptureText $recErr $recErrText
            Save-CaptureText $recOut $recOutText
            foreach ($pair in @(@($recErr, $recErrText), @($recOut, $recOutText))) {
              W ("--- {0} ({1} bytes) ---" -f $pair[0], $pair[1].Length)
              if ($pair[1].Length -gt 0) {
                $pair[1] -split "`n" | Select-Object -Last 30 | ForEach-Object { W $_.TrimEnd() }
              } else {
                W "(empty - the recorder wrote no diagnostics at all)"
              }
            }
          } else {
            W "no recorder process was started this session - no diagnostics to collect"
          }
          # A file that exists is not a recording, and the two ways it can fail
          # are different faults wanting different fixes, so the verdict names
          # which one this run was rather than reporting one word for both:
          #   NO-FRAMES  the container never grew past its header (ftyp + free
          #              + an mdat of size 0, ~48 bytes) while the recorder ran:
          #              no frame was ever muxed, because the process had no
          #              desktop to capture - a launch problem
          #   NO-INDEX   the container holds frames, it grew, but no index can
          #              be read from it: the capture worked and the stop did
          #              not let ffmpeg finalise the mp4 - a shutdown problem
          # 10 KB sits above an empty container and below a second of this
          # desktop, and the index is checked whatever the size says, because a
          # muxed-but-unfinalised mp4 is as unwatchable as an empty one; the
          # first run called a 48-byte container "video=OK".
          $VIDEO_MIN = 10240
          $vlen = 0
          if (Test-Path $video) { $vlen = (Get-Item $video).Length }
          $probe = Get-Command ffprobe -ErrorAction SilentlyContinue
          $probeText = ''
          $indexOk = $false
          $indexWhy = 'there is nothing to read'
          # The recorded frame size, reported against the pinned geometry:
          # "the recordings look low resolution" is answered by the numbers,
          # and a capture that came out at the display's size rather than the
          # pinned one must be visible here rather than inferred.
          $recDims = 'unknown'
          if ($vlen -gt 0) {
            if ($probe) {
              $probeText = (& $probe.Source -v error -show_entries 'format=duration,size:stream=codec_name,width,height,nb_frames' `
                  -of default=noprint_wrappers=1 "$video" 2>&1 | Out-String)
              $indexOk = (($LASTEXITCODE -eq 0) -and ($probeText -match 'codec_name'))
              if ($indexOk) { $indexWhy = 'ffprobe read the container back' }
              else { $indexWhy = 'ffprobe cannot read the container (no index in it)' }
              $dw = ([regex]::Match($probeText, '(?m)^width=([0-9]+)')).Groups[1].Value
              $dh = ([regex]::Match($probeText, '(?m)^height=([0-9]+)')).Groups[1].Value
              if ($dw -and $dh) { $recDims = ("{0}x{1}" -f $dw, $dh) }
              W ("recorded frame size: {0} (pinned geometry {1})" -f $recDims, $wantGeo)
            } else {
              # No ffprobe on this image: the index atom itself is the check.
              try {
                $raw = [System.IO.File]::ReadAllBytes($video)
                $rawText = [System.Text.Encoding]::GetEncoding(28591).GetString($raw)
                $indexOk = $rawText.IndexOf('moov') -ge 0
              } catch { $indexOk = $false }
              if ($indexOk) { $indexWhy = 'a moov atom is present in the bytes' }
              else { $indexWhy = 'no moov atom in the bytes' }
            }
          }
          # Where the recorder stood at teardown, and whether it shared this
          # step's session: both are the difference between the faults.
          $recEnd = ''
          $sessNote = ''
          if ($rec) {
            if ($recExitedEarly) { $recEnd = '; the recorder had stopped on its own before teardown' }
            elseif ($recWasForced) { $recEnd = ("; the teardown had to force it ({0})" -f $stopWhy) }
            else { $recEnd = ("; it was stopped at teardown ({0})" -f $stopWhy) }
            if ($recSess -and $mySess -and ($recSess -ne $mySess)) {
              $sessNote = ("; the recorder ran in session {0} and this step in {1}, so it had another desktop" -f $recSess, $mySess)
            } elseif ($recSess) {
              $sessNote = ("; it shared this step's session ({0}), where the desktop is" -f $recSess)
            }
          } else {
            $sessNote = '; no recorder process was ever started this session'
          }
          $videoOk = (($vlen -ge $VIDEO_MIN) -and $indexOk)
          if ($videoOk) {
            W ("wrote {0}: {1:N1} KB / {2:N1} MB" -f $video, ($vlen / 1KB), ($vlen / 1MB))
            # -i with no output exits non-zero on purpose: this is the
            # container/codec report, not a transcode.
            if ($ff) {
              W "--- container/codec (ffmpeg -i exits non-zero here: expected) ---"
              & $ff.Source -hide_banner -i "$video" 2>&1 |
                Select-Object -First 12 | ForEach-Object { W $_ }
            }
            if ($probe) {
              W "--- ffprobe's own reading of the container ---"
              W $probeText.TrimEnd()
            }
            V ("SPIKE-Q2: video=OK ({0:N1} KB, mp4, gdigrab, {1}, index readable)" -f ($vlen / 1KB), $recDims)
          } elseif ($vlen -gt $HEADER_MAX) {
            W ("wrote {0}: {1:N1} KB, but {2}" -f $video, ($vlen / 1KB), $indexWhy)
            if ($probe) {
              W "--- ffprobe on this container (the unreadable index, verbatim) ---"
              W $probeText.TrimEnd()
            }
            V ("SPIKE-Q2: video=FAILED-NO-INDEX ({0} bytes of frames and no readable index: the capture worked and the stop did not let ffmpeg finalise the mp4{1})" -f $vlen, $recEnd)
          } elseif ($indexOk) {
            # Finalised, so the recorder ended cleanly - and captured nothing
            # worth having. Not a green: the harness wants a session's worth.
            V ("SPIKE-Q2: video=FAILED-SHORT (the container is readable but holds {0} bytes, under the 10 KB floor: the capture ended cleanly and captured nothing usable{1})" -f $vlen, $recEnd)
          } elseif ($vlen -gt 0) {
            W ("wrote {0}: {1} bytes - the container header alone" -f $video, $vlen)
            if ($probe) {
              W "--- ffprobe on this container (expected: it cannot read one) ---"
              W $probeText.TrimEnd()
            }
            V ("SPIKE-Q2: video=FAILED-NO-FRAMES ({0} bytes, and the container never grew while the recorder ran: the recorder opened its output and muxed no frame past the header, so nothing arrived from the display{1})" -f $vlen, $sessNote)
          } else {
            # No container at all: the recorder's own first line is quoted
            # here, because that is what named this fault the last time - an
            # output path it could not open rather than a desktop it could
            # not see.
            $recWhy = ''
            $recFirst = @($recErrText -split "`n" | Where-Object { $_.Trim() } | Select-Object -First 1)
            if ($recFirst.Count -gt 0) { $recWhy = '; the recorder said: ' + $recFirst[0].Trim() }
            V ("SPIKE-Q2: video=FAILED-NO-FILE (ffmpeg wrote no scenario.mp4 at all{0}{1})" -f $sessNote, $recWhy)
          }
          if ($rec) {
            W ("recorder samples (5 s apart): {0}" -f (($recSamples -join ', ') + ' bytes'))
            W ("recorder container grew past its header: {0}" -f $recGrew)
          }

          if (-not $videoOk) {
            W ""
            W "=== why is the recording not usable? (foreground gdigrab probes) ==="
            # The recorder's own argv in the foreground, so the diagnostics
            # land in this log, next to the variant that skips the mouse:
            # gdigrab draws the cursor itself, and a screen it cannot draw a
            # cursor onto is one way this comes back empty. Finding an empty
            # recording is the point - what the runs say is the result, so it
            # fails loudly here rather than diagnosing nothing. A probe that
            # works where the recorder failed means the launch context is
            # what differed, not the capture.
            if ($ff) {
              $probes = @(
                @{ name = 'harness-argv'; extra = @() },
                @{ name = 'no-mouse';     extra = @('-draw_mouse', '0') }
              )
              foreach ($pv in $probes) {
                $pf = Join-Path $EVIDENCE ("gdigrab-probe-" + $pv.name + ".mp4")
                $pargs = @('-y', '-loglevel', 'error', '-f', 'gdigrab') + $captureArgs + $pv.extra +
                         @('-framerate', '15', '-t', '5', '-i', 'desktop', "`"$pf`"")
                W ("probe ({0}): ffmpeg {1}" -f $pv.name, ($pargs -join ' '))
                & $ff.Source @pargs 2>&1 | ForEach-Object { W $_ }
                $pl = 0
                if (Test-Path $pf) { $pl = (Get-Item $pf).Length }
                W ("probe ({0}): exit={1}, {2} bytes" -f $pv.name, $LASTEXITCODE, $pl)
              }
              # Those two say this machine can capture at all; neither says a
              # BACKGROUND capture can, which is what the failing scenario.mp4
              # is about. This one varies the LAUNCH CONTEXT and nothing else:
              # the recorder's own launch mechanism, the same argv shape, in
              # the recorder's own directory, bounded by -t 5 only so ffmpeg
              # finalises itself and nothing here depends on the teardown kill.
              # A file the size of the foreground probes means the launch
              # context is what the recorder was missing and the missing
              # scenario.mp4 is fixed with it; no file again, with ffmpeg's
              # reason printed above, means something else is.
              $bgFile = Join-Path $EVIDENCE 'gdigrab-probe-background.mp4'
              $bgArgs = @('-y', '-loglevel', 'error', '-f', 'gdigrab') + $captureArgs +
                        @('-framerate', '15', '-t', '5', '-i', 'desktop', "`"$bgFile`"")
              W ("probe (background): ffmpeg {0}" -f ($bgArgs -join ' '))
              $bg = $null
              try {
                $bg = Start-BgCapture $ff.Source $bgArgs $stepCwd
              } catch {
                W "probe (background): launch failed: $($_.Exception.Message)"
              }
              if ($bg) {
                $null = $bg.Process.WaitForExit(20000)
                $bg.Process.Refresh()
                if (-not $bg.Process.HasExited) {
                  W "probe (background): still running after 20 s - killing it"
                  Stop-Process -Id $bg.Process.Id -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                }
                $bgText = Get-CaptureText $bg.ErrTask
                if ($bgText) {
                  $bgText -split "`n" | Select-Object -Last 10 | ForEach-Object { W $_ }
                }
                $bl = 0
                if (Test-Path $bgFile) { $bl = (Get-Item $bgFile).Length }
                $bgVerd = 'FAILED'
                if ($bl -ge $VIDEO_MIN) { $bgVerd = 'OK' }
                W ("probe (background): exited={0}, {1} bytes, session {2} (this step: {3})" -f $bg.Process.HasExited, $bl, $bg.Process.SessionId, $mySess)
                V ("SPIKE-Q2: gdigrab-background-probe={0} ({1} bytes, -t 5, the recorder's own launch mechanism)" -f $bgVerd, $bl)
              }
            } else {
              W "no ffmpeg available to probe with"
            }
          }

          W ""
          W "=== the harness's own still form: ffmpeg -frames:v 1 ==="
          # runner.py:96-104 grabs stills through ffmpeg as well (x11grab,
          # -video_size SIZE, -frames:v 1), so one here reports whether the
          # harness's capture path itself works natively on this runner - the
          # recorder's own region and flags, one frame, no -framerate.
          if ($ff) {
            $ffStill = Join-Path $EVIDENCE 'ffmpeg-still.png'
            $stillArgs = @('-y', '-loglevel', 'error', '-f', 'gdigrab') + $captureArgs +
                         @('-i', 'desktop', '-frames:v', '1', "`"$ffStill`"")
            & $ff.Source @stillArgs 2>&1 | ForEach-Object { W $_ }
            W "ffmpeg still exit: $LASTEXITCODE"
            if ((Test-Path $ffStill) -and (Get-Item $ffStill).Length -gt 0) {
              $stillWH = Get-PngSize $ffStill
              W ("{0}: {1:N1} KB, {2}" -f $ffStill, ((Get-Item $ffStill).Length / 1KB), $(if ($stillWH) { $stillWH } else { 'size unreadable' }))
              W ("still size: {0} (the display this run captures is {1}x{2})" -f $(if ($stillWH) { $stillWH } else { 'unreadable' }), $capW, $capH)
              V ("SPIKE-Q2: ffmpeg-still=OK ({0:N1} KB{1})" -f ((Get-Item $ffStill).Length / 1KB), $(if ($stillWH) { ', ' + $stillWH } else { '' }))
            } else {
              V "SPIKE-Q2: ffmpeg-still=FAILED (no PNG written)"
            }
          }

          W ""
          W "=== cleaning up ==="
          Get-Process -Name 'UltiMaker-Cura' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          if ($died) {
            V "SPIKE-Q1: launch=FAILED (the process exited during the waits - see the launch lines)"
          } elseif ($glHits.Count -gt 0) {
            # alive, but the only window was the probe dialog: calling that a
            # successful launch is the same false green the video verdict had
            V "SPIKE-Q1: launch=RUNNING-BUT-BLOCKED (alive, but its window is the OpenGL probe dialog - see gl= above)"
          } elseif ($realTitle -and (-not (Test-ProbeTitle "$title"))) {
            V "SPIKE-Q1: launch=OK (a real window was up: '$realTitle')"
          } else {
            # Being alive is not being launched: the first run's process was
            # alive as well, and its only window was the block. OK now needs a
            # window of its own, whatever else the process was doing.
            V "SPIKE-Q1: launch=RUNNING-NO-WINDOW (alive after the ${WAIT_SECS} s wait and the ${BOOT_SECS} s boot wait, but no window of its own - see the title samples above)"
          }
          exit 0

      - name: "Q3 evidence: the dependency audit table"
        # The port's provisioning checklist: one row per external
        # dependency this leg touched, whether the image already had it,
        # and the version - so the port knows what it must install on each
        # OS instead of rediscovering the gaps. Runs under always() so a
        # failed leg still ships the table.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          TSV="$EVIDENCE/dependency-audit.tsv"
          TXT="$EVIDENCE/dependency-audit.txt"
          PLATFORM="${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          {
            echo "dependency audit - $PLATFORM"
            echo "generated: $(date -u)"
            echo
            if [ -s "$TSV" ]; then
              echo "| Component | Role | Status | Version | Notes |"
              echo "|---|---|---|---|---|"
              awk -F'\t' 'NR>1 { printf "| %s | %s | %s | %s | %s |\n", $2, $3, $4, $5, $6 }' "$TSV"
              echo
              echo "status: PREINSTALLED = the image already had it; INSTALLED BY US ="
              echo "missing at start and provisioned by this run; ABSENT = neither."
            else
              echo "(no audit rows were recorded)"
            fi
          } 2>&1 | tee "$TXT"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat "$TXT" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || \
              echo "(could not append the table to the step summary)"
          fi
          INSTALLED=0
          UNRESOLVED=0
          if [ -s "$TSV" ]; then
            STATS="$(awk -F'\t' 'NR>1 { if ($4=="INSTALLED BY US") i++; else if ($4=="ABSENT") a++ } END { printf "%d %d", i+0, a+0 }' "$TSV" 2>/dev/null)"
            INSTALLED="${STATS%% *}"
            UNRESOLVED="${STATS##* }"
          fi
          MISSING=$(( ${INSTALLED:-0} + ${UNRESOLVED:-0} ))
          printf 'SPIKE-Q3: deps missing-at-start=%s, installed=%s (unresolved=%s)\n' \
            "$MISSING" "${INSTALLED:-0}" "${UNRESOLVED:-0}" >>"$EVIDENCE/verdict.txt"
          echo "SPIKE-Q3: deps missing-at-start=$MISSING, installed=${INSTALLED:-0} (unresolved=${UNRESOLVED:-0})"
          exit 0

      - name: Print the verdict and the evidence tree
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== spike verdict ====="
          cat "$EVIDENCE/verdict.txt" 2>/dev/null || echo "(no verdict lines)"
          echo "===== evidence tree ====="
          find "$EVIDENCE" -type f 2>/dev/null | while read -r f; do
            echo "$(du -h "$f" | cut -f1)  $f"
          done
          exit 0

      - name: "Q2 evidence: keep Cura's own log (Windows)"
        # Cura's own log is the single most diagnostic file it writes, and the
        # run that fails is the run that needs it kept. A step of its own,
        # under always(), so it still runs when the launch step above died
        # outright - a step that dies takes its own harvest with it. The
        # storage roots, the version segment under them and the root spelling
        # are all searched rather than assumed, every version directory found
        # and the rotated cura.log.1 are kept (the project sweeps 5.7 up, so
        # nothing here may be written down for one version), and "there is no
        # cura.log" is itself reported as a finding.
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $EVIDENCE = $env:EVIDENCE
          New-Item -ItemType Directory -Force $EVIDENCE | Out-Null
          $log = Join-Path $EVIDENCE 'cura-log-harvest-windows.txt'
          function W($m) { Write-Host $m; Add-Content -Path $log -Value $m }
          # The version this run pinned is read from the workflow's own input,
          # never written down here. The storage root carries a version
          # segment that moves with it (cura\5.7 ... cura\5.13) and the root
          # spelling is not fixed across that range either, so both are
          # discovered per file rather than assumed; the run's own version is
          # the one whose log also lands under the plain cura.log.
          $curaVer = $env:CURA_VERSION
          $verSeg = ''
          if ($curaVer -and ($curaVer -match '^([0-9]+\.[0-9]+)')) { $verSeg = $Matches[1] }
          $verNote = if ($curaVer) { $curaVer } else { 'unset' }
          $segNote = if ($verSeg) { $verSeg } else { 'unknown' }
          W "cura_version input: $verNote (version segment: $segNote)"
          # Cura builds its storage path from the per-user app data root
          # (Resources.getStoragePath); the local app data root is the older
          # spelling, and the directory name under it varies across the
          # versions this spike ranges over (cura, Cura, UltiMaker Cura), so
          # both roots are swept rather than one being picked and hoped for.
          $bases = @()
          foreach ($e in @('APPDATA', 'LOCALAPPDATA')) {
            $v = [System.Environment]::GetEnvironmentVariable($e)
            if ($v) { $bases += $v }
          }
          $found = @()
          foreach ($base in $bases) {
            W "searching: $base"
            if (-not (Test-Path $base)) { W "  absent on this runner"; continue }
            foreach ($name in @('cura', 'Cura', 'UltiMaker Cura', 'Ultimaker Cura')) {
              $cand = Join-Path $base $name
              if (Test-Path $cand) { W "  root spelling present: $cand" }
            }
            $hits = Get-ChildItem -Path $base -Recurse -Depth 4 -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'cura.log*' } |
              Select-Object -First 50 -ExpandProperty FullName
            foreach ($h in $hits) { $found += $h }
          }
          $found = @($found | Sort-Object -Unique)
          if ($found.Count -eq 0) {
            W "FINDING: no cura.log (rotated cura.log.1 included) under $($bases -join ', ') at depth 4, any root spelling - Cura's own loggers had not started, which is what a probe failure looks like (it dies before them), or Cura never ran at all"
            exit 0
          }
          $i = 0
          foreach ($f in $found) {
            $i++
            $seg = Split-Path -Leaf (Split-Path -Parent $f)
            if ($seg -notmatch '^[0-9]+\.[0-9]+') { $seg = 'unversioned' }
            $sfx = (Split-Path -Leaf $f).Substring(8)   # 'cura.log' is 8 chars: '' or '.1'
            $dest = Join-Path $EVIDENCE ("cura-{0}.log{1}" -f $seg, $sfx)
            if (Test-Path $dest) { $dest = Join-Path $EVIDENCE ("cura-{0}-{1}.log{2}" -f $seg, $i, $sfx) }
            W ("found: {0} ({1:N0} bytes)" -f $f, (Get-Item $f).Length)
            $ok = $false
            try { Copy-Item -Path $f -Destination $dest -Force -ErrorAction Stop; $ok = $true }
            catch { W "copy failed: $($_.Exception.Message)" }
            if (-not $ok) {
              # Cura can still hold the file open; a read-and-write copy keeps
              # the log rather than losing it to a sharing violation.
              try {
                [System.IO.File]::WriteAllText($dest, (Get-Content $f -Raw -ErrorAction Stop))
                $ok = $true
              } catch { W "the read-and-write copy failed too: $($_.Exception.Message)" }
            }
            if ($ok) { W "kept: $dest" } else { W "NOT KEPT: $f" }
            $alias = Join-Path $EVIDENCE 'cura.log'
            if ($ok -and $verSeg -and ($seg -eq $verSeg) -and ($sfx -eq '') -and (-not (Test-Path $alias))) {
              if (Copy-Item -Path $dest -Destination $alias -ErrorAction SilentlyContinue) {
                W "  this run's version ($verSeg): the same log is also kept as cura.log (the first log found for it)"
              }
            }
          }
          W "cura.log harvest: $($found.Count) file(s) found, kept beside the rest of the evidence"
          exit 0

      - name: "Q2 evidence: keep Cura's own log (macOS)"
        # The same requirement on the macOS leg, and the same placement: its
        # own step under always(), so it runs whatever the launch step did.
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          LOG="$EVIDENCE/cura-log-harvest-macos.txt"
          {
            echo "=== Cura's own log (the macOS storage roots) ==="
            # Cura's storage path is ~/Library/Application Support/<root>/
            # <version>/cura.log. Neither the root spelling nor the version
            # segment is fixed across the versions this spike ranges over
            # (5.7 up: cura, Cura and UltiMaker Cura all appear), so both are
            # discovered rather than assumed; every version directory found
            # is harvested rather than only the newest, since one tree can
            # hold more than one; and the rotated cura.log.1 is kept too
            # (FileLogger is a RotatingFileHandler, so it is a real file).
            # The version this run pinned decides which log also lands under
            # the plain cura.log - read from the workflow's input, never
            # written down here.
            VER_SEG=""
            case "${CURA_VERSION:-}" in
              [0-9]*.[0-9]*) VER_SEG="$(printf '%s' "${CURA_VERSION}" | cut -d. -f1,2)" ;;
            esac
            echo "cura_version input: ${CURA_VERSION:-unset} (version segment: ${VER_SEG:-unknown})"
            ROOT="$HOME/Library/Application Support"
            for name in cura Cura "UltiMaker Cura" "Ultimaker Cura"; do
              if [ -d "$ROOT/$name" ]; then echo "root spelling present: $ROOT/$name"; fi
            done
            FOUND="$(find "$ROOT" -maxdepth 5 -type f -name 'cura.log*' 2>/dev/null | sort)"
            if [ -z "$FOUND" ]; then
              echo "FINDING: no cura.log (rotated cura.log.1 included) under $ROOT at depth 5, any root spelling - Cura's own loggers had not started, which is what a probe failure looks like (it dies before them), or Cura never ran at all"
              exit 0
            fi
            i=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              i=$((i + 1))
              seg="$(basename "$(dirname "$f")")"
              case "$seg" in
                [0-9]*.[0-9]*) : ;;
                *) seg="unversioned" ;;
              esac
              sfx="${f##*/cura.log}"   # '' for cura.log, '.1' for cura.log.1
              dest="$EVIDENCE/cura-$seg.log$sfx"
              if [ -e "$dest" ]; then dest="$EVIDENCE/cura-$seg-$i.log$sfx"; fi
              echo "found: $f ($(wc -c <"$f" | tr -d ' ') bytes)"
              if cp "$f" "$dest" 2>/dev/null; then
                echo "kept: $dest"
                if [ -n "$VER_SEG" ] && [ "$seg" = "$VER_SEG" ] && [ -z "$sfx" ] &&
                   [ ! -e "$EVIDENCE/cura.log" ]; then
                  if cp "$f" "$EVIDENCE/cura.log" 2>/dev/null; then
                    echo "  this run's version ($VER_SEG): the same log is also kept as cura.log (the first log found for it)"
                  fi
                fi
              else
                echo "NOT KEPT: $f"
              fi
            done <<< "$FOUND"
            echo "cura.log harvest: $i file(s) found, kept beside the rest of the evidence"
          } 2>&1 | tee "$LOG"
          exit 0

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-native-${{ matrix.os }}
          path: spike-evidence/
          if-no-files-found: warn
          retention-days: 14
