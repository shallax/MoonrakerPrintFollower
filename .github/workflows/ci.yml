name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      tag_release:
        type: boolean
        default: false
      release_gate:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 3"


# Every python process in these jobs runs unbuffered. A step whose
# output lands only when the process exits is unreadable while it runs —
# and on a matrix of 51 legs that is most of the wait. Set as an
# environment variable rather than -u at each call site so it reaches
# the nested ones too (docker_dev.sh's container, the harness scripts).
env:
  PYTHONUNBUFFERED: "1"
  # Python's UTF-8 mode: on the Windows runners the default stdio codec
  # is cp1252, which cannot encode the tick and cross every verdict line
  # carries. This is the declarative half; the runners also reconfigure
  # their own streams so they hold wherever they are invoked.
  PYTHONUTF8: "1"
jobs:
  # The same native Makefile gate on both desktop OSes. The pinned font
  # keeps offscreen Qt layout measurements comparable with the Linux image.
  native-build:
    name: Native build (${{ matrix.os }})
    needs: lint
    if: ${{ !inputs.tag_release }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Mesa for headless Windows lighting captures
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-mesa
      - name: Select the capture-only OpenGL library
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "GLCONTEXT_WIN_LIBGL=$(cygpath -w /mingw64/bin/opengl32.dll)" >> "$GITHUB_ENV"
      - name: Pin the harness font (the dev container pins fonts-dejavu 2.37)
        shell: bash
        run: |
          # The dev container pins fonts-dejavu-core=2.37 so text metrics
          # are fixed. The runners carry no such pin, and their own fonts
          # are wider — which moves every text-driven layout these suites
          # measure (a frame laid out at the mount less its chrome, a
          # fold crossing that shifts with the typeface). The suites run
          # offscreen, where Qt's basic font database honours
          # QT_QPA_FONTDIR, so the same version is pinned here.
          #
          # Python owns the path: RUNNER_TEMP is a Windows-style path on
          # the Windows runner and bash would mangle its backslashes, so
          # the directory is created in native form and printed back.
          # stdlib only — unzip is not guaranteed on either runner.
          #
          # RUNNER_TEMP, never tempfile.gettempdir(): on the Windows
          # runner the latter answers with the 8.3 SHORT form
          # (C:\Users\RUNNER~1\AppData\Local\Temp), and Qt's font loader
          # then finds no usable font at all — the failing leg rendered
          # every glyph as an empty box, which is what widened its
          # layout (the frame census read 108 px against this
          # container's 88). macOS is green with the same pin, so the
          # mechanism is sound and the path is the fault.
          dir="$(python - <<'PY'
          import io, os, sys, urllib.request, zipfile

          url = ("https://github.com/dejavu-fonts/dejavu-fonts/releases/"
                 "download/version_2_37/dejavu-fonts-ttf-2.37.zip")
          target = os.path.join(
              os.environ.get("RUNNER_TEMP") or os.environ.get("TMPDIR") or "/tmp",
              "mpf-fonts")
          os.makedirs(target, exist_ok=True)
          blob = urllib.request.urlopen(url, timeout=60).read()
          archive = zipfile.ZipFile(io.BytesIO(blob))
          written = []
          for name in archive.namelist():
              base = os.path.basename(name)
              if base.startswith("DejaVuSans") and base.endswith(".ttf"):
                  with open(os.path.join(target, base), "wb") as handle:
                      handle.write(archive.read(name))
                  written.append(base)
          if not written:
              raise SystemExit("no DejaVuSans ttf in the release archive")
          sys.stderr.write("pinned: %s\n" % ", ".join(sorted(written)))
          sys.stdout.write(target)
          PY
          )"
          echo "font dir: $dir"
          test -n "$dir" || { echo "::error::the font pin produced no directory"; exit 1; }
          echo "QT_QPA_FONTDIR=$dir" >> "$GITHUB_ENV"

      - name: Install GNU make
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Install native toolchain
        run: make dev_install
      - name: Build and run full test suite
        env:
          MPF_SCRATCH: ${{ runner.temp }}/mpf
        run: make build JOBS=2
      - name: Verify capture determinism
        run: make verify_captures
      - name: Build and verify packages
        run: make package
      - name: Upload native capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-captures-${{ matrix.os }}
          path: |
            dist/screenshots/
            .determinism-check/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload native test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/mpf/mpf-tests.*/*.log
          if-no-files-found: ignore

  harness-smoke:
    # Two smoke runs in one container verify that Cura still boots after
    # the first run's owner-only writes. The gate tests one fresh boot.
    name: Cura repeat-boot smoke
    needs: [ci-package, native-build, python-compatibility]
    if: ${{ !inputs.tag_release }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download tested plugin package
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: dist/
      - name: Log in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run the smoke set
        env:
          HARNESS_DIR: ${{ runner.temp }}/mpf
          MPF_WORK_DIR: ${{ runner.temp }}/mpf
        run: ./tools/harness_smoke.sh
      - name: Collect the smoke galleries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-smoke-galleries
          path: ${{ runner.temp }}/mpf/ui-artifacts/runs/
          if-no-files-found: ignore

  lint:
    name: Lint
    if: ${{ !inputs.tag_release }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Runner images include third-party apt sources that these jobs do
      # not need. Their indexes have independently failed apt-get update
      # (Google Chrome hash mismatch and Microsoft 26.04 HTTP 403), so
      # remove them before using the Ubuntu archive. Keep the workaround
      # shared across all jobs that update apt.
      - &drop_unused_apt_sources
        name: Drop unused third-party apt sources
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -qE "dl.google.com|packages.cloud.google.com|packages.microsoft.com" "$f"; then sudo rm -f "$f"; fi
          done

      - name: Install qmlformat and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools shellcheck

      - name: Install ruff
        run: python -m pip install ruff

      - name: Compile Python sources
        run: python -m compileall -q mpf tools tests

      - name: QML structural sanity
        run: python tools/check_qml.py mpf

      - name: QML formatting
        run: sh tools/check_qml_format.sh mpf

      - name: Ruff
        run: ruff check mpf tools tests

      - name: Shell scripts
        run: shellcheck tools/*.sh

      - name: Workflow files
        run: |
          # The workflow files themselves are linted: an invalid input
          # once made GitHub reject ci.yml before spawning any job,
          # and the failure had no log to read.
          wget -qO /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Dockerfile
        run: |
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile

      - &install_gitleaks
        name: Install gitleaks
        run: |
          # Pinned to the dev container; the runner image ships no
          # preinstalled binary. Artifact scanning reuses this step.
          wget -qO /tmp/gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            && tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks \
            && rm /tmp/gitleaks.tar.gz

      - name: Scan for secrets
        run: gitleaks detect --no-git --no-banner --redact .

  python-compatibility:
    name: Python ${{ matrix.python-version }} and Qt runtime
    needs: lint
    if: ${{ !inputs.tag_release }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q mpf tools tests

      # Shared step: the drop_unused_apt_sources anchor defined in the
      # lint job's steps above.
      - *drop_unused_apt_sources

      - &install_qt_runtime
        name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libglx-mesa0 xvfb xauth
          # Match the native and pinned-container suites: without NumPy,
          # the bed-mesh tests skip and GPU packing takes only its fallback.
          python -m pip install PyQt6==6.11.0 numpy

      - name: Run all discovered tests with the real Qt runtime
        if: matrix.python-version != '3.12'
        run: |
          python -c "from PyQt6.QtCore import QCoreApplication"
          xvfb-run -a env QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 MPF_REQUIRE_OFFSCREEN_GL=1 JOBS=2 LEGS=host tools/run_tests.sh

      - name: Install coverage
        if: matrix.python-version == '3.12'
        run: python -m pip install coverage

      - name: Run all discovered tests under coverage
        if: matrix.python-version == '3.12'
        env:
          # The four harness modules are part of this run. Their runner.py
          # lives beside the tests, and dotted imports otherwise hide it.
          PYTHONPATH: tests/harness
          # coverage's ctrace core is the default below 3.14 and cannot see
          # Python that Qt's worker threads call into — the renderer's raster
          # jobs. Those lines then report as missing on every run. sysmon
          # measures them, so the gate reads the code that ran.
          COVERAGE_CORE: sysmon
        run: |
          python -c "from PyQt6.QtCore import QCoreApplication"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 MPF_REQUIRE_OFFSCREEN_GL=1 python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          modules = [".".join(path.with_suffix("").parts)
                     for path in sorted(Path("tests").rglob("test_*.py"))]
          destination = str(Path(os.environ["RUNNER_TEMP"]) / "coverage")
          subprocess.run([sys.executable, "tools/run_some.py", "--jobs", "2",
                          "--coverage-dir", destination, *modules], check=True)
          PY
          coverage combine "$RUNNER_TEMP/coverage"
          coverage report --include="mpf/*" --fail-under=95
          coverage json -o coverage.json
          python tools/check_per_file_coverage.py coverage.json
          coverage xml --include="mpf/*"

      - name: Upload Python 3.12 coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Write Python 3.12 JUnit report
        if: matrix.python-version == '3.12'
        run: python tools/unittest_junit.py

      - name: Upload Python 3.12 test results to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests.junit.xml
          report_type: test_results

  ci-package:
    name: Build package
    needs: lint
    if: ${{ !cancelled() && (inputs.tag_release || needs.lint.result == 'success') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: QML structural sanity
        if: inputs.tag_release
        run: python tools/check_qml.py mpf

      # Use the real Qt runtime for the tag's full-suite gate too. Branch
      # and PR runs additionally exercise it in the Python-version matrix.
      - *drop_unused_apt_sources

      - *install_qt_runtime

      - name: Run all discovered tests
        if: inputs.tag_release
        run: |
          python -c "from PyQt6.QtCore import QCoreApplication"
          QT_QPA_PLATFORM=offscreen JOBS=2 PYTHON=python LEGS=host tools/run_tests.sh

      - name: Install package toolchain
        run: python -m pip install PySide6-Addons==6.10.2

      - name: Build and verify packages
        run: python tools/native/dev.py package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 30

  screenshot-sync:
    name: Screenshot sync
    needs: lint
    if: ${{ !inputs.tag_release }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the pinned capture image
        # Through the retrying helper: this step's apt install is the
        # one that fails on a bad mirror, and a red image build here
        # reads as a stale-screenshot failure it has nothing to do with.
        run: ./tools/build_image.sh moonraker-print-follower-dev .

      - name: Regenerate screenshots in the canonical container
        # The dev container pins the toolchain (Qt, fonts) that makes the
        # captures byte-stable, so the committed copies can be compared
        # against a fresh render on every push. The host-user/bind-mount
        # incantation lives in tools/docker_dev.sh.
        run: |
          DOCKER_DEFAULT_PLATFORM=linux/amd64 tools/docker_dev.sh sh tools/run_captures.sh dist/screenshots
      - name: Verify capture determinism
        # Two runs in the same container must be byte-identical: the
        # committed-compare above only has a CHANCE of catching a
        # phase-dependent leak (a blinking caret, a ticking clock);
        # this catches it deterministically. The harness freezes every
        # live input, so any difference means a new one leaked in.
        run: ./tools/verify_capture_determinism.sh

      - name: Reject stale committed screenshots
        # Native and emulated CPUs round a few SVG antialias pixels
        # differently. Same-host determinism above remains byte-exact.
        run: |
          DOCKER_DEFAULT_PLATFORM=linux/amd64 tools/docker_dev.sh python3 tools/compare_screenshots.py screenshots dist/screenshots

      - name: Preserve failed screenshot comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-comparison
          path: |
            dist/screenshots/*.png
            .determinism-check/run*/*.png
            .determinism-check/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  analyze:
    name: Analyze (CodeQL)
    needs: lint
    if: ${{ !inputs.tag_release }}
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  artifact-scan:
    name: Scan release artifacts
    needs: ci-package
    # A tag intentionally skips lint, which is ci-package's predecessor.
    # Override the implicit success() check so that skip cannot propagate
    # through a successful ci-package and suppress this scan.
    if: >-
      ${{ !cancelled() && needs.ci-package.result == 'success' &&
      (github.event_name == 'pull_request' || inputs.release_gate) }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: dist/

      - *install_gitleaks

      - name: Scan the release artifacts for secrets
        run: |
          gitleaks detect --no-git --no-banner --redact .

  gate:
    permissions:
      contents: read
      packages: read
    needs: [artifact-scan, native-build, python-compatibility, harness-smoke]
    # The PR waits for native builds and all Linux Qt suites; the Python
    # 3.12 matrix leg also enforces coverage. Tag releases skip those jobs;
    # ci-package runs its Python 3.11 Qt suite before artifact-scan succeeds.
    if: >-
      ${{ !cancelled() && needs.artifact-scan.result == 'success' &&
      (inputs.tag_release ||
      (github.event_name == 'pull_request' &&
      needs.native-build.result == 'success' &&
      needs.python-compatibility.result == 'success' &&
      needs.harness-smoke.result == 'success')) }}
    # Every unit runs on every platform a user can run Cura on. The Linux leg
    # is unchanged; the native legs install Cura themselves and pay for it, so
    # the timeout is sized for a cold install rather than the container's
    # cached image.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
        unit:
          - smoke-primary
          - group-connection
          - group-status
          - group-temperatures
          - group-console
          - group-webcams
          - group-files
          - group-motion
          - group-printing
          - group-settings
          - group-visual
          - group-preview
          - group-probe
          - group-configure
          - group-stress
          - smoke-secondary
          - firstinstall
    env:
      HARNESS_CONTAINER: mpf-cura-gate-${{ matrix.unit }}
      UNITS: '{"group-connection": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "connection"}, "group-console": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "console"}, "group-files": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "files"}, "group-motion": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "motion"}, "group-preview": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "preview"}, "group-printing": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "printing"}, "group-probe": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "probe"}, "group-settings": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "settings"}, "group-status": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "status"}, "group-configure": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "configure"}, "group-stress": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "stress"}, "group-temperatures": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "temperatures"}, "group-visual": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "visual"}, "group-webcams": {"mode": "suite", "budget": 15, "cura": "5.13.0", "group": "webcams"}, "smoke-primary": {"mode": "suite", "budget": 20, "cura": "5.13.0", "group": "smoke"}, "smoke-secondary": {"mode": "suite", "budget": 20, "cura": "5.12.0", "group": "smoke"}, "firstinstall": {"mode": "firstinstall", "budget": 10, "cura": "5.13.0"}}'
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Where this job's gallery lands. One definition, because the
      # native scripts write it and the upload reads it back — the two
      # must not drift. Forward slashes keep the same runner-temp value
      # valid for Bash, PowerShell and upload-artifact.
      - name: Set the gallery root
        shell: bash
        run: |
          temp="${RUNNER_TEMP//\\//}"
          root="$temp/mpf/ui-artifacts"
          echo "GALLERY=$root/runs/${{ github.run_id }}/${{ matrix.unit }}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "MPF_WORK_DIR=$temp/mpf" >> "$GITHUB_ENV"
            echo "CURA_VERSIONS_DIR=$temp/mpf/cura_versions" >> "$GITHUB_ENV"
          else
            echo "MPF_WORK_DIR=$temp/mpf-native" >> "$GITHUB_ENV"
          fi

      # Test exactly the package built and scanned by ci-package. Native
      # package construction is covered separately by native-build.
      - name: Download verified plugin package
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: dist/

      # Everything below is the container leg's alone: the native legs
      # install Cura themselves, so a Cura tree fetch and a harness image
      # would be wasted work (and there is no docker on macOS).
      - name: Restore the pinned Cura tree
        if: runner.os == 'Linux'
        id: cura-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mpf/cura_versions
          key: mpf-cura-${{ fromJSON(env.UNITS)[matrix.unit].cura }}

      - name: Fetch the pinned Cura
        if: runner.os == 'Linux'
        run: python3 tools/fetch_cura.py "${{ fromJSON(env.UNITS)[matrix.unit].cura }}"

      - name: Pull the harness image and start the container
        if: runner.os == 'Linux'
        run: |
          # PR runs have no pushed image for this sha; the build is the
          # fallback. The push itself is gated to dispatch/tag runs,
          # where the token can write packages.
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
          # Pull the published image rather than rebuilding it. The sha tag
          # exists only for runs that pushed one, and the push is gated to
          # non-PR runs, so on a PR that pull could only ever fail and every
          # Linux leg fell through to a docker build that runs apt-get against
          # the live archives: seventeen rolls of those dice per run, and one
          # hiccup killed a leg before it ran anything.
          #
          # But pulling always would mean a Dockerfile change is never
          # exercised, so a PR that touches tools/harness builds regardless.
          # If the base commit cannot be read, build too - that is the safe
          # direction, because it keeps the image covered.
          HARNESS_CHANGED=yes
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            # "unchanged" is only claimed when the base is READABLE and the
            # diff actually ran. A failed fetch that still resolves locally
            # would otherwise skip the diff and report unchanged, which is
            # the unsafe direction.
            if [ -n "$BASE" ] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null \
               && git rev-parse -q --verify "$BASE^{commit}" >/dev/null 2>&1; then
              if git diff --name-only "$BASE" HEAD -- tools/harness | grep -q .; then
                echo "tools/harness changed in this PR - the image must be built"
              else
                echo "tools/harness unchanged in this PR - the published image is used"
                HARNESS_CHANGED=no
              fi
            else
              echo "could not read the base commit - building, so the image stays covered"
            fi
          fi
          # The build's first line is apt-get against the LIVE archives,
          # and one hiccup there fails the leg before it has run anything:
          # measured twice in one matrix at 14:27 and 14:30, "process
          # apt-get update && apt-get install ... did not complete
          # successfully: exit code 100", each a 37-second job with no
          # gallery. The image is deterministic; only the fetch is not, so
          # the build is retried rather than re-rolled. A failed build
          # leaves no partial state, which is what makes the retry safe.
          build_image() {
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if docker build -q -t mpf-cura-harness tools/harness; then
                return 0
              fi
              echo "the harness image build failed (attempt $attempt of 3) - retrying"
              attempt=$((attempt + 1))
              sleep $((attempt * 10))
            done
            return 1
          }
          if [ "$HARNESS_CHANGED" = yes ]; then
            build_image
          elif docker pull "ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }}" >/dev/null 2>&1; then
            docker tag "ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }}" mpf-cura-harness
          elif docker pull "ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:latest" >/dev/null 2>&1; then
            echo "pulled the published :latest harness image (no image for this sha)"
            docker tag "ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:latest" mpf-cura-harness
          else
            echo "no published harness image was reachable - building from tools/harness, which needs the apt archive"
            build_image
          fi
          docker rm -f "$HARNESS_CONTAINER" >/dev/null 2>&1 || true
          container_dir="$(tools/ui_test_paths.sh container "$MPF_WORK_DIR" "$MPF_WORK_DIR")"
          docker run -d --init --name "$HARNESS_CONTAINER" --cap-add=SYS_PTRACE \
              -v "$MPF_WORK_DIR:$container_dir" mpf-cura-harness sleep infinity

      # One attempt per unit (the gate ruling): a retried unit would
      # hide flakiness. The gallery is the proof — every unit's
      # evidence lands under this workflow run's root.
      # The Linux leg is the original path, unchanged: the harness container
      # already holds Cura, so the budget covers the scenario alone.
      - name: Run the unit (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          mkdir -p "$MPF_WORK_DIR"
          timeout "${{ fromJSON(env.UNITS)[matrix.unit].budget }}m" env \
              CURA_VERSION="${{ fromJSON(env.UNITS)[matrix.unit].cura }}" \
              MODE="${{ fromJSON(env.UNITS)[matrix.unit].mode }}" SCENARIO_GROUP="${{ fromJSON(env.UNITS)[matrix.unit].group }}" \
              RUN_DIR_NAME="$GALLERY" \
              ./tools/ui_test.sh

      # The native legs do their own setup: install Cura, seed it, stage the
      # plugin and the driver, launch, clamp the window. That is why they get
      # their own timeout - the gate's per-unit budget bounds the SCENARIO, and
      # on Linux the equivalent work happened in earlier steps. Charging a cold
      # 170 MB install to the scenario budget would report a slow network as a
      # scenario failure.
      - name: Set up the native harness (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        shell: bash
        env:
          SCENARIO: ${{ fromJSON(env.UNITS)[matrix.unit].group || fromJSON(env.UNITS)[matrix.unit].mode }}
        run: |
          RUN_DIR_NAME="$GALLERY" \
            bash tools/native_harness.sh macos "${{ fromJSON(env.UNITS)[matrix.unit].cura }}" "$SCENARIO"

      - name: Run the unit (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: ${{ fromJSON(env.UNITS)[matrix.unit].budget }}
        shell: bash
        run: |
          set -euo pipefail
          . "$MPF_WORK_DIR/harness_env.sh"
          # The gallery is the runner's own output, so the guard sits after
          # it: the upload below is `if: always()`, and a run that produced
          # no gallery would otherwise ship a green job with an empty
          # artefact. The runner's verdict still decides the exit code.
          # -u: the step can be killed at its timeout, and block-buffered
          # stdout dies with the process - the only macOS run so far left
          # nothing on stdout but ffmpeg's retries, so what the runner was
          # waiting for could not be read off the log.
          rc=0
          python3 -u tests/harness/runner.py ${{ fromJSON(env.UNITS)[matrix.unit].mode }} ${{ fromJSON(env.UNITS)[matrix.unit].group }} || rc=$?
          test -s "$HARNESS_RUN_DIR/index.html" || { echo "EVIDENCE MISSING - no gallery at $HARNESS_RUN_DIR"; exit 1; }
          exit "$rc"

      # The Windows legs re-downloaded the Cura installer on every one of
      # the seventeen, and re-probed the release for it: measured at
      # 134-180 s of a 219-341 s job, more than half of every Windows leg.
      # The installer is the same file for every unit on a version, so it
      # is cached beside the machine, exactly as the container leg caches
      # its pinned Cura tree. native_harness.ps1 still verifies the
      # signature of whatever it finds, so a cached installer is trusted
      # no further than a fresh one.
      - name: Cache the Windows Cura installer
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cura-installers
          key: mpf-win-installer-${{ fromJSON(env.UNITS)[matrix.unit].cura }}

      - name: Set up the native harness (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: powershell
        env:
          SCENARIO: ${{ fromJSON(env.UNITS)[matrix.unit].group || fromJSON(env.UNITS)[matrix.unit].mode }}
        run: |
          # The step's shell sets $ErrorActionPreference = 'Stop', under which
          # a native command's stderr - the setup script's own warnings, for
          # instance - is a TERMINATING error in PowerShell 5.1. The exit code
          # below is the verdict, so the preference is relaxed for the call.
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'mpf-native'
          $env:RUN_DIR_NAME = $env:GALLERY
          & powershell -ExecutionPolicy Bypass -File tools\native_harness.ps1 `
              -CuraVersion "${{ fromJSON(env.UNITS)[matrix.unit].cura }}" `
              -Scenario "$env:SCENARIO" -WorkDir $work
          if ($LASTEXITCODE -ne 0) { throw "native_harness.ps1 failed with exit $LASTEXITCODE" }

      - name: Run the unit (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: ${{ fromJSON(env.UNITS)[matrix.unit].budget }}
        shell: powershell
        run: |
          # A 15-minute scenario writes plenty to stderr, and under the
          # step shell's $ErrorActionPreference = 'Stop' the FIRST such byte
          # from a native command terminates the step in PowerShell 5.1 -
          # before the exit code or the gallery guard below are ever read.
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'mpf-native'
          . (Join-Path $work 'harness_env.ps1')
          # The gallery is the runner's own output, so the guard sits after
          # it: the upload below is `if: always()`, and a run that produced
          # no gallery would otherwise ship a green job with an empty
          # artefact. The runner's verdict still decides the exit code.
          # -u for the same reason as macOS: a step killed at its timeout
          # takes its block-buffered stdout with it.
          $rc = 0
          & python -u tests\harness\runner.py "${{ fromJSON(env.UNITS)[matrix.unit].mode }}" "${{ fromJSON(env.UNITS)[matrix.unit].group }}"
          if ($LASTEXITCODE -ne 0) { $rc = $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:HARNESS_RUN_DIR 'index.html'))) {
            Write-Error "EVIDENCE MISSING - no gallery at $env:HARNESS_RUN_DIR"; exit 1
          }
          if ($rc -ne 0) { throw "runner.py failed with exit $rc" }

      # The verdict panel for this job's page. GitHub shows a job as a
      # name and a dot; the leg's own log buries the outcome under a
      # hundred progress lines, so the summary states it first and the
      # detail under it. `always()` because a failed leg is exactly when
      # this matters most.
      - name: Summarise the unit
        if: always()
        shell: bash
        run: python tools/gate_summary.py "$GALLERY" "${{ matrix.os }} ${{ matrix.unit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unit's gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # the OS is in the name: 51 galleries, and two units of the same
          # name on different platforms must not collide
          name: gate-${{ matrix.unit }}-${{ matrix.os }}
          path: ${{ env.GALLERY }}
          if-no-files-found: error

  release-verdict:
    name: Require completed release checks
    needs: [ci-package, artifact-scan, gate, cad-runtime-smoke]
    # Run even when a dependency failed or was skipped. A skipped verdict
    # would otherwise let the reusable workflow report success and publish.
    if: ${{ !cancelled() && inputs.tag_release }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Require package, artifact scan, Cura gate and CAD runtime success
        env:
          MPF_RELEASE_PACKAGE_RESULT: ${{ needs.ci-package.result }}
          MPF_RELEASE_SCAN_RESULT: ${{ needs.artifact-scan.result }}
          MPF_RELEASE_GATE_RESULT: ${{ needs.gate.result }}
          MPF_RELEASE_CAD_RESULT: ${{ needs.cad-runtime-smoke.result }}
        run: python tools/release_verdict.py

  cad-runtime-smoke:
    name: CAD import (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    # Tag releases deliberately skip lint; CAD conversion must still run.
    if: ${{ !cancelled() && (inputs.tag_release || needs.lint.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install geometry and host coverage dependencies
        run: python -m pip install numpy coverage==7.16.2
      - name: Verify pinned CAD runtime, coloured STEP fixtures and isolated worker coverage
        run: python tools/test_cad_runtime.py --runtime-root "${{ runner.temp }}/mpf/cad-smoke" --coverage-worker
