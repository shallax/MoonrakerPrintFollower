name: Apply v3 runtime fixes

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply-runtime-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Apply layer ETA and Preview UX fixes
        run: |
          echo '' | base64 -d | gzip -dc > /tmp/apply_v3_runtime_fixes.py
          python /tmp/apply_v3_runtime_fixes.py

      - name: Verify focused and core regressions
        run: |
          python -m py_compile plugins/*.py tools/*.py
          python -m unittest \
            tests.test_core \
            tests.test_follow_controller \
            tests.test_index \
            tests.test_protocol \
            tests.test_printer_config \
            tests.test_source_contracts \
            tests.test_sdk_compatibility \
            tests.test_monitor_upload_regressions \
            tests.test_hotfix_regressions \
            tests.test_bed_mesh \
            tests.test_v3_followup_regressions

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-v3-runtime-fixes.yml

      - name: Commit runtime fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix layer tracking ETA and Preview scrub timing"
          git push origin HEAD:v3-unified-moonraker
