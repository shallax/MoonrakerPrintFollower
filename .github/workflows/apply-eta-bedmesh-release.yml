name: Apply ETA and bed mesh release polish

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run ETA and bed mesh release polish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply release polish
        run: |
          python tools/apply_eta_bedmesh_release.py
          python - <<'PY'
          from pathlib import Path

          path = Path("plugins/MoonrakerMonitorTypedControls.py")
          text = path.read_text(encoding="utf-8")
          if "import shlex\n" not in text:
              text = text.replace("import re\n", "import re\nimport shlex\n", 1)
          start = text.index("    @pyqtSlot(str)\n    def loadBedMeshProfile")
          end = text.index("    @pyqtProperty(int, notify=typedControlsChanged)", start)
          replacement = (
              "    @pyqtSlot(str)\n"
              "    def loadBedMeshProfile(self, profile_name: str) -> None:\n"
              "        name = str(profile_name or \"\").strip()\n"
              "        if (\n"
              "            not name\n"
              "            or name not in self._bed_mesh_profile_names\n"
              "            or not self._has_bed_mesh\n"
              "            or not self.canRunSetup\n"
              "        ):\n"
              "            return\n"
              "        safe = shlex.quote(name)\n"
              "        self._send_gcode_action(f\"Load mesh {name}\", f\"BED_MESH_PROFILE LOAD={safe}\")\n"
              "\n"
              "    @pyqtSlot()\n"
              "    def clearBedMesh(self) -> None:\n"
              "        if self._has_bed_mesh and self.canRunSetup and self.bedMeshAvailable:\n"
              "            self._send_gcode_action(\"Clear bed mesh\", \"BED_MESH_CLEAR\")\n"
              "\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test_path = Path("tests/test_eta_bed_mesh_release.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "self.assertIn('BED_MESH_PROFILE LOAD=\"{safe}\"', TYPED)",
              "self.assertIn('BED_MESH_PROFILE LOAD={safe}', TYPED)",
          )
          test_text = test_text.replace(
              'self.assertIn("loadBedMeshProfile", TYPED)\n',
              'self.assertIn("loadBedMeshProfile", TYPED)\n        self.assertIn("shlex.quote(name)", TYPED)\n',
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Validate release candidate
        run: |
          python -m compileall -q plugins tools tests
          python tools/check_qml.py plugins
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/build_curapackage.py
          python tools/verify_curapackage.py dist/MoonrakerPrintFollower-v3.0.0.curapackage

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f tools/apply_eta_bedmesh_release.py
          rm -f tools/.run_eta_bedmesh_release
          rm -f .github/workflows/apply-eta-bedmesh-release.yml
          git add -A
          git commit -m "Restore live layer ETAs and expand bed mesh controls"
          git push origin HEAD:v3-unified-moonraker
