name: Apply ETA and bed mesh release polish

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run ETA and bed mesh release polish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply release polish
        run: python tools/apply_eta_bedmesh_release.py

      - name: Validate release candidate
        run: |
          python -m compileall -q plugins tools tests
          python tools/check_qml.py plugins
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/build_curapackage.py
          python tools/verify_curapackage.py dist/MoonrakerPrintFollower-v3.0.0.curapackage

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f tools/apply_eta_bedmesh_release.py
          rm -f tools/.run_eta_bedmesh_release
          rm -f .github/workflows/apply-eta-bedmesh-release.yml
          git add -A
          git commit -m "Restore live layer ETAs and expand bed mesh controls"
          git push origin HEAD:v3-unified-moonraker
