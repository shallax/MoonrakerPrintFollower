name: Apply v3 control fixes

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply-control-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Apply dynamic tuning, fixed emergency and Z-offset layout fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          controls = "plugins/MoonrakerMonitorControls.py"
          replace_once(
              controls,
              "            value = max(10, min(200, int(percent)))\n",
              "            # Klipper accepts speed factors above 200%. The UI expands its\n            # range from the accepted live value, so do not silently clamp it here.\n            value = max(10, int(percent))\n",
          )
          replace_once(
              controls,
              "            value = max(50, min(150, int(percent)))\n",
              "            # Match the self-expanding UI range rather than imposing the old\n            # 150% ceiling after the user has deliberately expanded it.\n            value = max(50, int(percent))\n",
          )

          qml = "plugins/MoonrakerMonitorDashboard.qml"
          replace_once(
              qml,
              '''                    anchors.fill: parent
                    anchors.margins: UM.Theme.getSize("default_margin").width
                    clip: true
''',
              '''                    anchors.top: parent.top
                    anchors.left: parent.left
                    anchors.right: parent.right
                    anchors.bottom: emergencyDock.top
                    anchors.topMargin: UM.Theme.getSize("default_margin").height
                    anchors.leftMargin: UM.Theme.getSize("default_margin").width
                    anchors.rightMargin: UM.Theme.getSize("default_margin").width
                    anchors.bottomMargin: UM.Theme.getSize("default_margin").height
                    clip: true
''',
          )

          old_z = '''                            RowLayout
                            {
                                Layout.fillWidth: true
                                spacing: 2 * screenScaleFactor
                                Repeater
                                {
                                    model: [-0.05, -0.025, -0.01, -0.005]
                                    Cura.SecondaryButton
                                    {
                                        Layout.fillWidth: true
                                        text: modelData.toFixed(3).replace(/0+$/, "").replace(/\\.$/, "")
                                        enabled: root.printer != null && !root.printer.actionBusy
                                        onClicked: root.printer.adjustZOffset(modelData)
                                    }
                                }
                            }
                            RowLayout
                            {
                                Layout.fillWidth: true
                                spacing: 2 * screenScaleFactor
                                Repeater
                                {
                                    model: [0.005, 0.01, 0.025, 0.05]
                                    Cura.SecondaryButton
                                    {
                                        Layout.fillWidth: true
                                        text: "+" + modelData.toFixed(3).replace(/0+$/, "").replace(/\\.$/, "")
                                        enabled: root.printer != null && !root.printer.actionBusy
                                        onClicked: root.printer.adjustZOffset(modelData)
                                    }
                                }
                            }
'''
          new_z = '''                            Column
                            {
                                id: zOffsetGrid
                                Layout.fillWidth: true
                                spacing: 2 * screenScaleFactor
                                property real buttonSpacing: 2 * screenScaleFactor
                                property real buttonWidth: (width - 3 * buttonSpacing) / 4

                                Row
                                {
                                    width: parent.width
                                    spacing: zOffsetGrid.buttonSpacing
                                    Repeater
                                    {
                                        model: [-0.005, -0.01, -0.025, -0.05]
                                        Cura.SecondaryButton
                                        {
                                            width: zOffsetGrid.buttonWidth
                                            height: UM.Theme.getSize("action_button").height
                                            fixedWidthMode: true
                                            text: modelData.toFixed(3).replace(/0+$/, "").replace(/\\.$/, "")
                                            enabled: root.printer != null && !root.printer.actionBusy
                                            onClicked: root.printer.adjustZOffset(modelData)
                                        }
                                    }
                                }
                                Row
                                {
                                    width: parent.width
                                    spacing: zOffsetGrid.buttonSpacing
                                    Repeater
                                    {
                                        model: [0.005, 0.01, 0.025, 0.05]
                                        Cura.SecondaryButton
                                        {
                                            width: zOffsetGrid.buttonWidth
                                            height: UM.Theme.getSize("action_button").height
                                            fixedWidthMode: true
                                            text: "+" + modelData.toFixed(3).replace(/0+$/, "").replace(/\\.$/, "")
                                            enabled: root.printer != null && !root.printer.actionBusy
                                            onClicked: root.printer.adjustZOffset(modelData)
                                        }
                                    }
                                }
                            }
'''
          replace_once(qml, old_z, new_z)

          p = Path(qml)
          text = p.read_text()
          emergency_start_marker = '''                        Rectangle { Layout.fillWidth: true; height: UM.Theme.getSize("default_lining").height; color: UM.Theme.getColor("lining") }
                        UM.Label { text: "Emergency"; font: UM.Theme.getFont("medium_bold") }
'''
          start = text.find(emergency_start_marker)
          if start < 0:
              raise SystemExit("Scrollable emergency section start was not found")
          note = 'text: "Each click must be within 1 second of the previous click. The third click stops the printer immediately."'
          note_pos = text.find(note, start)
          if note_pos < 0:
              raise SystemExit("Scrollable emergency help text was not found")
          note_end_marker = '''                            wrapMode: Text.WordWrap
                        }
'''
          end_start = text.find(note_end_marker, note_pos)
          if end_start < 0:
              raise SystemExit("Scrollable emergency section end was not found")
          end = end_start + len(note_end_marker)
          text = text[:start] + text[end:]
          p.write_text(text)

          text = p.read_text()
          flickable_marker = '''                Flickable
                {
                    id: controlFlick
'''
          block_start = text.find(flickable_marker)
          if block_start < 0:
              raise SystemExit("Control Flickable was not found")
          brace_start = text.find("{", block_start)
          depth = 0
          block_end = None
          in_string = False
          quote = ""
          escaped = False
          for i in range(brace_start, len(text)):
              ch = text[i]
              if in_string:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == quote:
                      in_string = False
                  continue
              if ch in ('"', "'"):
                  in_string = True
                  quote = ch
                  continue
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      block_end = i
                      break
          if block_end is None:
              raise SystemExit("Could not find end of control Flickable")

          dock = '''

                Column
                {
                    id: emergencyDock
                    z: 20
                    anchors.left: parent.left
                    anchors.right: parent.right
                    anchors.bottom: parent.bottom
                    anchors.leftMargin: UM.Theme.getSize("default_margin").width
                    anchors.rightMargin: UM.Theme.getSize("default_margin").width
                    anchors.bottomMargin: UM.Theme.getSize("default_margin").height
                    spacing: UM.Theme.getSize("thin_margin").height

                    Rectangle
                    {
                        width: parent.width
                        height: UM.Theme.getSize("default_lining").height
                        color: UM.Theme.getColor("lining")
                    }
                    UM.Label
                    {
                        width: parent.width
                        text: "Emergency"
                        font: UM.Theme.getFont("medium_bold")
                    }
                    Item
                    {
                        id: emergencyButton
                        width: parent.width
                        height: 46 * screenScaleFactor
                        property int clicks: root.printer != null ? root.printer.emergencyStopClicks : 0
                        Rectangle
                        {
                            anchors.fill: parent
                            radius: UM.Theme.getSize("default_radius").width
                            color: "transparent"
                            border.color: "#d32f2f"
                            border.width: 2 * screenScaleFactor
                            clip: true
                            Rectangle
                            {
                                anchors.left: parent.left
                                anchors.top: parent.top
                                anchors.bottom: parent.bottom
                                width: parent.width * Math.min(1.0, emergencyButton.clicks / 3.0)
                                color: "#d32f2f"
                            }
                            UM.Label
                            {
                                anchors.centerIn: parent
                                text: emergencyButton.clicks === 0 ? "EMERGENCY STOP — click 3 times" : "EMERGENCY STOP — " + emergencyButton.clicks + "/3"
                                font: UM.Theme.getFont("medium_bold")
                                color: "black"
                            }
                            MouseArea
                            {
                                anchors.fill: parent
                                cursorShape: Qt.PointingHandCursor
                                onClicked: if (root.printer != null) root.printer.emergencyStopClick()
                            }
                        }
                    }
                    UM.Label
                    {
                        width: parent.width
                        text: "Each click must be within 1 second of the previous click. The third click stops the printer immediately."
                        color: UM.Theme.getColor("text_inactive")
                        font: UM.Theme.getFont("default")
                        wrapMode: Text.WordWrap
                    }
                }
'''
          text = text[:block_end + 1] + dock + text[block_end + 1:]
          p.write_text(text)

          tests = "tests/test_v3_followup_regressions.py"
          replace_once(
              tests,
              '''    def test_live_tuning_slider_ranges_expand_from_accepted_value(self):
        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.speedFactorPercent * 2) : 200)", DASHBOARD_QML)
        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.flowFactorPercent * 2) : 200)", DASHBOARD_QML)
''',
              '''    def test_live_tuning_slider_ranges_expand_from_accepted_value(self):
        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.speedFactorPercent * 2) : 200)", DASHBOARD_QML)
        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.flowFactorPercent * 2) : 200)", DASHBOARD_QML)
        self.assertIn("value = max(10, int(percent))", CONTROLS)
        self.assertIn("value = max(50, int(percent))", CONTROLS)
        self.assertNotIn("min(200, int(percent))", CONTROLS)
        self.assertNotIn("min(150, int(percent))", CONTROLS)

    def test_z_offset_buttons_are_opposites_with_equal_click_zones(self):
        self.assertIn("id: zOffsetGrid", DASHBOARD_QML)
        self.assertIn("model: [-0.005, -0.01, -0.025, -0.05]", DASHBOARD_QML)
        self.assertIn("model: [0.005, 0.01, 0.025, 0.05]", DASHBOARD_QML)
        self.assertEqual(DASHBOARD_QML.count("width: zOffsetGrid.buttonWidth"), 2)
        self.assertGreaterEqual(DASHBOARD_QML.count("fixedWidthMode: true"), 2)

    def test_emergency_stop_is_pinned_outside_scrollable_controls(self):
        self.assertIn("anchors.bottom: emergencyDock.top", DASHBOARD_QML)
        self.assertIn("id: emergencyDock", DASHBOARD_QML)
        self.assertEqual(DASHBOARD_QML.count("id: emergencyButton"), 1)
''',
          )
          PY

      - name: Verify regressions
        run: |
          python -m py_compile plugins/*.py tools/*.py
          python -m unittest tests.test_core tests.test_follow_controller tests.test_index tests.test_protocol tests.test_printer_config tests.test_source_contracts tests.test_sdk_compatibility tests.test_monitor_upload_regressions tests.test_hotfix_regressions tests.test_bed_mesh tests.test_v3_followup_regressions

      - name: Commit control fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-control-fixes.yml
          git add plugins/MoonrakerMonitorControls.py plugins/MoonrakerMonitorDashboard.qml tests/test_v3_followup_regressions.py
          git commit -m "Fix dynamic tuning and pin emergency controls"
          git push origin HEAD:v3-unified-moonraker
