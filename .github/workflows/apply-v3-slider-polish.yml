name: Apply v3 slider polish

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply-slider-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Apply tuning, LED and emergency UI polish
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          qml = "plugins/MoonrakerMonitorDashboard.qml"

          replace_once(
              qml,
              '                                from: 10; to: 200; stepSize: 1\n',
              '                                from: 10\n                                to: Math.max(200, root.printer != null ? Math.ceil(root.printer.speedFactorPercent * 2) : 200)\n                                stepSize: 1\n',
          )
          replace_once(
              qml,
              '                                from: 50; to: 150; stepSize: 1\n',
              '                                from: 50\n                                to: Math.max(200, root.printer != null ? Math.ceil(root.printer.flowFactorPercent * 2) : 200)\n                                stepSize: 1\n',
          )

          led_header = '''                                ColumnLayout
                                {
                                    Layout.fillWidth: true
                                    spacing: UM.Theme.getSize("thin_margin").height

                                    RowLayout
'''
          led_header_new = '''                                ColumnLayout
                                {
                                    Layout.fillWidth: true
                                    spacing: UM.Theme.getSize("thin_margin").height

                                    function applyLedColour()
                                    {
                                        if (root.printer != null)
                                        {
                                            root.printer.setLedColor(
                                                modelData.object,
                                                Math.round(redSlider.value),
                                                Math.round(greenSlider.value),
                                                Math.round(blueSlider.value),
                                                modelData.hasWhite ? Math.round(whiteSlider.value) : 0,
                                                Math.round(ledSlider.value)
                                            )
                                        }
                                    }

                                    RowLayout
'''
          replace_once(qml, led_header, led_header_new)

          replace_once(
              qml,
              '                                        Slider { id: redSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.redPercent }\n',
              '                                        Slider { id: redSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.redPercent; onPressedChanged: if (!pressed) applyLedColour() }\n',
          )
          replace_once(
              qml,
              '                                        Slider { id: greenSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.greenPercent }\n',
              '                                        Slider { id: greenSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.greenPercent; onPressedChanged: if (!pressed) applyLedColour() }\n',
          )
          replace_once(
              qml,
              '                                        Slider { id: blueSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.bluePercent }\n',
              '                                        Slider { id: blueSlider; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.bluePercent; onPressedChanged: if (!pressed) applyLedColour() }\n',
          )
          replace_once(
              qml,
              '                                        Slider { id: whiteSlider; visible: modelData.hasWhite; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.whitePercent }\n',
              '                                        Slider { id: whiteSlider; visible: modelData.hasWhite; Layout.fillWidth: true; from: 0; to: 100; stepSize: 1; value: modelData.whitePercent; onPressedChanged: if (!pressed) applyLedColour() }\n',
          )

          set_colour_block = '''
                                    Cura.SecondaryButton
                                    {
                                        Layout.fillWidth: true
                                        text: "Set colour"
                                        onClicked:
                                        {
                                            if (root.printer != null)
                                            {
                                                root.printer.setLedColor(
                                                    modelData.object,
                                                    Math.round(redSlider.value),
                                                    Math.round(greenSlider.value),
                                                    Math.round(blueSlider.value),
                                                    modelData.hasWhite ? Math.round(whiteSlider.value) : 0,
                                                    Math.round(ledSlider.value)
                                                )
                                            }
                                        }
                                    }
'''
          replace_once(qml, set_colour_block, "")

          replace_once(
              qml,
              '                                    color: emergencyButton.clicks >= 2 ? "white" : UM.Theme.getColor("text")\n',
              '                                    color: "black"\n',
          )

          tests = "tests/test_v3_followup_regressions.py"
          replace_once(
              tests,
              '            "BOUNDARY_ALPHA = 0.94",\n',
              '            "BOUNDARY_ALPHA = 0.94",\n            "BOUNDARY_COLOUR = (1.0, 0.353, 0.0)",\n',
          )
          replace_once(
              tests,
              '            self.assertIn("Dark outline = Klipper mesh bounds; outside = extrapolated", qml)\n',
              '            self.assertIn("Neon orange outline = Klipper mesh bounds; outside = extrapolated", qml)\n',
          )
          replace_once(
              tests,
              '        self.assertIn(\'text: "Set colour"\', DASHBOARD_QML)\n        self.assertIn("root.printer.setLedColor", DASHBOARD_QML)\n',
              '        self.assertIn("function applyLedColour()", DASHBOARD_QML)\n        self.assertIn("onPressedChanged: if (!pressed) applyLedColour()", DASHBOARD_QML)\n        self.assertNotIn(\'text: "Set colour"\', DASHBOARD_QML)\n        self.assertIn("root.printer.setLedColor", DASHBOARD_QML)\n\n    def test_live_tuning_slider_ranges_expand_from_accepted_value(self):\n        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.speedFactorPercent * 2) : 200)", DASHBOARD_QML)\n        self.assertIn("to: Math.max(200, root.printer != null ? Math.ceil(root.printer.flowFactorPercent * 2) : 200)", DASHBOARD_QML)\n\n    def test_emergency_stop_text_stays_black_during_click_sequence(self):\n        self.assertIn(\'color: "black"\', DASHBOARD_QML)\n        self.assertNotIn(\'emergencyButton.clicks >= 2 ? "white"\', DASHBOARD_QML)\n',
          )
          PY

      - name: Verify regressions
        run: |
          python -m py_compile plugins/*.py tools/*.py
          python -m unittest tests.test_core tests.test_follow_controller tests.test_index tests.test_protocol tests.test_printer_config tests.test_source_contracts tests.test_sdk_compatibility tests.test_monitor_upload_regressions tests.test_hotfix_regressions tests.test_bed_mesh tests.test_v3_followup_regressions

      - name: Commit slider polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-slider-polish.yml
          git add plugins/MoonrakerMonitorDashboard.qml tests/test_v3_followup_regressions.py
          git commit -m "Polish tuning LED and emergency controls"
          git push origin HEAD:v3-unified-moonraker
