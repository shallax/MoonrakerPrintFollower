name: Tests

on:
  push:
    branches:
      - main
      - v3-unified-moonraker
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile plugin sources
        run: python -m py_compile plugins/*.py

      - name: Run standard-library unit and contract tests
        run: >-
          python -m unittest
          tests.test_core
          tests.test_follow_controller
          tests.test_index
          tests.test_protocol
          tests.test_printer_config
          tests.test_source_contracts
          tests.test_sdk_compatibility
