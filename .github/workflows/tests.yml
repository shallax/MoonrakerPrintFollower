name: Tests

on:
  push:
    branches:
      - main
      - v3-unified-moonraker
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile plugin sources
        run: python -m py_compile plugins/*.py tools/*.py

      - name: Run standard-library unit and contract tests
        run: >-
          python -m unittest
          tests.test_core
          tests.test_follow_controller
          tests.test_index
          tests.test_protocol
          tests.test_printer_config
          tests.test_source_contracts
          tests.test_sdk_compatibility
          tests.test_monitor_upload_regressions

      - name: Read package version
        id: package_meta
        run: |
          python - <<'PY'
          import json
          import os
          package = json.load(open("package.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={package['package_version']}\n")
          PY

      - name: Build Cura package
        run: python tools/build_curapackage.py

      - name: Verify Cura package contents
        run: |
          python - <<'PY'
          import json
          import pathlib
          import zipfile
          package = json.load(open("package.json", encoding="utf-8"))
          package_id = package["package_id"]
          version = package["package_version"]
          path = pathlib.Path("dist") / f"MoonrakerPrintFollower-v{version}.curapackage"
          assert path.is_file(), path
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              root = f"files/plugins/{package_id}/"
              required = {
                  "package.json",
                  root + "plugin.json",
                  root + "MoonrakerMonitor.qml",
                  root + "MoonrakerMonitorModel.py",
                  root + "MoonrakerMonitorRuntime.py",
                  root + "MoonrakerMonitorControls.py",
                  root + "MoonrakerMonitorTypedControls.py",
                  root + "MoonrakerMonitorEnhanced.qml",
                  root + "MoonrakerMonitorDashboard.qml",
                  root + "MoonrakerUploadDialog.qml",
                  root + "MoonrakerOutputDevice.py",
                  root + "MoonrakerOutputDeviceLifecycle.py",
                  root + "MoonrakerOutputDevicePlugin.py",
              }
              missing = sorted(required - names)
              assert not missing, missing
              embedded = json.loads(archive.read("package.json"))
              assert embedded["package_version"] == version
              assert embedded["package_id"] == package_id
          print(f"Verified {path}")
          PY

      - name: Upload Cura package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonrakerPrintFollower-v${{ steps.package_meta.outputs.version }}-curapackage
          path: dist/MoonrakerPrintFollower-v${{ steps.package_meta.outputs.version }}.curapackage
          if-no-files-found: error
          retention-days: 30
