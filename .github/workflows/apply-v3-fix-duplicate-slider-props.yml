name: Apply v3 slider QML hotfix

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply-slider-qml-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Apply QML hotfix
        run: python tools/apply_v3_fix_duplicate_slider_props.py

      - name: Verify regressions
        run: |
          python -m py_compile plugins/*.py tools/*.py
          python -m unittest tests.test_core tests.test_follow_controller tests.test_index tests.test_protocol tests.test_printer_config tests.test_source_contracts tests.test_sdk_compatibility tests.test_monitor_upload_regressions tests.test_hotfix_regressions tests.test_bed_mesh tests.test_v3_followup_regressions

      - name: Commit QML hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-fix-duplicate-slider-props.yml tools/apply_v3_fix_duplicate_slider_props.py
          git add plugins/MoonrakerMonitorDashboard.qml tests/test_v3_followup_regressions.py
          git commit -m "Fix duplicate slider QML properties"
          git push origin HEAD:v3-unified-moonraker
