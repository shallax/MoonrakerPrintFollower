name: Apply final release UX refactor

on:
  push:
    branches:
      - v3-unified-moonraker

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run final release UX refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v4
        with:
          ref: v3-unified-moonraker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply audit
        run: python tools/apply_release_ux_refactor.py

      - name: Validate hardened release candidate
        run: |
          python -m compileall -q plugins tools tests
          python tools/check_qml.py plugins
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/build_curapackage.py
          python tools/verify_curapackage.py dist/MoonrakerPrintFollower-v3.0.0.curapackage

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_release_ux_refactor.py
          rm -rf dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git commit -m "Complete v3 release UX and architecture audit"
          git push origin HEAD:v3-unified-moonraker
