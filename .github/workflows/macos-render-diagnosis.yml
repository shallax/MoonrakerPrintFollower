name: macOS renderer diagnosis

# An explicit investigation, never a replacement for a required gate.
# Compare the same Cura 5.13 unit with and without the recorder, preserving
# both the internal Qt frame and the actual desktop. Product code is unchanged.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        capture: ["off", "on"]
        render_loop: ["basic", "threaded"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      QSG_INFO: "1"
      QSG_RENDER_LOOP: "${{ matrix.render_loop }}"
      QT_LOGGING_RULES: "qt.scenegraph.general=true;qt.rhi.*=true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the plugin package
        run: |
          python -m pip install PySide6-Addons==6.10.2
          python tools/build_shaders.py
          python tools/build_curapackage.py
      - name: Stage Cura 5.13 and the existing connection harness
        run: |
          RUN_DIR_NAME="/tmp/mpf-render-diagnosis/${{ matrix.render_loop }}-${{ matrix.capture }}" \
            bash tools/native_harness.sh macos 5.13.0 connection
      - name: Sample the initial window
        run: |
          . /tmp/mpf-native/harness_env.sh
          python tools/mac_renderer_probe.py before
      - name: Drive the same unit with the selected capture mode
        timeout-minutes: 15
        run: |
          . /tmp/mpf-native/harness_env.sh
          export HARNESS_CAPTURE="${{ matrix.capture }}"
          export HARNESS_CAPTURE_REASON="Explicit renderer diagnostic comparison"
          python -u tests/harness/runner.py suite connection
      - name: Sample the final window and keep native Qt diagnostics
        if: always()
        run: |
          . /tmp/mpf-native/harness_env.sh
          python tools/mac_renderer_probe.py after || true
          mkdir -p "$HARNESS_RUN_DIR/renderer-diagnostics"
          cp /tmp/mpf-native/cura_run.log "$HARNESS_RUN_DIR/renderer-diagnostics/cura-run.log"
          cp /tmp/mpf-native/native_harness.log "$HARNESS_RUN_DIR/renderer-diagnostics/setup.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-render-diagnosis-${{ matrix.render_loop }}-${{ matrix.capture }}
          path: /tmp/mpf-render-diagnosis/${{ matrix.render_loop }}-${{ matrix.capture }}/
          if-no-files-found: error
