# The 5.7-5.13 UI test sweep: the full suite on every supported Cura
# version, as an ON-DEMAND matrix — each version/group pair is its own
# job, so the whole sweep lands in the time of its slowest unit
# instead of the serial local grind (TESTING.md §5's version sweep).
# Trigger it manually from the Actions tab, or:
#   gh workflow run "UI test sweep" --ref release/v4.5.0
name: UI test sweep

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version:
          - "5.7.0"
          - "5.8.0"
          - "5.9.0"
          - "5.10.0"
          - "5.11.0"
          - "5.12.0"
          - "5.13.0"
        group:
          - configure
          - connection
          - console
          - files
          - motion
          - preview
          - printing
          - probe
          - settings
          - status
          - stress
          - temperatures
          - visual
          - webcams
    env:
      HARNESS_CONTAINER: mpf-cura-sweep-${{ matrix.version }}-${{ matrix.group }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the plugin package
        run: make package >/dev/null

      - name: Restore the pinned Cura tree
        id: cura-cache
        uses: actions/cache@v6
        with:
          path: /tmp/mpf/cura_versions
          key: mpf-cura-${{ matrix.version }}

      - name: Fetch the pinned Cura
        run: python3 tools/fetch_cura.py "${{ matrix.version }}"

      - name: Pull the harness image and start the container
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
          if docker pull ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }} >/dev/null 2>&1; then
            docker tag ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }} mpf-cura-harness
          else
            docker build -q -t mpf-cura-harness tools/harness
          fi
          docker rm -f "$HARNESS_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --init --name "$HARNESS_CONTAINER" --cap-add=SYS_PTRACE \
              -v /tmp/mpf:/tmp/mpf mpf-cura-harness sleep infinity

      # One attempt per unit (the gate ruling): a retried unit would
      # hide flakiness. The gallery is the proof.
      - name: Run the unit
        run: |
          mkdir -p /tmp/mpf
          timeout 15m env \
              CURA_VERSION="${{ matrix.version }}" \
              MODE=suite SCENARIO_GROUP="${{ matrix.group }}" \
              RUN_DIR_NAME="/tmp/mpf/ui-artifacts/sweep/${{ github.run_id }}/${{ matrix.version }}-${{ matrix.group }}" \
              ./tools/ui_test.sh

      - name: Upload the failed unit's gallery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-${{ matrix.version }}-${{ matrix.group }}
          path: /tmp/mpf/ui-artifacts/sweep/${{ github.run_id }}/${{ matrix.version }}-${{ matrix.group }}
          if-no-files-found: warn
