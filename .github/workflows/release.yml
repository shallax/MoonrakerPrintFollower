name: Release

on:
  push:
    tags:
      - "v*"
  # The gate loop runs without a tag: the full matrix on demand from
  # main, so a failing unit costs minutes instead of a junk tag.
  workflow_dispatch:
  # PRs that touch the gate machinery run the full matrix before they
  # can merge; product-code PRs keep the fast two-unit smoke in ci.yml.
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/ui_test.sh"
      - "tools/harness_release.sh"
      - "tools/harness_smoke.sh"
      - "tools/harness/**"
      - "tools/fetch_cura.py"
      - "tests/harness/**"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Validate tag and metadata versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          package = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path("plugins/plugin.json").read_text(encoding="utf-8"))
          if package["package_version"] != expected:
              raise SystemExit(f"package.json version {package['package_version']} != tag {expected}")
          if plugin["version"] != expected:
              raise SystemExit(f"plugin.json version {plugin['version']} != tag {expected}")
          PY

      - name: Run release checks
        run: |
          python -m compileall -q plugins tools tests
          python tools/check_qml.py plugins
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install Qt test runtime (Cura supplies Qt in production)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          python -m pip install PyQt6==6.11.0

      - name: Run the full suite with the real Qt runtime
        run: |
          python -c "from PyQt6.QtCore import QCoreApplication"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify release artifacts
        run: |
          python tools/build_curapackage.py
          python tools/build_marketplace_source.py
          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["package_version"])')"
          python tools/verify_curapackage.py "dist/MoonrakerPrintFollower-v${VERSION}.curapackage"
          python tools/verify_marketplace_source.py "dist/MoonrakerPrintFollower-v${VERSION}-source.zip"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the harness image
        uses: docker/build-push-action@v6
        with:
          context: tools/harness
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:latest
            ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 1

      - name: Install gitleaks
        run: |
          # The runner image dropped the preinstalled binary (the 3.5.0
          # release scan failed with "command not found"); pin the same
          # version the dev container gates use.
          wget -qO /tmp/gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            && tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks \
            && rm /tmp/gitleaks.tar.gz

      - name: Scan the release artifacts for secrets
        run: |
          # The local gates run gitleaks, but the release workflow never
          # did while the README claimed it — panel security P3.
          gitleaks detect --no-git --no-banner --redact .

  gate:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: smoke-primary,     cura: "5.13.0", budget: 20, group: smoke }
          - { name: group-connection,  cura: "5.13.0", budget: 15, group: connection }
          - { name: group-status,      cura: "5.13.0", budget: 15, group: status }
          - { name: group-temperatures, cura: "5.13.0", budget: 15, group: temperatures }
          - { name: group-console,     cura: "5.13.0", budget: 15, group: console }
          - { name: group-webcams,     cura: "5.13.0", budget: 15, group: webcams }
          - { name: group-files,       cura: "5.13.0", budget: 15, group: files }
          - { name: group-motion,      cura: "5.13.0", budget: 15, group: motion }
          - { name: group-printing,    cura: "5.13.0", budget: 15, group: printing }
          - { name: group-settings,    cura: "5.13.0", budget: 15, group: settings }
          - { name: group-visual,      cura: "5.13.0", budget: 15, group: visual }
          - { name: group-preview,     cura: "5.13.0", budget: 15, group: preview }
          - { name: group-probe,       cura: "5.13.0", budget: 15, group: probe }
          - { name: smoke-secondary,   cura: "5.12.0", budget: 20, group: smoke }
    env:
      HARNESS_CONTAINER: mpf-cura-gate-${{ matrix.name }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the plugin package
        run: make package >/dev/null

      - name: Restore the pinned Cura tree
        id: cura-cache
        uses: actions/cache@v4
        with:
          path: /tmp/mpf/cura_versions
          key: mpf-cura-${{ matrix.cura }}

      - name: Fetch the pinned Cura
        run: python3 tools/fetch_cura.py "${{ matrix.cura }}"

      - name: Pull the harness image and start the container
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }} mpf-cura-harness
          docker rm -f "$HARNESS_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --init --name "$HARNESS_CONTAINER" --cap-add=SYS_PTRACE \
              -v /tmp/mpf:/tmp/mpf mpf-cura-harness sleep infinity

      # One attempt per unit (the gate ruling): a retried unit would
      # hide flakiness. The gallery is the proof — every unit's
      # evidence lands under this workflow run's root.
      - name: Run the unit
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/mpf
          timeout "${BUDGET}m" env \
              CURA_VERSION="${{ matrix.cura }}" \
              MODE=suite SCENARIO_GROUP="${{ matrix.group }}" \
              RUN_DIR_NAME="/tmp/mpf/ui-artifacts/runs/${{ github.run_id }}/${{ matrix.name }}" \
              ./tools/ui_test.sh
        env:
          BUDGET: ${{ matrix.budget }}

      - name: Upload the unit's gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.name }}
          path: /tmp/mpf/ui-artifacts/runs/${{ github.run_id }}/${{ matrix.name }}
          if-no-files-found: warn

  publish:
    needs: [release, gate]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Extract release notes from changelog
        run: |
          python - <<'PY' > /tmp/release-notes.md
          import os
          import pathlib

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version}\n"
          if marker not in text:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          section = text.split(marker, 1)[1]
          section = section.split("\n## ", 1)[0].strip()
          print(section)
          PY

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURA="dist/MoonrakerPrintFollower-v${VERSION}.curapackage"
          SOURCE="dist/MoonrakerPrintFollower-v${VERSION}-source.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$CURA" "$SOURCE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$CURA" "$SOURCE" \
              --title "Moonraker Print Follower $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
