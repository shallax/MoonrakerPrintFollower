# Selected release and Git history (newest first; original provenance retained):
# 2026-10-18 — 6.0.0: Include the verified reusable Python wheel in future release assets.
# 2026-10-12 [5a32b35] Prepare 5.4.0 runtime mirror and follower controls
# 2026-10-12 [abf18f3] Mirror optional runtime assets on plugin releases
# 2026-09-06 [683f553] Consolidate release packaging maintenance

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: read
  security-events: write

jobs:
  prepare:
    name: Prepare tag release
    runs-on: ubuntu-26.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tag on current main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "::error::Release tag must point to current main ($main_commit); got $tag_commit"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate tag and metadata versions
        run: |
          python - <<'PYCODE'
          import json
          import os
          import pathlib

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          package = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          plugin = json.loads(pathlib.Path("mpf/plugin.json").read_text(encoding="utf-8"))
          if package["package_version"] != expected:
              raise SystemExit(f"package.json version {package['package_version']} != tag {expected}")
          if plugin["version"] != expected:
              raise SystemExit(f"plugin.json version {plugin['version']} != tag {expected}")
          PYCODE

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the harness image
        uses: docker/build-push-action@v7
        with:
          context: tools/harness
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:latest
            ghcr.io/${{ github.repository_owner }}/mpf-cura-harness:sha-${{ github.sha }}

  ci:
    name: Release checks and Cura gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      tag_release: true
      release_gate: true
    secrets: inherit

  publish:
    name: Prepare release assets
    needs: ci
    runs-on: ubuntu-26.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Stage pinned optional runtime assets
        run: |
          if [[ "$GITHUB_REF_NAME" == "v5.4.0" ]]; then
            python tools/stage_runtime_mirror.py "$RUNNER_TEMP/runtime-assets"
          else
            python tools/stage_runtime_mirror.py "$RUNNER_TEMP/runtime-assets" --source-release v5.4.0
          fi
          python tools/stage_runtime_mirror.py "$RUNNER_TEMP/runtime-assets" --verify-only

      - name: Extract release notes from changelog
        run: |
          python - <<'PY' > /tmp/release-notes.md
          import os
          import pathlib

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version}\n"
          if marker not in text:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          section = text.split(marker, 1)[1]
          section = section.split("\n## ", 1)[0].strip()
          print(section)
          PY

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURA="dist/MoonrakerPrintFollower-v${VERSION}.curapackage"
          SOURCE="dist/MoonrakerPrintFollower-v${VERSION}-source.zip"
          WHEEL="dist/library/moonraker_print_follower-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$DRAFT" != "true" ]]; then
              echo "::error::Refusing to replace assets on a published release"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$CURA" "$SOURCE" "$WHEEL" "$RUNNER_TEMP/runtime-assets/"* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$CURA" "$SOURCE" "$WHEEL" "$RUNNER_TEMP/runtime-assets/"* \
              --draft --verify-tag \
              --title "Moonraker Print Follower $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Verify uploaded runtime asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_runtime_release.py "$GITHUB_REF_NAME"
