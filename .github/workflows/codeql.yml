# CodeQL static analysis, surfaced in the Security tab's code scanning
# dashboard (free for public repositories).
name: "CodeQL"

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "23 7 * * 3"

permissions:
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
