# Selected Git history (newest first; oldest and latest two content changes):
# 2026-10-01 [b5f5511] Revert "Capitalise the remaining top-level directories"
# 2026-10-01 [1d8bd42] Capitalise the remaining top-level directories
# 2026-09-23 [b4c984d] 4.6.0: codecov ignores tests and tools explicitly

# Codecov: the plugin is what ships, so the plugin is what is measured.
#
# The coverage job already uploads a report written with
# `--include="mpf/*"` (ci.yml, "Run the suite under coverage"), so
# this does not change a number today — it is the guard that keeps
# tests/ and tools/ out of the report if that upload ever broadens, and
# it states the intent where a reader of the report will look for it.
ignore:
  - "tests"
  - "tools"
