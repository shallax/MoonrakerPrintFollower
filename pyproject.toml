# Release history:
# 2026-10-18 — 6.0.0: Package reusable G-code and rendering components with optional Qt.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moonraker-print-follower"
version = "6.0.0"
description = "Reusable G-code indexing, toolpath geometry and optional Qt rendering from MoonrakerPrintFollower"
readme = "docs/LIBRARY.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "docs/THIRDPARTYSOFTWARE.md"]
authors = [{name = "Thomas Pedley", email = "moonrakerprintfollower@maintain.contact"}]
dependencies = []

[project.optional-dependencies]
qt = ["PyQt6>=6.11,<7"]
fast = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/shallax/MoonrakerPrintFollower"
Documentation = "https://github.com/shallax/MoonrakerPrintFollower/blob/release/v6.0.0/docs/LIBRARY.md"

[tool.setuptools.packages.find]
include = ["mpf", "mpf.*"]

[tool.setuptools.package-data]
mpf = ["**/*.qml", "**/*.json", "**/*.svg", "**/*.png", "**/*.qsb", "**/*.vert", "**/*.frag", "**/*.shader", "**/*.js", "**/qmldir", "qmldir"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/.*", "**/*.pyc", "**/*.pyo", "**/*.orig", "**/*.rej", "**/*.swp", "**/*.swo", "**/*.tmp", "**/*.bak", "**/*~"]
