title = "MoonrakerPrintFollower gitleaks config"

[[rules]]
id = "moonraker-api-key"
description = "A bare 32-hex Moonraker API key"
regex = '''\b[a-f0-9]{32}\b'''
entropy = 3.0

[allowlist]
description = "Known synthetic fixtures and standard tool tags"
paths = ['''(?i)tools/capture_settings\.py''', '''.*CACHEDIR\.TAG''']
regexes = ['''a1b2c3d4e5f60718293a4b5c6d7e8f90''']
